# United States: country profile
# Status: APPROVED by the editor on 28 November 2026 (researched by Claude on 18 and 19 November 2026).
# Sensitive-topic flags (Anthropic, elections) still need a second reviewer.
# Every statement cites one or more sources from the list at the bottom of this file.
# Direct quotes were copied from the source pages on the access date.
# The principles section uses NIST's characteristics of trustworthy AI, the US government's own
# published set, as the editor decided on 18 November 2026.

code: US
name: United States
status: draft
last_reviewed: 2026-11-28
editor_approved: true
reviewers: []

summary:
  overview:
    - text: >-
        The US has no general federal AI law. Federal policy favours voluntary collaboration with
        developers and a single national framework that would limit state AI laws, while California
        and New York have passed laws for developers of the most capable models. Members of Congress
        and others have identified areas for improvement, including binding rules for those models,
        incident reporting and protections for children who use chatbots.
      sources: [baker-frontier-2026, wh-framework-2026, fpf-sb53-2025, cooley-raise-2026, foley-blue-wave-2026, kelleydrye-chatbots-2026]
    - text: >-
        The government's AI testing centre at NIST tests frontier models under voluntary agreements
        with five developers, and had completed more than 40 evaluations by May 2026.
      sources: [nist-caisi-2026]
    - text: >-
        In September 2026 the President and leaders of six AI companies signed a voluntary accord on
        frontier model safety. In November 2026 Democrats won control of both chambers of Congress
        from January 2027, with several frontier AI safety bills pending.
      sources: [aandp-si-2026, npr-midterms-2026, nextgov-bills-2026]
    - text: >-
        Surveys show concern about the pace of AI. In February 2026, 63% of US adults said AI is
        advancing too quickly, and 67% had little or no confidence in the government to regulate it
        effectively.
      sources: [pew-americans-ai-2026]
  regulation_line:
    text: >-
      No general federal AI law. Voluntary federal frameworks and testing, with state laws on
      frontier models, chatbots and automated decisions.
    sources: [baker-frontier-2026, nist-rmf, fpf-sb53-2025, cla-chatbots-2025, skadden-colorado-2026]

facets:
