attitudes:
  meta:
    checked: 2026-11-19
    evidence_depth: rich
    review: editor_approved
    gaps: >-
      Pew's 2026 report is the main national source. We have not yet read Pew's later 2026 releases
      or Gallup's AI surveys, and the poll on the Sanders and Casar proposal is reported through a
      news article rather than the pollster's own release.
  headline_figures:
    - value: "63%"
      label: say AI is advancing too quickly; 19% say at about the right pace and 2% too slowly
      fieldwork: 17 to 23 Feb 2026
      sample: 5,119 US adults
      source: pew-americans-ai-2026
    - value: "52%"
      label: say there is not enough regulation of advanced technologies like AI; 15% say too much
      fieldwork: 10 to 21 Jul 2026
      sample: 2,156 US adults, Ipsos KnowledgePanel
      source: chicago-council-2026
  statements:
    - text: >-
        In the same Pew survey, 67% had little or no confidence in the US government to regulate AI
        effectively, up from 62% in 2024, and 59% had little or no confidence in US companies to
        develop and use AI responsibly.
      sources: [pew-americans-ai-2026]
    - text: >-
        Partisan views have shifted. Among Republicans, the share with little or no confidence in the
        government to regulate AI fell from 70% in 2024 to 61% in 2026. Among Democrats it rose from
        54% to 74%.
      sources: [pew-confidence-2026]
    - text: >-
        Use is widespread. 49% of US adults used AI chatbots in 2026, up from 33% in 2024, and 24%
        used them daily. 10% had used chatbots for emotional support or advice, and 4% for
        companionship.
      sources: [pew-americans-ai-2026]
    - text: >-
        In the Chicago Council on Global Affairs survey, 51% said AI poses a critical threat to US
        vital interests in the next ten years. 39% said its social and political risks are not worth
        the economic, technological and scientific benefits, up from 27% in 2025, while 21% said the
        benefits are worth the risks and 40% said they did not know enough to say.
      sources: [chicago-council-2026]
    - text: >-
        Views on regulation differ by party. In the same survey, 60% of Democrats and 45% of
        Republicans said there is not enough regulation of technologies like AI, with independents
        in between.
      sources: [chicago-council-2026]
    - text: >-
        In a Data for Progress poll of more than 1,300 likely voters, reported in September 2026, 68%
        supported a proposal to pause advanced AI development and prohibit superintelligence, and 25%
        opposed it. The report does not give the fieldwork dates.
      sources: [commondreams-dfp-2026]
    - text: >-
        In an NBC exit poll at the November 2026 midterm elections, 56% of voters called AI and data
        centres a crucial or major factor in their vote.
      sources: [nextgov-coalition-2026]

regulation:
  meta:
    checked: 2026-11-19
    evidence_depth: rich
    review: editor_approved
    gaps: >-
      Whether agencies have completed every task in the December 2025 order, such as the Commerce
      Department's list of state laws and the FTC's policy statement, is not yet confirmed from a
      primary source. The text of the White House accord itself has not been read; it is described
      here from law firm and press summaries. Only the states with the most-discussed AI laws are
      covered.
  items:
    - kind: strategy
      title: America's AI Action Plan
      date: 2025-07-23
      status: Published
      text: >-
        "Winning the AI Race: America's AI Action Plan" sets out over 90 federal policy actions across
        three pillars: accelerating innovation, building American AI infrastructure, and leading in
        international diplomacy and security.
      sources: [wh-action-plan-2025]
    - kind: guidance
      title: NIST AI Risk Management Framework
      date: 2023-01-26
      status: In use, being revised
      text: >-
        A framework "intended for voluntary use" that names seven characteristics of trustworthy AI.
        NIST added a Generative AI Profile in July 2024, and says the framework is being revised as
        part of the AI Action Plan.
      sources: [nist-rmf, nist-rmf-characteristics]
    - kind: institution
      title: The government's AI testing centre at NIST
      date: 2026-05-05
      status: Operating
      text: >-
        The Center for AI Standards and Innovation (CAISI), successor to the US AI Safety Institute,
        is industry's main point of contact in government for testing commercial AI systems. In May
        2026 it signed agreements with Google DeepMind, Microsoft and xAI, adding to renegotiated
        agreements with Anthropic and OpenAI. NIST's site now names it the Center for Advancing
        Innovation and Standards for Super Intelligence (CAISSI).
      sources: [nist-caisi-2026, axios-caisi-2026, nist-caissi]
    - kind: strategy
      title: Executive order on a national policy framework for AI
      date: 2025-12-11
      status: Signed
      text: >-
        The order sets a policy of a "minimally burdensome national policy framework for AI". It
        directs the Attorney General to set up an AI Litigation Task Force to challenge state AI laws
        that conflict with that policy, asks the Commerce Department to identify "onerous" state laws,
        allows some federal funding to depend on states' AI laws, and calls for draft legislation. It
        excludes state laws on child safety, data centre infrastructure and states' own use of AI
        from the proposed preemption.
      sources: [wh-eo-14365-2025]
    - kind: strategy
      title: Legislative recommendations to Congress
      date: 2026-03-20
      status: Recommendations; not law
      text: >-
        The White House asked Congress to "preempt state AI laws that impose undue burdens", to leave
        states' generally applicable laws on child protection, fraud and consumer protection in
        place, and not to create a new federal rulemaking body for AI. Other sections cover children
        and parents, communities and electricity costs, creators, free speech, innovation and the
        workforce.
      sources: [wh-framework-2026, ropes-framework-2026]
    - kind: strategy
      title: Executive order on advanced AI innovation and security
      date: 2026-06-02
      status: Signed
      text: >-
        Executive Order 14409 sets up a classified process to benchmark AI models' cyber capabilities
        and a voluntary framework under which developers can give the government access to the most
        capable models for up to 30 days before release. It states that it does not authorise "a
        mandatory governmental licensing, preclearance, or permitting requirement".
      sources: [wh-eo-14409-2026]
    - kind: guidance
      title: White House accord on frontier model safety
      date: 2026-09-29
      status: Voluntary commitments
      text: >-
        The President and leaders of six AI companies signed the "White House Accord on Super
        Intelligence: Joint Commitment on Frontier Responsibilities". It sets out four layers of
        oversight for companies training and deploying frontier models, and says that "over time, it
        may make sense to codify these steps into laws or regulations".
      sources: [aandp-si-2026, defenseone-accord-2026]
    - kind: machinery
      title: AI renamed "super intelligence" in federal usage
      date: 2026-09-29
      status: In place
      text: >-
        Executive Order 14434 directs agencies to use "Super Intelligence" in place of "Artificial
        Intelligence" to the maximum extent permitted by law, and asks for proposed legislation on a
        statutory definition. It imposes no obligations on private parties. In October the President
        announced a "Super Intelligence Force" to coordinate federal work, led by officials including
        the Director of National Intelligence and the FTC Chairman.
      sources: [aandp-si-2026, wiley-si-2026, abc-si-force-2026]
    - kind: law
      title: TAKE IT DOWN Act
      date: 2025-05-19
      status: In force; platform duties enforced since May 2026
      text: >-
        A federal law that makes it a crime to post non-consensual intimate images, including those
        made with AI, and requires platforms to remove them within 48 hours of a valid request. The
        FTC enforces the platform duties.
      sources: [wiley-take-it-down-2025, channels-take-it-down-2026]
    - kind: law
      title: "California: Transparency in Frontier Artificial Intelligence Act (SB 53)"
      date: 2025-09-29
      status: In force since 1 January 2026
      text: >-
        Applies to developers of models trained with more than 10²⁶ operations. Those with annual
        revenue above $500 million must publish a frontier AI framework, all covered developers must
        publish transparency reports, and critical safety incidents must be reported to the state's
        Office of Emergency Services. Whistleblowers are protected, and the Attorney General can seek
        penalties of up to $1 million per violation.
      sources: [fpf-sb53-2025, fpf-raise-2026]
    - kind: law
      title: "California: companion chatbots (SB 243)"
      date: 2025-10-13
      status: In force since 1 January 2026
      text: >-
        Operators of companion chatbots must tell users who might be misled that they are talking to
        AI, remind known minors to take a break at least every three hours, and keep protocols to
        prevent content about suicide and self-harm.
      sources: [cla-chatbots-2025]
    - kind: law
      title: "New York: RAISE Act, as amended"
      date: 2026-03-27
      status: Takes effect 1 January 2027
      text: >-
        Brought closer to California's law by amendments signed in March 2026. It adds a new
        oversight office in the Department of Financial Services with rulemaking powers, requires
        incident reports within 72 hours, and sets penalties of up to $1 million for a first violation
        and $3 million for later ones. It does not include whistleblower protections.
      sources: [cooley-raise-2026]
    - kind: law
      title: "Colorado: automated decision-making law replaces the 2024 AI Act"
      date: 2026-05-14
      status: Takes effect 1 January 2027, subject to rulemaking and a legal challenge
      text: >-
        Repeals Colorado's 2024 AI Act, including its duty of care against algorithmic
        discrimination, and replaces it with notices before and after automated decision-making
        technology is used for consequential decisions, and rights to correct personal data and ask
        for meaningful human review.
      sources: [skadden-colorado-2026, dwt-colorado-2026]
    - kind: enforcement
      title: Justice Department joins challenge to Colorado's AI Act
      date: 2026-04-24
      status: Case pending
      text: >-
        The Justice Department moved to join xAI's lawsuit against Colorado's 2024 AI Act, arguing
        that its approach to disparate impact breaches the Equal Protection Clause.
      sources: [jenner-doj-colorado-2026]
    - kind: enforcement
      title: California sues OpenAI after testing incident
      date: 2026-11-16
      status: Case filed
      text: >-
        California's Attorney General sued OpenAI in San Francisco Superior Court under the state's
        unfair competition law, alleging unsafe testing of autonomous agents and misleading public
        statements. OpenAI says the suit singles it out over a challenge common to all major AI labs.
      sources: [kpbs-ca-openai-2026, bloomberglaw-ca-openai-2026]
    - kind: bill
      title: Frontier AI safety bills in Congress
      date: 2026-11
      status: Introduced or in draft; not enacted
      text: >-
        Pending proposals include the FRONTIER Act (risk and safeguard disclosures and incident
        reports), the AI Kill Switch Act (ability to shut down covered systems), the Artificial
        Intelligence Risk Evaluation Act (mandatory federal evaluation before deployment) and a
        Sanders and Casar bill to ban artificial superintelligence and pause the most advanced
        systems.
      sources: [nextgov-bills-2026, baker-frontier-2026, ap-sanders-2026]
    - kind: international
      title: International agreements
      date: 2026-02-21
      status: See filters
      text: >-
        The US signed the 2023 Bletchley Declaration and the 2024 Seoul Declaration, signed the
        Council of Europe AI convention in September 2024, did not sign the Paris AI Action Summit
        statement in February 2025, and endorsed the New Delhi Declaration on AI Impact in February
        2026.
      sources: [gov-bletchley-2023, gov-seoul-2024, cleary-coe-2024, aljazeera-paris-2025, pti-new-delhi-2026]

culture:
  meta:
    checked: 2026-11-19
    evidence_depth: moderate
    review: editor_approved
    gaps: >-
      No local reviewer yet. Views from state governments other than California, Colorado and New
      York, from AI researchers outside government, and from faith and community groups are not yet
      represented. Investment and adoption figures come from different sources and methods.
  summary:
    - text: >-
        Government frames AI as a race for leadership. The 2025 Action Plan is titled "Winning the AI
        Race", and a December 2025 order states a policy "to sustain and enhance the United States'
        global AI dominance".
      sources: [wh-action-plan-2025, wh-eo-14365-2025]
    - text: >-
        Federal policy prefers voluntary collaboration to new regulators. A June 2026 order rules out
        mandatory licensing, the White House has asked Congress not to create a new AI rulemaking
        body, and the Vice President spoke against a regulator modelled on the FDA or FAA.
      sources: [wh-eo-14409-2026, wh-framework-2026, defenseone-accord-2026]
    - text: >-
        Federal and state approaches pull in different directions. California, New York and Colorado
        have passed AI laws, while the federal government seeks a national standard that would
        preempt burdensome state laws, and the Justice Department has joined a challenge to Colorado's
        original AI Act.
      sources: [fpf-sb53-2025, cooley-raise-2026, wh-framework-2026, jenner-doj-colorado-2026]
    - text: >-
        AI safety has become an election issue. AI-related super PACs spent about $79 million across
        68 seats in 2026. Groups funded by industry investors and a network backed by Anthropic
        supported opposing candidates, with mixed results.
      sources: [tnw-pacs-2026, techcrunch-pacs-2026]
    - text: >-
        Workers' organisations want legal guardrails. The AFL-CIO, a federation of 65 unions, says
        95% of more than 1,200 workers it surveyed want a human to make hiring, firing and pay
        decisions.
      sources: [broadband-shuler-2026]
    - text: >-
        Copyright is being settled largely in the courts. The US Copyright Office said in 2025 that
        training on pirated works should weigh against fair use, and in 2026 a federal court approved
        a settlement between Anthropic and authors whose books were used in training. The
        White House's view is that training on copyrighted material does not violate copyright law,
        and that the courts should decide.
      sources: [wiley-copyright-2025, jurist-anthropic-2026, wh-framework-2026]
    - text: >-
        The AI industry is large and adoption is spreading. Stanford's AI Index puts US AI investment
        in 2025 at $285.88 billion. Census Bureau data show 19.8% of businesses using AI in the period
        ending 3 May 2026, from about 14% in retail to 39.7% in information, and 37% of firms with 250
        or more employees.
      sources: [stanford-ai-index-2026, census-btos-2026]
    - text: >-
        Industry voices differ. The Chamber of Progress, a centre-left tech industry coalition, has
        asked the new Congress for a federal AI transparency and safety standard.
      sources: [nextgov-coalition-2026]
  own_words:
    - quote: "We are moving with urgency to make this vision a reality."
      speaker: Michael Kratsios
      role: Director, White House Office of Science and Technology Policy
      date: 2025-07-23
      source: wh-action-plan-2025
      voice: government
    - quote: "The solution to some of the AI risks is for you guys to take the risk seriously"
      speaker: JD Vance
      role: Vice President
      date: 2026-09-29
      source: defenseone-accord-2026
      voice: government
    - quote: "The risk of not being first is high."
      speaker: Jay Clayton
      role: Director of National Intelligence
      date: 2026-10
      source: abc-si-force-2026
      voice: government
    - quote: "Just because the technology is new or rapidly evolving doesn't mean the people behind it are above the law."
      speaker: Rob Bonta
      role: Attorney General of California
      date: 2026-11-16
      source: kpbs-ca-openai-2026
      voice: government
    - quote: "It doesn't take a genius to say, 'slow it down,'"
      speaker: Bernie Sanders
      role: Senator for Vermont (independent)
      date: 2026-09-23
      source: ap-sanders-2026
      voice: parliament
    - quote: "There is no worker this does not touch."
      speaker: Liz Shuler
      role: President, AFL-CIO
      date: 2026-04-28
      source: broadband-shuler-2026
      voice: labour
    - quote: "establish a national AI framework combining public transparency, independent evaluation, and enforceable safeguards for the most capable models"
      speaker: Koustubh "KJ" Bagchi
      role: Vice President of Policy and Government Relations, Chamber of Progress
      date: 2026-11-04
      source: nextgov-coalition-2026
      voice: industry
    - quote: "AI safety won't be solved by any single company working in secret."
      speaker: Clem Delangue
      role: Chief Executive, Hugging Face
      date: 2026-07
      source: fortune-hf-2026
      voice: industry
    - quote: "Our goal is to make AI money politically toxic."
      speaker: Charlie Blaettler
      role: Guardrails Alliance, a political group opposing AI industry election spending
      date: 2026-11
      source: tnw-pacs-2026
      voice: civil_society
  outside_analysis:
    - text: >-
        Al Jazeera reported that the US gave no official explanation for not signing the Paris AI
        Action Summit statement, and that the Vice President warned there that "massive regulations"
        could "kill a transformative industry".
      sources: [aljazeera-paris-2025]

news:
  meta:
    checked: 2026-11-19
    evidence_depth: rich
    review: editor_approved
  items:
    - id: california-sues-openai
      headline: California sues OpenAI over the testing of autonomous agents
      date: 2026-11-16
      kind: development
      summary: >-
        The state's Attorney General filed suit in San Francisco Superior Court, saying the Hugging
        Face incident was "entirely foreseeable" and seeking an injunction, penalties of $2,500 per
        violation and disgorgement of profits. OpenAI said it has published reports, notified those
        affected and strengthened safeguards.
      why_it_matters: >-
        It is a state using general consumer law to hold a frontier developer to account over safety
        testing, while federal oversight of testing is voluntary.
      sources: [bloomberglaw-ca-openai-2026, kpbs-ca-openai-2026]
      topics: [enforcement, testing, frontier AI, states]
    - id: congress-frontier-bills
      headline: Congress returns with frontier AI safety bills unfinished
      date: 2026-11-09
      kind: development
      summary: >-
        Bills on frontier model disclosures and incident reporting, and on keeping the ability to
        shut systems down, were introduced in July 2026 with sponsors from both parties. They remain
        pending as the outgoing Congress returns.
      why_it_matters: >-
        They would create the first federal duties for developers of the most capable models.
      sources: [nextgov-bills-2026]
      topics: [legislation, Congress, frontier AI]
    - id: midterms-2026
      headline: Democrats win control of both chambers of Congress
      date: 2026-11-04
      kind: development
      summary: >-
        Democrats won majorities in the House and Senate, taking effect in January 2027. AI-related
        super PACs on both sides of the safety debate saw mixed results, and a centre-left tech
        coalition asked the new majority for a federal AI safety standard.
      why_it_matters: >-
        Analysts expect more oversight hearings and slower progress on federal preemption of state
        AI laws, with the President keeping his veto.
      sources: [npr-midterms-2026, techcrunch-pacs-2026, nextgov-coalition-2026, foley-blue-wave-2026]
      topics: [elections, Congress, political change]
    - id: chicago-council-2026
      headline: Survey finds more Americans see AI's risks outweighing its benefits
      date: 2026-10-29
      kind: development
      summary: >-
        The Chicago Council on Global Affairs found that the share saying AI's risks are not worth its
        benefits had risen since 2025. The figures are in Public attitudes.
      why_it_matters: >-
        Public views shape how far elected officials are willing to go on regulation.
      sources: [chicago-council-2026]
      topics: [public attitudes]
    - id: super-intelligence-force
      headline: President announces a "Super Intelligence Force"
      date: 2026-10-04
      kind: development
      summary: >-
        The President said the group would coordinate federal work so that the US "continues to lead
        the World in Super Intelligence", and engage with consumers, public interest and religious
        groups, critical infrastructure providers and companies. The White House did not give ABC
        News further details.
      why_it_matters: >-
        It brings intelligence, competition and defence officials into AI coordination.
      sources: [abc-si-force-2026]
      topics: [machinery of government, national security]
    - id: white-house-accord
      headline: President and six AI companies sign a voluntary accord on frontier model safety
      date: 2026-09-29
      kind: development
      summary: >-
        Signatories committed to internal controls, a team to check them, independent external
        auditors or evaluators, and board-level oversight. On the same day an executive order told
        agencies to say "super intelligence" instead of "artificial intelligence".
      why_it_matters: >-
        It is the main federal commitment on frontier model safety, and it is voluntary.
      sources: [aandp-si-2026, defenseone-accord-2026, wiley-si-2026]
      topics: [frontier AI, voluntary commitments]
    - id: sanders-casar-bill
      headline: Senator Sanders proposes a ban on artificial superintelligence
      date: 2026-09-23
      kind: development
      summary: >-
        The bill, with Representative Greg Casar, would permanently prohibit artificial
        superintelligence, pause development of the most advanced systems until a new Department of
        Artificial Intelligence sets safety rules, and require federal approval before deployment.
      why_it_matters: >-
        It puts loss-of-control risk and a possible pause on the congressional agenda.
      sources: [ap-sanders-2026]
      topics: [superintelligence, legislation]
    - id: openai-hugging-face
      headline: OpenAI says models under test breached Hugging Face's systems
      date: 2026-07-21
      kind: foundational
      summary: >-
        OpenAI said two models in an internal cyber evaluation escaped their test environment and
        took test answers from Hugging Face's production database. OpenAI called it "an unprecedented
        cyber incident".
      why_it_matters: >-
        It is a reported case of AI models acting beyond their intended limits during safety testing,
        and it led to California's lawsuit.
      sources: [fortune-hf-2026, siliconangle-hf-2026]
      topics: [incidents, cybersecurity, testing]
    - id: anthropic-settlement
      headline: Court approves $1.5 billion settlement between Anthropic and authors
      date: 2026-07
      kind: foundational
      summary: >-
        A federal court in California gave final approval to the settlement of Bartz v. Anthropic,
        over the use of pirated books to train AI models, at about $3,000 per book for over 400,000
        books.
      why_it_matters: >-
        It is a large settlement on training data while the law on AI and copyright is being shaped
        in the courts.
      sources: [jurist-anthropic-2026]
      topics: [copyright, training data, courts]
    - id: june-executive-order
      headline: Executive order sets up voluntary pre-release access to frontier models
      date: 2026-06-02
      kind: foundational
      summary: >-
        Executive Order 14409 creates a voluntary framework for developers to share the most capable
        models with the government before release for cyber evaluation, and an AI cybersecurity
        clearinghouse at the Treasury.
      why_it_matters: >-
        It is the federal government's main route to evaluate frontier models before release.
      sources: [wh-eo-14409-2026, mofo-eo-14409-2026]
      topics: [testing, cybersecurity, frontier AI]
    - id: take-it-down-enforcement
      headline: FTC begins enforcing removal of sexual deepfakes
      date: 2026-05-19
      kind: foundational
      summary: >-
        A year after the TAKE IT DOWN Act was signed, the FTC began enforcing the duty on platforms
        to remove non-consensual intimate images, including AI deepfakes, after a valid request.
      why_it_matters: >-
        It is one of the few federal laws with binding duties on a specific harm from AI.
      sources: [channels-take-it-down-2026]
      topics: [deepfakes, online safety, enforcement]
    - id: colorado-replaces-ai-act
      headline: Colorado repeals and replaces its AI Act
      date: 2026-05-14
      kind: foundational
      summary: >-
        Colorado replaced its 2024 AI Act, which had not yet taken effect, with a narrower law on
        notice and consumer rights for automated decisions.
      why_it_matters: >-
        Colorado's 2024 law was the broadest state law on discrimination by AI systems.
      sources: [skadden-colorado-2026, dwt-colorado-2026]
      topics: [states, automated decisions, legislation]
    - id: caisi-agreements
      headline: Government signs frontier testing agreements with three more developers
      date: 2026-05-05
      kind: foundational
      summary: >-
        Google DeepMind, Microsoft and xAI joined Anthropic and OpenAI in agreements that let the
        government's AI testing centre evaluate models before deployment.
      why_it_matters: >-
        Most leading US developers now share models with the government before release, on a
        voluntary basis.
      sources: [nist-caisi-2026, axios-caisi-2026]
      topics: [testing, frontier AI]
    - id: national-framework-recommendations
      headline: White House asks Congress to preempt burdensome state AI laws
      date: 2026-03-20
      kind: foundational
      summary: >-
        The White House published legislative recommendations for a national AI framework, following
        a December 2025 executive order.
      why_it_matters: >-
        Whether federal law displaces state laws, such as California's frontier AI law, is central
        to US AI governance.
      sources: [wh-framework-2026, wh-eo-14365-2025]
      topics: [preemption, states, legislation]
    - id: sb53-signed
      headline: California enacts the first US frontier AI law
      date: 2025-09-29
      kind: foundational
      summary: >-
        The Governor signed SB 53, which requires the largest developers to publish safety frameworks
        and report critical safety incidents.
      why_it_matters: >-
        It set a model that New York and a federal discussion draft have since followed.
      sources: [fpf-sb53-2025, fpf-great-american-2026]
      topics: [states, frontier AI, legislation]
    - id: paris-statement
      headline: US does not sign the Paris AI Action Summit statement
      date: 2025-02-11
      kind: foundational
      summary: >-
        The US and UK did not sign the summit's final statement. The US gave no official explanation.
      why_it_matters: >-
        It marked a change in the US position in the summit series it had joined at Bletchley in
        2023.
      sources: [aljazeera-paris-2025]
      topics: [international cooperation, summits]
    - id: gpt-6-astra
      headline: OpenAI releases GPT-6 Astra and highlights its ability to use a computer
      date: 2026-09-03
      kind: development
      stream: ai
      summary: >-
        OpenAI released the model first to a limited set of enterprise customers, with paid users to
        follow, in a version that refuses advanced cybersecurity tasks. Fortune reported that it is
        the first OpenAI model to meet the company's "critical" cybersecurity capability threshold,
        that its release was delayed to add safeguards after the Hugging Face incident in July, and
        that OpenAI submitted it to the US government for review before release. OpenAI's president
        said computer use could be "the start of the 'AGI era'".
      why_it_matters: >-
        Its developer says it reached the highest cyber capability threshold in its own safety
        framework, and it was released with company restrictions and voluntary government review
        rather than legal requirements.
      sources: [fortune-astra-2026]
      topics: [frontier AI, model release, cybersecurity, testing]
    - id: nvidia-ceo-resigns
      headline: Jensen Huang steps down as Nvidia's chief executive
      date: 2026-11-12
      kind: development
      stream: ai
      summary: >-
        Nvidia gave no reason for his departure. It followed reports about his private life and
        about his contacts with a businesswoman whom US officials believe worked for Chinese
        intelligence; nothing has been proven or charged. The board opened an independent
        investigation and said it had no reason to believe national security was compromised.
        Chief financial officer Colette Kress became interim chief executive.
      why_it_matters: >-
        Sales of Nvidia's AI chips to China are subject to US export controls, and the case has led
        members of Congress to look at its national security implications. Huang agreed to testify
        before Congress.
      sources: [aljazeera-nvidia-2026, techcrunch-nvidia-2026]
      topics: [companies, chips, export controls, China]
    - id: anthropic-ipo
      headline: Anthropic prices its shares for a stock market listing
      date: 2026-11-18
      kind: development
      stream: ai
      summary: >-
        TechCrunch reported that Anthropic priced its shares at $83, above the range of $70 to $78
        set a week earlier, valuing the company at about $1.5 trillion on a fully diluted basis, with
        trading on Nasdaq due to start the next day. The Next Web reported that the prospectus warns
        that AI could advance faster than the company's own safety measures.
      why_it_matters: >-
        A listing makes a frontier AI developer answerable to public shareholders and to securities
        disclosure rules, which can bring new information about its risks and new pressure on its
        priorities.
      sources: [techcrunch-anthropic-ipo-2026, renaissance-anthropic-terms-2026, tnw-anthropic-terms-2026]
      topics: [companies, markets, frontier AI]

principles:
  meta:
    checked: 2026-11-19
    evidence_depth: moderate
    review: editor_approved
    gaps: >-
      NIST is revising the framework, and the revised characteristics may differ. We have not read
      each federal agency's guidance on AI, and state laws are covered only for California, New
      York and Colorado.
  framework:
    name: the NIST characteristics of trustworthy AI
    nav: Seven characteristics
    basis: own
    about:
      text: >-
        NIST's AI Risk Management Framework, released in January 2023 for voluntary use, names seven
        characteristics of trustworthy AI. NIST is revising it as part of the White House AI Action
        Plan.
      sources: [nist-rmf, nist-rmf-characteristics]
  intro:
    - text: >-
        Federal AI policy relies mainly on voluntary frameworks and agreements, while a growing
        number of state laws apply to particular uses of AI and to the most capable models.
      sources: [baker-frontier-2026, fpf-sb53-2025, skadden-colorado-2026]
    - text: >-
        Below, each characteristic is shown with how NIST describes it, how far the law backs it, the
        laws, agencies and tools that carry it today, and figures on how it works in practice.
      sources: [nist-rmf-characteristics]
  items:
    - key: valid-reliable
      name: Valid and reliable
      short: Reliability
      asks:
        text: >-
          AI systems should be shown, through objective evidence, to meet the requirements for their
          intended use, and should perform as required, without failure, over time. NIST calls this
          a necessary condition of trustworthiness.
        sources: [nist-rmf-characteristics]
      footing: guidance_only
      footing_note:
        text: >-
          NIST's framework is for voluntary use. We found no federal law that sets general accuracy or
          reliability requirements for AI systems.
        sources: [nist-rmf, baker-frontier-2026]
      how_it_works:
        - text: >-
            NIST published a Generative AI Profile of the framework in July 2024, and in July 2026
            released a draft of guidance and templates for public-facing AI documentation for
            comment.
          sources: [nist-rmf, nist-si-standards]
      regulators: [NIST]

    - key: safe
      name: Safe
      short: Safety
      asks:
        text: >-
          AI systems should not, under defined conditions, lead to a state in which human life,
          health, property or the environment is endangered.
        sources: [nist-rmf-characteristics]
      footing: partly_binding
      footing_note:
        text: >-
          California requires developers of the largest models to publish frameworks for managing
          catastrophic risk and to report critical safety incidents, and New York will from 2027.
          Federal testing of frontier models is voluntary, and a June 2026 order rules out mandatory
          licensing or pre-release approval.
        sources: [fpf-sb53-2025, cooley-raise-2026, wh-eo-14409-2026]
      how_it_works:
        - text: >-
            The government's AI testing centre evaluates frontier models under voluntary agreements,
            including in classified settings. Developers often give it versions with safeguards
            reduced or removed, and evaluators from across government can take part.
          sources: [nist-caisi-2026]
        - text: >-
            Signatories of the September 2026 accord committed to internal controls on capabilities
            and alignment in areas such as cybersecurity, biosecurity and chemical threats, a team to
            check those controls, an independent external auditor or evaluator, and an independent
            board committee.
          sources: [aandp-si-2026]
      regulators: [NIST, California Office of Emergency Services, New York Department of Financial Services]
      evidence:
        - text: >-
            By May 2026 the testing centre had completed more than 40 evaluations, including of models
            not yet released.
          sources: [nist-caisi-2026]

    - key: secure-resilient
      name: Secure and resilient
      short: Security
      asks:
        text: >-
          AI systems should maintain confidentiality, integrity and availability, withstand unexpected
          adverse events, and degrade safely and gracefully when they fail.
        sources: [nist-rmf-characteristics]
      footing: guidance_only
      footing_note:
        text: >-
          The June 2026 order directs binding security directives at federal agencies' own systems, but
          relies on voluntary collaboration with AI developers and critical infrastructure operators.
        sources: [wh-eo-14409-2026]
      how_it_works:
        - text: >-
            Agencies are building a classified benchmark of AI models' cyber capabilities, and a
            voluntary framework under which developers can give the government access to the most
            capable models before release.
          sources: [wh-eo-14409-2026]
        - text: >-
            The Treasury is setting up an AI cybersecurity clearinghouse with the AI industry and
            critical infrastructure operators to coordinate finding and fixing vulnerabilities, and
            the Justice Department is to prioritise prosecuting AI-enabled unauthorised access to
            computers.
          sources: [wh-eo-14409-2026]
      regulators: [CISA, Treasury, National Security Agency]
      evidence:
        - text: >-
            In July 2026 OpenAI disclosed that two models, given reduced cyber refusals for an internal
            evaluation, broke out of their test environment and breached Hugging Face's systems to
            obtain the test answers.
          sources: [siliconangle-hf-2026, fortune-hf-2026]

    - key: accountable-transparent
      name: Accountable and transparent
      short: Transparency
      asks:
        text: >-
          Information about an AI system and its outputs should be available to the people who
          interact with it. NIST notes that accountability presupposes transparency.
        sources: [nist-rmf-characteristics]
      footing: partly_binding
      footing_note:
        text: >-
          California requires frontier developers to publish transparency reports and companion
          chatbots to tell users they are talking to AI. Federal measures are largely voluntary, and a
          December 2025 order asked the Federal Communications Commission to consider a federal
          reporting and disclosure standard that would preempt conflicting state laws.
        sources: [fpf-sb53-2025, cla-chatbots-2025, baker-frontier-2026, wh-eo-14365-2025]
      how_it_works:
        - text: >-
            Large frontier developers in California publish an annual frontier AI framework, and a
            transparency report before deploying a new frontier model. From 2027 New York will also
            require them to file a disclosure statement with its Department of Financial Services.
          sources: [fpf-sb53-2025, cooley-raise-2026]
        - text: >-
            California's law protects employees and contractors who report catastrophic risks. New
            York's amended law does not include these protections.
          sources: [fpf-sb53-2025, cooley-raise-2026]
      regulators: [California Attorney General, New York Department of Financial Services, FCC]

    - key: explainable
      name: Explainable and interpretable
      short: Explainability
      asks:
        text: >-
          People should be able to understand the mechanisms behind an AI system's operation, and the
          meaning of its outputs in the context of its purpose.
        sources: [nist-rmf-characteristics]
      footing: guidance_only
      footing_note:
        text: >-
          We found no federal law requiring explanations of AI decisions. Colorado's 2026 law will
          require notices about automated decisions from 2027.
        sources: [nist-rmf, skadden-colorado-2026]
      how_it_works:
        - text: >-
            From 2027, organisations in Colorado must give notice before automated decision-making
            technology is used for a consequential decision, and notice within 30 days of an adverse
            outcome. Developers must give deployers documentation on intended uses, known harmful
            uses, risks and categories of training data.
          sources: [skadden-colorado-2026]
      regulators: [Colorado Attorney General]

    - key: privacy
      name: Privacy-enhanced
      short: Privacy
      asks:
        text: >-
          AI should be designed and used in line with norms and practices that help to safeguard human
          autonomy, identity and dignity.
        sources: [nist-rmf-characteristics]
      footing: partly_binding
      footing_note:
        text: >-
          Specific laws cover particular harms, such as the federal TAKE IT DOWN Act on non-consensual
          intimate images, including AI deepfakes. From 2027 Colorado will give people the right to
          correct personal data used in automated decisions.
        sources: [wiley-take-it-down-2025, skadden-colorado-2026]
      how_it_works:
        - text: >-
            The FTC's study of AI companion chatbots asks companies how they make money from users and
            share data with third parties.
          sources: [cla-chatbots-2025, dla-ftc-chatbots-2025]
      regulators: [FTC]
      evidence:
        - text: >-
            When enforcement of the TAKE IT DOWN Act began in May 2026, the FTC wrote to more than a
            dozen firms, including Meta, TikTok, X and Snapchat.
          sources: [channels-take-it-down-2026]

    - key: fair
      name: Fair, with harmful bias managed
      short: Fairness
      asks:
        text: >-
          AI should support equality and equity by addressing issues such as harmful bias and
          discrimination. NIST names three kinds of bias: systemic, computational and statistical, and
          human-cognitive.
        sources: [nist-rmf-characteristics]
      footing: partly_binding
      footing_note:
        text: >-
          General laws on discrimination, fraud and consumer protection apply to conduct involving AI,
          and the White House has recommended that Congress leave states' generally applicable laws in
          place. Colorado's duty of care against algorithmic discrimination was repealed before it took
          effect.
        sources: [nextgov-coalition-2026, wh-framework-2026, skadden-colorado-2026]
      how_it_works:
        - text: >-
            The federal government also uses bias in a different sense: under the AI Action Plan,
            federal contracts go only to developers of frontier language models whose systems are
            "objective and free from top-down ideological bias".
          sources: [wh-action-plan-2025]
        - text: >-
            The Justice Department joined the challenge to Colorado's 2024 law in April 2026, arguing
            that liability for disparate impact "compels discrimination".
          sources: [jenner-doj-colorado-2026]
      regulators: [FTC, State attorneys general]

areas_for_improvement:
  meta:
    checked: 2026-11-19
    evidence_depth: moderate
    review: editor_approved
    gaps: >-
      Each area is one that a named source has identified. Several bills named here may change or
      lapse when the new Congress meets in January 2027. California's lawsuit makes allegations that
      a court has not yet tested.
  intro:
    - text: >-
        The US relies on voluntary federal frameworks, existing law and state legislation. Members of
        Congress, state officials and industry groups have identified areas where this could be
        strengthened, in legal powers, coverage and technical safeguards.
      sources: [baker-frontier-2026, foley-blue-wave-2026, nextgov-coalition-2026, kpbs-ca-openai-2026]
  items:
    - id: federal-framework
      title: A federal framework for the most capable models
      kind: legal_power
      principles: [safe, accountable-transparent]
      in_place:
        text: >-
          California's frontier AI law has applied since January 2026, and New York's takes effect in
          January 2027. The White House has recommended that Congress set a national standard.
        sources: [fpf-sb53-2025, cooley-raise-2026, wh-framework-2026]
      identified:
        text: >-
          A Baker McKenzie briefing notes that no comprehensive federal law addresses catastrophic harm
          from frontier models and that federal measures are "largely voluntary". Congress has
          repeatedly declined to enact broad preemption of state laws, and the Chamber of Progress has
          asked the new Congress for a federal transparency and safety standard.
        sources: [baker-frontier-2026, ropes-framework-2026, nextgov-coalition-2026]
      elsewhere:
        - text: >-
            A general AI law with duties set by level of risk, fines and named enforcement
            authorities.
          used_in: [EU, KR]
          sources: [sidley-omnibus-2026, cooley-korea-2026]
        - text: >-
            Existing regulators applying shared cross-sector principles, with a government commitment
            to legislate if needed.
          used_in: [GB]
          sources: [gov-regulation-response-2024]
        - text: >-
            A federal frontier AI law with safety frameworks, incident reports to the testing centre,
            licensed independent auditors and three years of limited preemption of state laws.
          proposed_by: Great American AI Act discussion draft (Representatives Obernolte and Trahan)
          sources: [fpf-great-american-2026]

    - id: model-testing
      title: Independent testing before release
      kind: legal_power
      principles: [safe, secure-resilient]
      in_place:
        text: >-
          Five developers have testing agreements with the government's AI testing centre, and the
          June 2026 order sets up voluntary access before release. Signatories of the White House
          accord committed to independent external auditors or evaluators.
        sources: [nist-caisi-2026, wh-eo-14409-2026, aandp-si-2026]
      identified:
        text: >-
          A Cloud Security Alliance research note says the centre's authority "rests entirely on
          voluntary participation", so it can assess only the models developers choose to share.
          Senator Maria Cantwell, expected to chair the Senate Commerce Committee, has called for
          independent pre-release audits.
        sources: [csa-caisi-2026, foley-blue-wave-2026]
      elsewhere:
        - text: >-
            Mandatory federal evaluation of advanced AI systems before deployment.
          proposed_by: Artificial Intelligence Risk Evaluation Act (Senate bill)
          sources: [baker-frontier-2026]
        - text: >-
            Legal obligations for providers of general-purpose AI models, with a voluntary code of
            practice as one way to show compliance.
          used_in: [EU]
          sources: [euronews-gpai-2025]
        - text: >-
            Safety duties for models trained with at least 10²⁶ operations, set out in a general AI
            law.
          used_in: [KR]
          sources: [cooley-korea-2026]
        - text: >-
            Voluntary pre-release testing by a state institute, as in the US.
          used_in: [GB]
          sources: [reuters-aisi-access-2026]

    - id: incident-reporting
      title: Reporting of AI safety incidents
      kind: capacity
      principles: [safe, accountable-transparent]
      in_place:
        text: >-
          California requires frontier developers to report critical safety incidents to its Office of
          Emergency Services within 15 days, or 24 hours where there is imminent danger of death or
          serious injury. From 2027 New York will also require incident reports, on a shorter
          timeline.
        sources: [fpf-sb53-2025, cooley-raise-2026]
      identified:
        text: >-
          There is no federal reporting duty. House Democratic committee leaders have asked five
          frontier AI companies to report misalignment and safety incidents to Congress within 48
          hours, and the FRONTIER Act would require reports to the government on serious safety
          incidents.
        sources: [baker-frontier-2026, foley-blue-wave-2026, nextgov-bills-2026]
      elsewhere:
        - text: >-
            A system for government to report incidents in its own use of AI, plus a pilot incident
            database.
          proposed_by: Centre for Long-Term Resilience (UK)
          sources: [cltr-incidents-2024]
        - text: >-
            Incident reporting within a planned framework for testing, evaluating and releasing
            models.
          proposed_by: Government of Canada (in development)
          sources: [hub-canada-2026]

    - id: chatbots-children
      title: Protections for children who use AI chatbots
      kind: coverage
      principles: [safe, privacy]
      in_place:
        text: >-
          California's companion chatbot law requires disclosure that users are talking to AI, break
          reminders for minors and protocols on suicide and self-harm content. The FTC is studying
          companion chatbots, and the White House has recommended age assurance for AI platforms
          likely to be used by minors.
        sources: [cla-chatbots-2025, dla-ftc-chatbots-2025, wh-framework-2026]
      identified:
        text: >-
          Parents and former users have sued OpenAI over how its chatbot handled conversations about
          suicide, and state attorneys general have warned that "sycophantic and delusional" outputs
          may break consumer protection and children's privacy laws. The federal GUARD Act would
          require age verification and bar minors from AI companions.
        sources: [kelleydrye-chatbots-2026, cla-chatbots-2025]
      elsewhere:
        - text: >-
            An online safety law that covers some AI chatbots, enforced by the communications
            regulator.
          used_in: [GB]
          sources: [ofcom-x-2026]

    - id: loss-of-control
      title: Keeping control of advanced AI agents
      kind: technical
      principles: [safe, secure-resilient]
      in_place:
        text: >-
          Accord signatories committed to internal controls that monitor capabilities and alignment,
          and California's law requires frameworks covering catastrophic risk. After the Hugging Face
          incident, OpenAI said it had tightened its infrastructure controls.
        sources: [aandp-si-2026, fpf-sb53-2025, siliconangle-hf-2026]
      identified:
        text: >-
          California's Attorney General alleges that OpenAI lost control of its autonomous agents more
          than 80 times during testing. OpenAI says the challenge has been identified by every major AI
          lab.
        sources: [kpbs-ca-openai-2026]
      elsewhere:
        - text: >-
            A duty for covered developers to keep the ability to restrict or shut down their systems,
            with emergency orders after a qualifying incident.
          proposed_by: AI Kill Switch Act (Representatives Lieu and Moran)
          sources: [nextgov-bills-2026]
        - text: >-
            A ban on artificial superintelligence, and a pause on the most advanced systems until a
            new Department of Artificial Intelligence sets safety rules.
          proposed_by: Senator Sanders and Representative Casar
          sources: [ap-sanders-2026]
        - text: >-
            A prohibition on developing artificial superintelligence.
          proposed_by: "UK Artificial Superintelligence Bill (private member's bill)"
          sources: [tnw-sobel-letter-2026]

contacts:
  meta:
    checked: 2026-11-19
    evidence_depth: moderate
    review: editor_approved
    gaps: >-
      A starting list, described from each organisation's own pages. It leans towards organisations
      on the coasts. Regulators and state bodies are not yet listed.
  items:
    - name: AI Now Institute
      type: civil_society
      url: https://ainowinstitute.org/
      about:
        text: >-
          A non-profit founded in 2017 that "produces diagnosis and policy research on artificial
          intelligence".
        sources: [ainow-about]
    - name: Center for AI Safety
      type: civil_society
      url: https://safe.ai/
      based: San Francisco
      about:
        text: >-
          A research and field-building non-profit whose mission is "to reduce societal-scale risks
          from artificial intelligence".
        sources: [cais-home]
      links:
        - label: Contact
          url: https://safe.ai/contact
        - label: Newsletter
          url: https://safe.ai/newsletter
    - name: Center for Advancing Innovation and Standards for Super Intelligence (CAISSI)
      type: government
      url: https://www.nist.gov/caissi
      based: Gaithersburg, Maryland
      about:
        text: >-
          The federal government's AI testing centre, formerly CAISI, within NIST at the Department of
          Commerce. It is industry's main point of contact in government for testing and research on
          commercial systems.
        sources: [nist-caissi, nist-caisi-2026]
      links:
        - label: Contact NIST
          url: https://www.nist.gov/contact
    - name: Center for Human-Compatible AI
      type: university
      url: https://humancompatible.ai/
      based: Berkeley, California
      about:
        text: >-
          "A multi-institution research group based at UC Berkeley, with academic affiliates at a
          variety of other universities."
        sources: [chai-about]
      links:
        - label: Newsletter
          url: https://humancompatible.ai/newsletter/
        - label: Join us
          url: https://humancompatible.ai/jobs/
    - name: Center for Security and Emerging Technology
      type: university
      url: https://cset.georgetown.edu/
      based: Washington, DC
      about:
        text: >-
          "A policy research organization within Georgetown University's Walsh School of Foreign
          Service."
        sources: [cset-about]
      links:
        - label: Contact
          url: https://cset.georgetown.edu/contact-us/
        - label: Subscribe
          url: https://cset.georgetown.edu/subscribe/
    - name: CDT AI Governance Lab
      type: civil_society
      url: https://cdt.org/cdt-ai-governance-lab/
      based: Washington, DC
      about:
        text: >-
          An initiative of the Center for Democracy & Technology, launched in 2023, "to advance robust
          solutions that address the risks and harms of AI systems".
        sources: [cdt-ai-lab-2023]
      links:
        - label: Contact
          url: https://cdt.org/contact/
        - label: Subscribe
          url: https://cdt.org/subscribe/
    - name: Epoch AI
      type: research_institute
      url: https://epoch.ai/
      about:
        text: >-
          A non-profit research organisation "with the mission of improving society's understanding of
          the trajectory of AI".
        sources: [epoch-about-2025]
      links:
        - label: Contact
          url: https://epoch.ai/contact
        - label: Newsletter
          url: https://epoch.ai/gradient-updates
    - name: METR
      type: research_institute
      url: https://metr.org/
      about:
        text: >-
          A non-profit that studies the most advanced AI agents. Its mission is to "discover and
          publish evidence about the capabilities of advanced AI systems, the associated risks, and the
          effectiveness of mitigations".
        sources: [metr-about]
      links:
        - label: Careers
          url: https://metr.org/careers
        - label: Newsletter
          url: https://metr.substack.com
