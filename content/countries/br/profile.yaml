# Brazil: area profile
# Status: DRAFT, researched by Claude on 19 November 2026, awaiting editor review.
# Every statement cites one or more sources from the list at the bottom of this file.
# Direct quotes were copied from the source pages on the access date. Quotes in Portuguese are given
# in the original with an English translation by Claude.
# Sources from the Government of Brazil, its agencies, and organisations and media based in Brazil
# count as "inside".
# The principles section uses the OECD AI Principles. Brazil has no set of AI principles of its own in
# force: its 2021 national AI strategy follows the OECD Recommendation on AI, and the principles in the
# AI bill, PL 2338/2023, are not law. This follows the editor's decision of 18 Nov 2026 to use each
# country's own principles, with the OECD set as the fallback.

code: BR
name: Brazil
status: draft
last_reviewed: 2026-11-19
editor_approved: false
reviewers: []

summary:
  overview:
    - text: >-
        Brazil has no general AI law. The AI bill, PL 2338/2023, passed the Senate in December 2024 and
        is before the Chamber of Deputies, where a vote was postponed several times in 2026. The
        government has said it wants the bill passed in 2026.
      sources: [casrai-pl2338-2026, chambarelli-2026, brasil247-2026]
    - text: >-
        Without a general law, existing laws and sector regulators cover some uses of AI. The data
        protection authority, the ANPD, runs a pilot regulatory sandbox for AI, and the government has
        proposed making it the coordinator of a national system for AI regulation.
      sources: [tozzini-2026, legismap-sandbox-2026, dplnews-sia-2025]
    - text: >-
        Brazil has no AI safety institute. Two think tanks have proposed one, and the national metrology
        institute, Inmetro, works on methods for testing AI systems.
      sources: [cebri-aiso-2025, agenciagov-forum-2026]
    - text: >-
        Brazilians are divided about AI. In a 2026 Ipsos survey, 56% said AI brings more benefits than
        drawbacks; in a Datafolha survey, 79% said using AI to decide on hiring and firing is
        inadequate.
      sources: [ipsos-br-2026, bahia-datafolha-2026]
  regulation_line:
    text: >-
      No general AI law: a bill passed by the Senate is before the Chamber of Deputies, while data
      protection law, sector rules and a regulatory sandbox apply in the meantime.
    sources: [casrai-pl2338-2026, tozzini-2026, legismap-sandbox-2026]

facets:
  regulatory_approach: sector_and_existing_law
  safety_institute:
    status: "no"
    sources: [cebri-aiso-2025, agenciagov-forum-2026]
  frontier_developers:
    status: "no"
    note: >-
      We found no developer of frontier AI models based in Brazil in our sources. The government is
      funding supercomputers, one of them mainly for large language models, and its national AI plan
      aims to develop advanced models in Portuguese.
    sources: [cdo-supercomputer-2026, folha-pbia-2024]
  national_polling: "yes"
  commitments:
