attitudes:
  meta:
    checked: 2026-11-19
    evidence_depth: rich
    review: editor_approved
    gaps: >-
      The Leger and North Poll figures are reported through news coverage, not the pollsters' own
      releases. The North Poll report does not state the year of fieldwork; it was published in
      January 2026. Online panels cannot be given a margin of error in the usual way. Views in
      Quebec and among Indigenous peoples are not shown separately.
  headline_figures:
    - value: "68%"
      label: >-
        say Canadian governments must heavily regulate AI and tech companies, even if it slows
        development; 16% prefer self-regulation by the companies
      fieldwork: 7 to 11 May 2026
      sample: 1,803 adults, online (Angus Reid Forum)
      source: angus-reid-2026
    - value: "85%"
      label: believe governments should regulate AI tools to ensure ethical and safe use
      fieldwork: 22 to 25 Aug 2025
      sample: 1,518 adults, online (Leger)
      source: nsnews-leger-2025
  statements:
    - text: >-
        In the same Angus Reid survey, 74% said no government is truly equipped to regulate AI
        quickly enough to keep pace with the technology, and 70% said government should be cautious
        about adopting AI because of the risks.
      sources: [angus-reid-2026]
    - text: >-
        45% expected AI to significantly reduce the number of jobs available over the next decade,
        and 79% supported heavier taxes on companies that replace workers with AI. About two-thirds
        would oppose a large AI data centre being built within a few blocks of their home.
      sources: [angus-reid-2026]
    - text: >-
        In the Leger survey, 78% said AI tools threaten human jobs, and a majority said they had used
        an AI tool.
      sources: [nsnews-leger-2025]
    - text: >-
        In a North Poll Strategies survey of 1,687 Canadians, reported in January 2026, 60% said they
        would prefer the government to be sceptical of AI rather than supportive. The same share
        rated legislation to ensure ethical and safe AI as a top or very high priority.
      sources: [bnn-northpoll-2026]

regulation:
  meta:
    checked: 2026-11-19
    evidence_depth: rich
    review: editor_approved
    gaps: >-
      The text of the national strategy and of Bills C-34 and C-36 has not been read in full; they
      are described from government releases, Parliament's bill page, law firm briefings and
      commentary. Sources differ on the name of the commission that would enforce the privacy bill.
      Provincial laws, including Quebec's privacy law, and the federal Directive on Automated
      Decision-Making are not yet covered.
  items:
    - kind: strategy
      title: AI for All, Canada's national AI strategy
      date: 2026-06-04
      status: Published; a five-year plan
      text: >-
        Sets six pillars, the first of which is "Protecting Canadians and Safeguarding Democracy". It
        adds $50 million to expand the Canadian AI Safety Institute, proposes a voluntary trusted AI
        certification, and commits to modernise privacy law and extend online safety law to AI.
      sources: [gowling-strategy-2026, geist-strategy-2026]
    - kind: bill
      title: Bill C-36, Protecting Privacy and Consumer Data Act
      date: 2026-06-15
      status: Tabled in the House of Commons
      text: >-
        Would replace the privacy part of the federal private-sector privacy law (PIPEDA), require
        organisations to explain their use of automated decision-making and how to challenge
        decisions, and treat children's information as sensitive. Penalties would reach $10 million
        or 3% of gross global revenue.
      sources: [gowling-c36-2026, aljazeera-c36-2026]
    - kind: bill
      title: Bill C-34, Safe Social Media Act
      date: 2026-06-10
      status: Referred to the House of Commons Canadian Heritage committee, 29 October 2026
      text: >-
        Would create a Digital Safety Commission of Canada and set duties for social media services
        and some AI chatbots. Chatbots would have to interrupt users who express suicidal thoughts
        and point them to crisis services, and must not pose as humans. Children under 16 could not
        hold accounts on designated social media services.
      sources: [heritage-c34-2026, dlapiper-c34-2026, legisinfo-c34]
    - kind: bill
      title: Artificial Intelligence and Data Act (part of Bill C-27)
      date: 2022-06-16
      status: Ended on the Order Paper, January 2025
      text: >-
        A proposed federal law on AI systems, which ended when Parliament was prorogued. Bill C-36
        "does not contain AI-specific legislation akin to the Artificial Intelligence and Data Act".
      sources: [gowling-c36-2026]
    - kind: guidance
      title: Voluntary Code of Conduct on the Responsible Development and Management of Advanced Generative AI Systems
      date: 2023-09
      status: Voluntary
      text: >-
        Sets six principles for organisations that develop or manage advanced generative AI systems.
        A guide for managers of AI systems was added in March 2025.
      sources: [ised-code-2023, ised-code-2025]
    - kind: institution
      title: Canadian Artificial Intelligence Safety Institute (CAISI)
      date: 2024-11
      status: Operating
      text: >-
        Led by Innovation, Science and Economic Development Canada. It funds investigator-led research
        through CIFAR and government-directed projects at the National Research Council, and is a
        founding member of the International Network of AI Safety Institutes.
      sources: [ised-caisi, qp-caisi-2025]
    - kind: enforcement
      title: Joint investigation of OpenAI's ChatGPT by privacy regulators
      date: 2026-05-06
      status: Concluded; OpenAI's commitments are being monitored
      text: >-
        The federal, Quebec, British Columbia and Alberta privacy regulators found that ChatGPT's
        initial training did not comply with privacy law, citing overcollection, a lack of valid
        consent and transparency, and inaccurate information about people. OpenAI said it had
        "significantly limited the personal information and sensitive information that is used to
        train new ChatGPT models".
      sources: [opc-openai-2026]
    - kind: international
      title: International agreements
      date: 2026-11-09
      status: See filters
      text: >-
        Canada signed the 2023 Bletchley Declaration and the 2024 Seoul Declaration, signed the
        Council of Europe AI convention in February 2025, joined the Paris AI Action Summit statement,
        endorsed the New Delhi Declaration in February 2026, and signed the Paris Call for AI Safety
        and Security in November 2026.
      sources: [gov-bletchley-2023, gov-seoul-2024, gac-coe-2025, elysee-paris-2025, theprint-new-delhi-2026, elysee-paris-call-2026]

culture:
  meta:
    checked: 2026-11-19
    evidence_depth: moderate
    review: editor_approved
    gaps: >-
      No local reviewer yet. Most sources are in English; French-language debate in Quebec, and
      Indigenous perspectives, are under-represented. No industry voice is quoted.
  summary:
    - text: >-
        Trust is the government's main theme. AI minister Evan Solomon said the national strategy
        would put trust at its centre, and in September 2026 argued that governments, not companies,
        must regulate AI.
      sources: [cp-strategy-2026, hub-canada-2026]
    - text: >-
        Canada is home to large AI research institutes, including Mila in Montreal, founded by
        Yoshua Bengio, and Bengio's non-profit LawZero, which is developing what it calls
        safe-by-design AI.
      sources: [mila-roost-2026, lawzero-release-2026]
    - text: >-
        Child safety has shaped much of the debate. Ministers summoned OpenAI representatives after the
        Tumbler Ridge shooting in February 2026, and children's advocates and the Privacy
        Commissioner have since called for stronger rules and powers.
      sources: [globalnews-openai-2026, cp24-c34-2026]
    - text: >-
        Critics from law, human rights and labour say the strategy relies more on investment than on
        new law. The Canadian Human Rights Commission called for human rights impact evaluations
        before AI is used in areas such as employment, housing, health care and policing.
      sources: [geist-strategy-2026, hrreporter-strategy-2026, canlawyer-chrc-2026]
    - text: >-
        Sovereignty is a recurring theme. 46% of Canadians told Angus Reid that the country needs its
        own AI infrastructure to keep control of it.
      sources: [angus-reid-2026]
  own_words:
    - quote: "Adoption moves at the speed of trust."
      speaker: Evan Solomon
      role: Minister of Artificial Intelligence and Digital Innovation
      date: 2026-09
      source: hub-canada-2026
      voice: government
    - quote: "Without effective and enforceable rules and public control over key infrastructure, the AI strategy is like playing short-handed in hockey."
      speaker: Bert Blundon
      role: President, National Union of Public and General Employees
      date: 2026-06
      source: hrreporter-strategy-2026
      voice: labour
    - quote: "AI safety should not be left to a handful of large companies making trade-offs behind closed doors."
      speaker: Valérie Pisano
      role: President and Chief Executive, Mila
      date: 2026-06-02
      source: mila-roost-2026
      voice: safety_research
    - quote: "We cannot wait to discover harms after the fact"
      speaker: Charlotte-Anne Malischewski
      role: Chief Commissioner, Canadian Human Rights Commission
      date: 2026-06
      source: canlawyer-chrc-2026
      voice: public_body
    - quote: "We need more tools. We need more enforcement powers."
      speaker: Philippe Dufresne
      role: Privacy Commissioner of Canada
      date: 2026-10-23
      source: cp24-c34-2026
      voice: public_body
    - quote: "the strategy funds the infrastructure but defers on the law."
      speaker: Michael Geist
      role: Law professor and technology law commentator
      date: 2026-06
      source: geist-strategy-2026
      voice: civil_society
    - quote: "They are being hooked by algorithms engineered on purpose to keep them scrolling past midnight"
      speaker: Melissa Lantsman
      role: Conservative Member of Parliament, in the Bill C-34 debate
      date: 2026-10-28
      source: hub-c34-2026
      voice: parliament
    - quote: "few challenges are more urgent than ensuring AI is safe, predictable and beneficial for all"
      speaker: Elissa Strome
      role: Executive Director, Pan-Canadian AI Strategy, CIFAR
      date: 2025-07-31
      source: betakit-caisi-uk-2025
      voice: safety_research
  outside_analysis: []

news:
  meta:
    checked: 2026-11-19
    evidence_depth: rich
    review: editor_approved
  items:
    - id: paris-call
      headline: Canada signs the Paris Call for AI Safety and Security
      date: 2026-11-09
      kind: development
      summary: >-
        Canada was among 18 governments to sign, alongside ten AI companies including Cohere. The
        signatories committed to "establishing a common framework for the evaluation and risk
        management of frontier models".
      why_it_matters: >-
        It adds a commitment on frontier AI safety to Canada's international agreements, which
        already include the Council of Europe AI convention.
      sources: [elysee-paris-call-2026, gac-coe-2025]
      topics: [international cooperation, frontier AI, commitments]
    - id: c34-committee
      headline: Safe Social Media Act, which covers some AI chatbots, goes to committee
      date: 2026-10-29
      kind: development
      summary: >-
        The House of Commons sent Bill C-34 to its Canadian Heritage committee after second reading.
        Government members said in the debate that the bill "also reaches artificial intelligence
        chatbots". Children's advocates and the Privacy Commissioner had called for stronger
        protections and powers ahead of the debate.
      why_it_matters: >-
        It would place duties on some AI chatbots, including how they respond to users at risk of
        self-harm.
      sources: [legisinfo-c34, hub-c34-2026, cp24-c34-2026, dlapiper-c34-2026]
      topics: [legislation, chatbots, children]
    - id: minister-vision
      headline: AI minister says governments must regulate AI
      date: 2026-09-30
      kind: development
      summary: >-
        At an Empire Club of Canada event, Evan Solomon said "It is for us as sovereign governments to
        regulate because we are accountable to citizens and this is a democracy". The Hub reported
        that he set out a framework covering testing, model evaluation, model release and incident
        reporting, and that he said announcements on legislation would follow.
      why_it_matters: >-
        It sets out the minister's view on regulating advanced AI at a time when no AI-specific bill
        is before Parliament.
      sources: [hub-canada-2026, geist-strategy-2026]
      topics: [government, regulation, frontier AI]
    - id: tumbler-ridge-openai
      headline: Ottawa says report raises "serious questions" about OpenAI's response to warning signs before the Tumbler Ridge shooting
      date: 2026-09-25
      kind: development
      summary: >-
        In February 2026, OpenAI said that in June 2025 it had banned a ChatGPT account belonging to
        the person who later carried out the shooting, without alerting police, and that the person
        had then used a second account. Ministers summoned OpenAI representatives to Ottawa. After a Mother Jones report on the
        accounts in September, the office of AI minister Evan Solomon said it "raises serious questions
        about how OpenAI identified and responded to warning signs", and that a Canadian AI Safety
        Institute review of OpenAI's practices was continuing.
      why_it_matters: >-
        It raised the question of when AI companies should tell police about warning signs, and led to
        calls for a national standard.
      sources: [cp24-tumbler-ridge-2026, cp-openai-account-2026, globalnews-openai-2026]
      topics: [incidents, chatbots, policing]
    - id: lawzero-funding
      headline: Canada and Germany commit up to C$300 million to LawZero
      date: 2026-09-16
      kind: development
      summary: >-
        LawZero, a Montreal non-profit founded by Yoshua Bengio, is developing "Scientist AI", which it
        says is "expected to provide guardrails for today's frontier models". The money is for
        research staff, an office in Berlin and computing capacity in Canada.
      why_it_matters: >-
        It puts public money into technical research on making advanced AI safe by design, alongside
        the government's own safety institute.
      sources: [lawzero-release-2026]
      topics: [research, frontier AI, funding]
    - id: privacy-bill
      headline: Privacy bill would require explanations of automated decisions
      date: 2026-06-15
      kind: foundational
      summary: >-
        Bill C-36, the Protecting Privacy and Consumer Data Act, would treat information inferred
        about people as personal information, require organisations to explain certain automated
        decisions, and give children's information extra protection.
      why_it_matters: >-
        The strategy relies on privacy and online safety laws, rather than an AI-specific law, to
        build trust in AI.
      sources: [gowling-c36-2026, aljazeera-c36-2026, geist-strategy-2026]
      topics: [legislation, privacy, automated decisions]
    - id: national-strategy
      headline: Government launches AI for All, its national AI strategy
      date: 2026-06-04
      kind: foundational
      summary: >-
        The five-year strategy funds training, adoption, computing capacity in Canada and an expanded
        AI Safety Institute. Mila called it a vision "propelling Canada toward scientific and
        technological leadership", while Michael Geist wrote that "today's release feels like AI
        Strategy 1.0".
      why_it_matters: >-
        It sets the government's approach: trust built through privacy and online safety laws and
        voluntary certification, rather than a general AI law.
      sources: [gowling-strategy-2026, mila-strategy-2026, geist-strategy-2026]
      topics: [strategy, investment, trust]
    - id: chatgpt-investigation
      headline: Privacy regulators find ChatGPT's initial training did not comply with privacy law
      date: 2026-05-06
      kind: foundational
      summary: >-
        Privacy Commissioner Philippe Dufresne found the complaint well-founded and conditionally
        resolved, based on steps OpenAI had taken or committed to. He said "updated laws would help
        further support the safe deployment of new technologies".
      why_it_matters: >-
        It shows privacy law being used to hold an AI developer to account where there is no
        AI-specific law.
      sources: [opc-openai-2026, gowling-c36-2026]
      topics: [enforcement, privacy, generative AI]
    - id: coe-convention
      headline: Canada signs the Council of Europe convention on AI and human rights
      date: 2025-02-11
      kind: foundational
      summary: >-
        Canada signed alongside Japan at a ceremony during the AI Action Summit in Paris. The
        government said it was "proud to sign the first international convention on AI and human
        rights".
      why_it_matters: >-
        It is the first international treaty on AI, covering human rights, democracy and the rule of
        law.
      sources: [gac-coe-2025]
      topics: [international cooperation, human rights]
    - id: cohere-series-e
      headline: Cohere opens a funding round of up to C$7 billion
      date: 2026-10-29
      kind: development
      stream: ai
      summary: >-
        The company says the round values it at C$35.7 billion and is "the largest private financing
        round ever undertaken by a Canadian technology company". Schwarz Group led the round, and the
        Government of Canada is among the new investors.
      why_it_matters: >-
        The government is now an investor in a Canadian AI model developer that has signed the Paris
        Call's commitments on frontier AI safety.
      sources: [lightreading-cohere-2026, elysee-paris-call-2026]
      topics: [companies, investment]
    - id: bell-saskatchewan
      headline: Bell plans up to C$52.5 billion of AI infrastructure in Saskatchewan
      date: 2026-09-14
      kind: development
      stream: ai
      summary: >-
        The government welcomed Bell Canada's plan for up to 900 MW of new capacity, part of a
        1.2-gigawatt AI hub, which it called "the largest private-sector investment in Saskatchewan's
        history".
      why_it_matters: >-
        The national strategy treats computing capacity in Canada as part of AI sovereignty. Michael
        Geist argues that sovereignty also depends on privacy law that limits foreign access to data.
      sources: [ised-bell-2026, gowling-strategy-2026, geist-strategy-2026]
      topics: [compute, infrastructure, sovereignty]
    - id: germany-alliance
      headline: Canada and Germany sign an AI declaration and launch a Sovereign Technology Alliance
      date: 2026-02-17
      kind: foundational
      stream: ai
      summary: >-
        The two countries signed a "Joint Declaration of Intent on Artificial Intelligence" and
        launched an alliance "for stronger co-operation among partners on advanced technologies".
      why_it_matters: >-
        Germany later joined Canada in funding LawZero's research on safe-by-design AI.
      sources: [law360-germany-2026, lawzero-release-2026]
      topics: [international cooperation, sovereignty]

principles:
  meta:
    checked: 2026-11-19
    evidence_depth: moderate
    review: editor_approved
    gaps: >-
      How federal and provincial human rights law, consumer protection law and Quebec's privacy law
      apply to AI is not covered in this draft. The federal Directive on Automated Decision-Making,
      which applies to government use of AI, is not yet covered.
  framework:
    name: the voluntary code's six principles
    nav: Six principles
    basis: own
    about:
      text: >-
        Innovation, Science and Economic Development Canada published the Voluntary Code of Conduct on
        the Responsible Development and Management of Advanced Generative AI Systems in September
        2023. It sets six principles for developers and managers of these systems, and 46
        organisations had signed it by March 2025.
      sources: [ised-code-2023, ised-code-2025]
  intro:
    - text: >-
        Canada has no AI-specific law. Privacy law, enforced by federal and provincial privacy
        commissioners, applies to AI that uses personal information, and bills before Parliament
        would add rules on automated decisions and AI chatbots.
      sources: [opc-openai-2026, gowling-c36-2026, legisinfo-c34]
    - text: >-
        Below, each principle is shown with how the code describes it, how far the law backs it, the
        laws and bodies that carry it today, and evidence on how it works in practice.
      sources: [ised-code-2023]
  items:
    - key: accountability
      name: Accountability
      short: Accountability
      asks:
        text: >-
          Organisations should "understand their role with regard to the systems they develop or
          manage".
        sources: [ised-code-2023]
      footing: partly_binding
      footing_note:
        text: >-
          Privacy law holds organisations accountable for the personal information they use, including
          in AI systems. Regulators found a lack of accountability among the problems with how
          ChatGPT was first trained. No law sets accountability duties for AI systems in general.
        sources: [opc-openai-2026, gowling-c36-2026]
      how_it_works:
        - text: >-
            Federal, Quebec, British Columbia and Alberta privacy regulators can investigate jointly,
            as they did with ChatGPT. Bill C-36 would replace the federal private-sector privacy law
            and raise penalties.
          sources: [opc-openai-2026, gowling-c36-2026]
      regulators: [Office of the Privacy Commissioner of Canada, Provincial privacy commissioners]

    - key: safety
      name: Safety
      short: Safety
      asks:
        text: >-
          Developers and managers should make sure that systems "are subject to risk assessments".
        sources: [ised-code-2023]
      footing: guidance_only
      footing_note:
        text: >-
          No law in force requires risk assessments of AI systems. Bill C-34 would require some AI
          chatbots to reduce the risk of communicating harmful content; it is before a House of Commons
          committee.
        sources: [heritage-c34-2026, legisinfo-c34]
      how_it_works:
        - text: >-
            The Canadian AI Safety Institute studies the risks of advanced AI, including "risks posed
            by synthetic content, including impersonation and fraud".
          sources: [ised-caisi]
        - text: >-
            After the Tumbler Ridge shooting, OpenAI told the minister it would strengthen its
            protocols for referring threats to police and its detection of banned users opening new
            accounts.
          sources: [cp-openai-account-2026]
      regulators: []
      evidence:
        - text: >-
            OpenAI said it had banned the shooter's first ChatGPT account in June 2025 but "did not
            identify credible and imminent planning that met our threshold to refer the matter to law
            enforcement".
          sources: [cp-openai-account-2026]

    - key: fairness-equity
      name: Fairness and Equity
      short: Fairness
      asks:
        text: >-
          The code asks that "potential impacts with regard to fairness and equity are assessed and
          addressed".
        sources: [ised-code-2023]
      footing: guidance_only
      footing_note:
        text: >-
          We found no rule in our sources that sets fairness duties specific to AI. How general human
          rights law applies to AI is not covered in this draft.
        sources: [canlawyer-chrc-2026]
      how_it_works:
        - text: >-
            The Canadian Human Rights Commission has called for human rights impact evaluations before
            AI is rolled out in services, benefits, employment, education, housing, health care,
            policing and justice.
          sources: [canlawyer-chrc-2026]
      regulators: [Canadian Human Rights Commission]

    - key: transparency
      name: Transparency
      short: Transparency
      asks:
        text: >-
          The code asks that "sufficient information is published to allow consumers to make informed
          decisions".
        sources: [ised-code-2023]
      footing: partly_binding
      footing_note:
        text: >-
          Privacy law requires organisations to be open about how they use personal information:
          regulators found that ChatGPT's initial training lacked valid consent and transparency. No
          law in force requires AI-generated content to be labelled.
        sources: [opc-openai-2026, dlapiper-c34-2026]
      how_it_works:
        - text: >-
            Bill C-36 would require organisations to disclose their use of automated decision systems,
            the criteria used, and how people can challenge decisions.
          sources: [gowling-c36-2026]
        - text: >-
            Bill C-34 would require operators to label synthetic content, including deepfakes. The
            national strategy proposes a voluntary Canada Trusted AI Certification.
          sources: [dlapiper-c34-2026, gowling-strategy-2026]
      regulators: [Office of the Privacy Commissioner of Canada]

    - key: human-oversight
      name: Human Oversight and Monitoring
      short: Human oversight
      asks:
        text: >-
          "System use is monitored after deployment, and updates are implemented as needed to address
          any risks that materialize."
        sources: [ised-code-2023]
      footing: guidance_only
      footing_note:
        text: >-
          We found no law in force in our sources that requires monitoring of AI systems after
          deployment. Under Bill C-34, "automated crisis responses alone will not suffice" for chatbots
          when users are at risk.
        sources: [dlapiper-c34-2026]
      how_it_works:
        - text: >-
            The Canadian AI Safety Institute's research covers systems "that may be dangerous or hinder
            human oversight".
          sources: [ised-caisi]
        - text: >-
            The institute is reviewing OpenAI's practices after the Tumbler Ridge shooting.
          sources: [cp24-tumbler-ridge-2026]
      regulators: []

    - key: validity-robustness
      name: Validity and Robustness
      short: Robustness
      asks:
        text: >-
          Systems should "operate as intended" and be "secure against cyber attacks".
        sources: [ised-code-2023]
      footing: guidance_only
      footing_note:
        text: >-
          Only the voluntary code asks for this. Testing of AI systems in Canada is mainly research led
          by the Canadian AI Safety Institute.
        sources: [ised-code-2023, ised-caisi]
      how_it_works:
        - text: >-
            The National Research Council carries out government-directed projects for the institute,
            on topics including deepfake detection, risks from autonomous AI agents and benchmarks.
          sources: [qp-caisi-2025]
        - text: >-
            The national strategy funds the institute to track emerging risks and carry out transparent
            model evaluations.
          sources: [gowling-strategy-2026]
      regulators: []
      evidence:
        - text: >-
            In 2025 the institute funded ten research projects through CIFAR's Catalyst Grant Program,
            and pledged $1 million to the UK AI Security Institute's Alignment Project.
          sources: [qp-caisi-2025, betakit-caisi-uk-2025]

areas_for_improvement:
  meta:
    checked: 2026-11-19
    evidence_depth: moderate
    review: editor_approved
    gaps: >-
      Each area is one that a named source has identified. Bills C-34 and C-36 may change in
      Parliament. Provincial approaches are not yet covered.
  intro:
    - text: >-
        Canada relies on a voluntary code, privacy law and bills before Parliament. Legal scholars,
        the Privacy Commissioner, the Canadian Human Rights Commission, provincial leaders and
        children's advocates have identified areas where this could be strengthened.
      sources: [geist-strategy-2026, opc-openai-2026, canlawyer-chrc-2026, cp-openai-account-2026, cp24-c34-2026]
  items:
    - id: ai-law
      title: A law for AI systems
      kind: legal_power
      principles: [safety, accountability, human-oversight]
      in_place:
        text: >-
          A voluntary code for generative AI, privacy law, and bills on privacy and online safety, one
          of which covers some AI chatbots.
        sources: [ised-code-2023, gowling-c36-2026, heritage-c34-2026]
      identified:
        text: >-
          Michael Geist wrote that "The government has no plans for AI-specific regulation" and that
          the strategy defers on the law. The minister has said announcements on legislation will
          follow.
        sources: [geist-strategy-2026, hub-canada-2026]
      elsewhere:
        - text: >-
            A general AI law with duties set by level of risk.
          used_in: [EU]
          sources: [ec-ai-act-page]
        - text: >-
            A general AI law with duties for high-impact AI systems.
          used_in: [KR]
          sources: [cooley-korea-2026]
        - text: >-
            A federal law on AI systems, proposed in Canada in 2022 as the Artificial Intelligence and
            Data Act.
          proposed_by: Government of Canada (Bill C-27, not passed)
          sources: [gowling-c36-2026]

    - id: incident-reporting
      title: Reporting warning signs and incidents
      kind: coverage
      principles: [safety, human-oversight]
      in_place:
        text: >-
          After the Tumbler Ridge shooting, OpenAI said it would strengthen its police referral
          protocols, and the minister's office said OpenAI now has direct contact with the RCMP's
          National Cybercrime Coordination Centre.
        sources: [cp-openai-account-2026, cp24-tumbler-ridge-2026]
      identified:
        text: >-
          British Columbia's premier called for a national minimum standard for when companies refer
          threats to police. The minister's office said in September 2026 that "it would be premature
          to say" OpenAI's changes were sufficient.
        sources: [cp-openai-account-2026, cp24-tumbler-ridge-2026]
      elsewhere:
        - text: >-
            A state law requiring frontier developers to report critical safety incidents.
          used_in: [US]
          sources: [fpf-sb53-2025]
        - text: >-
            A commitment by developers to "share timely information on serious cyber and AI control
            incidents".
          proposed_by: Paris Call for AI Safety and Security, which Canada signed in November 2026
          sources: [elysee-paris-call-2026]
        - text: >-
            A framework for testing, model evaluation, model release and incident reporting. The
            minister said "We need kind of like a red phone if things are happening".
          proposed_by: Evan Solomon, Minister of Artificial Intelligence and Digital Innovation
          sources: [hub-canada-2026]

    - id: privacy-powers
      title: Powers for the privacy regulator
      kind: legal_power
      principles: [accountability, transparency]
      in_place:
        text: >-
          Federal and provincial privacy regulators investigated ChatGPT together and found the
          complaint well-founded. Bill C-36 would replace federal private-sector privacy law and raise
          penalties.
        sources: [opc-openai-2026, gowling-c36-2026]
      identified:
        text: >-
          Privacy Commissioner Philippe Dufresne said in May 2026 that "updated laws would help further
          support the safe deployment of new technologies", and in October that he needs more
          enforcement powers.
        sources: [opc-openai-2026, cp24-c34-2026]

    - id: transparency-rules
      title: Transparency about AI systems
      kind: coverage
      principles: [transparency]
      in_place:
        text: >-
          Bill C-36 would require explanations of automated decisions, Bill C-34 would require labels
          on synthetic content, and the strategy proposes voluntary certification.
        sources: [gowling-c36-2026, dlapiper-c34-2026, gowling-strategy-2026]
      identified:
        text: >-
          Michael Geist wrote that the strategy sets no clear transparency requirements and does not
          require disclosure of training data, and urged a dedicated AI transparency law.
        sources: [geist-strategy-2026]
      elsewhere:
        - text: >-
            Duties to mark AI-generated content and label deepfakes, under a general AI law.
          used_in: [EU]
          sources: [ec-ai-act-page]

    - id: human-rights-assessments
      title: Human rights assessments and redress
      kind: redress
      principles: [fairness-equity, accountability]
      in_place:
        text: >-
          The voluntary code asks signatories to assess and address impacts on fairness and equity.
        sources: [ised-code-2023]
      identified:
        text: >-
          The Canadian Human Rights Commission called for human rights impact evaluations before
          rollout, and said "people must have access to effective redress mechanisms" where AI causes
          harm.
        sources: [canlawyer-chrc-2026]
      elsewhere:
        - text: >-
            A state law on automated decisions that relies on notices before and after use and a right
            to ask for human review.
          used_in: [US]
          sources: [skadden-colorado-2026]
        - text: >-
            Duties for high-risk uses such as recruitment and credit scoring, under a general AI law.
          used_in: [EU]
          sources: [ec-ai-act-page]

    - id: children-chatbots
      title: Protecting children who use AI chatbots
      kind: coverage
      principles: [safety, human-oversight]
      in_place:
        text: >-
          Bill C-34 would set a duty to protect children for regulated services, including some AI
          chatbots, and Bill C-36 would give children's information extra protection.
        sources: [heritage-c34-2026, gowling-c36-2026]
      identified:
        text: >-
          Children First Canada named AI chatbots among the privacy risks to children. Ignacio Cofone
          of the University of Oxford told Al Jazeera that the privacy bill's child provisions are
          "modest", and that the bigger need is "age-appropriate design".
        sources: [cp24-c34-2026, aljazeera-c36-2026]
      elsewhere:
        - text: >-
            Open-source safeguards to detect harmful conversations with chatbots, including on
            self-harm, and redirect young users to support.
          proposed_by: Mila and ROOST (partnership announced in June 2026)
          sources: [mila-roost-2026]

contacts:
  meta:
    checked: 2026-11-19
    evidence_depth: moderate
    review: editor_approved
    gaps: >-
      A starting list, described from each organisation's own pages. CIFAR, provincial regulators and
      Quebec-based groups other than Mila and LawZero are not yet listed.
  items:
    - name: AIGS Canada (Gouvernance et Sécurité de l'IA Canada)
      type: civil_society
      url: https://aigs.ca/
      based: Ottawa
      about:
        text: >-
          Describes itself, on its French-language pages, as "un organisme à but non lucratif et non
          partisan" (a non-profit and nonpartisan organisation) working on AI governance and safety.
        sources: [gsia-about]
      links:
        - label: Newsletter (French)
          url: https://gsia.ca/infolettre-slack/
        - label: Volunteer (French)
          url: https://gsia.ca/benevolat/
    - name: Canadian Artificial Intelligence Safety Institute (CAISI)
      type: government
      url: https://ised-isde.canada.ca/site/ised/en/canadian-artificial-intelligence-safety-institute
      about:
        text: >-
          A government institute "led by Innovation, Science and Economic Development Canada", set up
          "to ensure that governments are well positioned to understand and act on the risks of
          advanced AI systems".
        sources: [ised-caisi]
    - name: LawZero
      type: research_institute
      url: https://lawzero.org/en
      based: Montreal
      about:
        text: >-
          Describes itself as "a nonprofit dedicated to safe-by-design artificial intelligence (AI)".
          It was founded by Yoshua Bengio.
        sources: [lawzero-safety-case-2026, lawzero-release-2026]
      links:
        - label: Careers
          url: https://job-boards.greenhouse.io/lawzero
    - name: Mila – Quebec Artificial Intelligence Institute
      type: research_institute
      url: https://mila.quebec/en
      based: Montreal
      about:
        text: >-
          Describes itself as "the world's largest academic AI research center specialized in deep
          learning". It works with ROOST on open-source safety tools for AI chatbots.
        sources: [mila-roost-2026]
      links:
        - label: Contact
          url: https://mila.quebec/en/about/contact
        - label: Media
          url: https://mila.quebec/en/media-resources
    - name: Office of the Privacy Commissioner of Canada
      type: regulator
      url: https://www.priv.gc.ca/en/
      based: Ottawa
      about:
        text: >-
          The Privacy Commissioner of Canada "is an Agent of Parliament whose mission is to protect and
          promote privacy rights". The office led the 2026 joint investigation of ChatGPT.
        sources: [opc-openai-2026]
      links:
        - label: Contact
          url: https://www.priv.gc.ca/en/contact-the-opc/
        - label: Who we are
          url: https://www.priv.gc.ca/en/about-the-opc/who-we-are/
    - name: Schwartz Reisman Institute for Technology and Society
      type: university
      url: https://srinstitute.utoronto.ca/
      based: University of Toronto
      about:
        text: >-
          An institute at the University of Toronto that "supports ground-breaking interdisciplinary
          research". Its director is leading an initiative "to make AI systems safer and more secure
          from end to end".
        sources: [sri-research]
      links:
        - label: Contact
          url: https://srinstitute.utoronto.ca/contact
        - label: AI safety mailing list
          url: https://docs.google.com/forms/d/e/1FAIpQLSfk1CgJmVKz_RLUMGenDHgZYmU7e9gfRX33MIV7SQPF8s7DaQ/viewform?usp=sf_link
    - name: Vector Institute
      type: research_institute
      url: https://vectorinstitute.ai/
      about:
        text: >-
          Publishes AI trust and safety principles, which say that "maintaining safe and trustworthy AI
          systems requires the continual assessment and management of their risks."
        sources: [vector-safety]

