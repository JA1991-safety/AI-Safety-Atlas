# Canada: area profile
# Status: APPROVED by the editor on 28 November 2026 (researched by Claude on 19 November 2026).
# Every statement cites one or more sources from the list at the bottom of this file.
# Direct quotes were copied from the source pages on the access date.
# Sources from Canadian governments, Parliament, regulators, and organisations and media based in
# Canada count as "inside".
# The principles section uses the six principles of Canada's Voluntary Code of Conduct on the
# Responsible Development and Management of Advanced Generative AI Systems (September 2023) as
# Canada's own set, following the editor's decision of 18 Nov 2026 to use each country's own principles.

code: CA
name: Canada
status: draft
last_reviewed: 2026-11-28
editor_approved: true
reviewers: []

summary:
  overview:
    - text: >-
        Canada has no law written specifically for AI. A proposed Artificial Intelligence and Data
        Act ended when Parliament was prorogued in January 2025, and the national AI strategy
        launched in June 2026 relies on privacy and online safety bills rather than an AI-specific
        law.
      sources: [gowling-c36-2026, geist-strategy-2026]
    - text: >-
        Two bills before Parliament touch AI: Bill C-36 on privacy, which would require explanations
        of automated decisions, and Bill C-34, the Safe Social Media Act, which would place duties on
        some AI chatbots and was sent to committee in October 2026.
      sources: [gowling-c36-2026, dlapiper-c34-2026, legisinfo-c34]
    - text: >-
        The Canadian AI Safety Institute, created in November 2024 with $50 million over five years,
        funds research on the risks of advanced AI. It is reviewing OpenAI's practices after a mass
        shooting in Tumbler Ridge, British Columbia, raised questions about when AI companies alert
        police.
      sources: [qp-caisi-2025, cp24-tumbler-ridge-2026]
    - text: >-
        In an Angus Reid survey in May 2026, 68% of Canadians said governments must heavily regulate
        AI even if it slows development, and 74% said no government is equipped to regulate it
        quickly enough.
      sources: [angus-reid-2026]
  regulation_line:
    text: >-
      No AI-specific law. A voluntary code for generative AI, privacy law enforced by federal and
      provincial commissioners, and bills on privacy and online safety, including AI chatbots,
      before Parliament.
    sources: [ised-code-2023, opc-openai-2026, gowling-c36-2026, legisinfo-c34]

