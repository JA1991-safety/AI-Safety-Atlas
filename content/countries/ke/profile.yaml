# Kenya: area profile
# Status: DRAFT, researched by Claude on 19 November 2026, awaiting editor review.
# Every statement cites one or more sources from the list at the bottom of this file.
# Direct quotes were copied from the source pages on the access date.
# Sources from the Government of Kenya, its agencies, and organisations and media based in Kenya
# count as "inside".
# The principles section uses the eight guiding principles of the National AI Strategy 2025-2030
# (section 4.3, p. 63), the country's own published set, in line with the decision of 18 Nov 2026. The
# strategy was read in full from a copy supplied by the project team on 21 Nov 2026.

code: KE
name: Kenya
status: draft
last_reviewed: 2026-11-21
editor_approved: false
reviewers: []

summary:
  overview:
    - text: >-
        Kenya has no AI-specific law. A Senate bill proposing an AI regulator and penalties has stalled:
        in October 2026 the Senate's ICT committee advised against proceeding with it, as reported by
        Techweez. A draft national policy on
        AI and emerging technologies went out for public comment in July 2026.
      sources: [techweez-bill-2026, itedge-policy-2026]
    - text: >-
        Data protection law applies to AI that uses personal data. In July 2026 the data protection
        regulator published draft guidance on AI, including impact assessments for higher-risk uses such
        as credit scoring and recruitment screening.
      sources: [odpc-guidance-2026, ppc-odpc-2026]
    - text: >-
        Kenya's AI strategy for 2025 to 2030 says existing legal frameworks are inadequate for AI. A
        Cabinet committee on AI was set up in June 2026, and in November 2026 Kenya signed the Paris Call
        for AI safety and security.
      sources: [ke-strategy-2025, cipit-cabinet-2026, elysee-paris-call-2026]
    - text: >-
        Use of AI is high and so is concern. In a 2026 Pew survey, 34% of Kenyans said AI in daily life
        made them more concerned than excited and 13% more excited; in a BCG survey, 87% said they used AI
        at least weekly.
      sources: [pew-topline-2026, techtrends-bcg-2026]
  regulation_line:
    text: >-
      No AI-specific law: data protection law and draft regulatory guidance apply, a Senate AI bill has
      stalled in committee, and a draft national AI policy is under preparation.
    sources: [odpc-guidance-2026, techweez-bill-2026, itedge-policy-2026]

facets:
  regulatory_approach: sector_and_existing_law
  safety_institute:
    status: "no"
    sources: [cipit-strategy-2025, techweez-bill-2026]
  frontier_developers:
    status: "no"
    note: >-
      We found no developer of frontier AI models based in Kenya in our sources. Kenyan companies offer
      GPU computing and cloud services for AI, and a model for indigenous languages was due to be
      completed in November 2026.
    sources: [citizen-gpu-2025, af-sovereign-2026]
  national_polling: "yes"
  commitments:
    - key: bletchley_declaration
      status: signed
      date: 2023-11-01
      sources: [gov-bletchley-2023]
    - key: seoul_declaration
      status: not_signed
      sources: [gov-seoul-2024]
    - key: paris_statement
      status: signed
      date: 2025-02-11
      sources: [elysee-paris-2025]

attitudes:
  meta:
    checked: 2026-11-22
    evidence_depth: moderate
    review: draft
    gaps: >-
      The Pew figures are from the published topline; Kenya's survey details are from Pew's methodology
      page (margin of error 4.8 points; Mandera County excluded). The BCG figures are reported through
      TechTrendsKE and the Media Council of Kenya figures through Radio Generation, without question
      wording. The GeoPoll figure is from a 2024 blog
      summary of its report. Survey wording differs, so figures from different polls should not be
      compared directly.
  headline_figures:
    - value: "34%"
      label: >-
        say the increased use of AI in daily life makes them more concerned than excited; 13% more
        excited, and 48% equally concerned and excited
      fieldwork: 7 March to 15 April 2026
      sample: 1,020 adults aged 18 and over, interviewed face to face in English, Somali or Swahili (Pew Research Center, Global Attitudes Survey, fieldwork by Gallup)
      source: pew-topline-2026
    - value: "63%"
      label: >-
        cannot identify AI-generated content
      fieldwork: 15 to 23 April 2026
      sample: 3,774 respondents in all 47 counties, interviewed in person (Media Council of Kenya, reported by Radio Generation)
      source: mck-2026
  statements:
    - text: >-
        In the Pew survey, 35% of Kenyans thought AI would lead to fewer jobs in Kenya over the next 20
        years, 14% to more jobs, and 42% were not sure. 50% said they had heard or read nothing at all
        about AI.
      sources: [pew-topline-2026, pew-kenya-methods-2026]
    - text: >-
        In a Boston Consulting Group survey of citizens in 44 countries, 57% of Kenyan respondents said
        AI's benefits outweigh its risks. On the use of AI in government, 50% named job losses as a
        concern, and 41% favoured independent audits.
      sources: [techtrends-bcg-2026]
    - text: >-
        In the Media Council of Kenya survey, 59% of respondents were aware of AI being used in the media
        and 61% had used AI-powered media platforms.
      sources: [mck-2026]
    - text: >-
        In a 2024 GeoPoll telephone survey, more than 75% of respondents said AI should be carefully
        managed and regulated.
      sources: [geopoll-2024]

regulation:
  meta:
    checked: 2026-11-21
    evidence_depth: moderate
    review: draft
    gaps: >-
      We read the national AI strategy in full, and the ODPC's guidance note to section 11; its sections
      on generative AI and enforcement and its annexes were read in summary only. The AI bill's dates are
      from the Senate's bill digest. The committee's October decision is reported by one source, and we
      did not find the committee's report. We did not read the draft AI policy itself.
  items:
    - kind: bill
      title: Artificial Intelligence Bill, 2026 (Senate)
      date: 2026-02-19
      status: Sponsored by Senator Karen Nyamu; published on 19 February 2026 and read a first time on 2 April 2026. Stalled since the Senate's ICT committee advised against proceeding in October 2026, as reported by Techweez
      text: >-
        Would have created an Office of the AI Commissioner to register and audit AI systems, handle
        complaints and enforce the law, alongside an AI Authority for standards and sandboxes and an
        advisory committee. AI systems would be sorted into four risk levels, from unacceptable (banned)
        to minimal. Providers of high-risk systems would carry out risk and human rights impact
        assessments, and the Commissioner would keep a public register of them. Penalties would include
        fines of up to Ksh 5 million and prison terms of up to two years.
      sources: [ke-bill-digest-2026, citizen-bill-2026, bowmans-bill-2026, techweez-bill-2026]
    - kind: law
      title: Data Protection Act, 2019
      date: "2019"
      status: In force
      text: >-
        Applies to AI systems that process personal data of people in Kenya. People have a right to
        meaningful human review of decisions made solely by automated processing. The Office of the Data
        Protection Commissioner (ODPC) enforces the Act.
      sources: [odpc-guidance-2026]
    - kind: guidance
      title: ODPC Guidance Note on Artificial Intelligence
      date: 2026-07
      status: Published in July 2026 and reported as a draft; no start date given
      text: >-
        Says organisations deploying AI must disclose its use in their privacy notices, and should carry
        out data protection impact assessments before deploying high-risk AI. An annex lists eight uses
        that need an assessment, including credit scoring, health diagnostics, recruitment screening and
        content recommendation. High-risk systems also need meaningful human review of automated
        decisions and regular algorithmic audit. Personal data scraped from public sources may not be
        used to train AI without a lawful basis, and may not be sent to AI processors abroad without a
        lawful transfer basis. The note describes itself as "a minimum standard".
      sources: [odpc-guidance-2026, ppc-odpc-2026, bd-offshore-2026]
    - kind: strategy
      title: Draft Kenya Artificial Intelligence and Emerging Technologies Policy, 2026
      date: 2026-07
      status: Draft; public comments closed on 4 August 2026
      text: >-
        Proposes a risk-based approach with incident reporting, human oversight and protections for
        children; shared liability across developers, deployers and users; rules for providers abroad
        whose systems affect Kenya; and a roadmap for new legislation. Lawyers at Bowmans note that it
        "does not itself create legally binding obligations".
      sources: [itedge-policy-2026]
    - kind: strategy
      title: Kenya Artificial Intelligence Strategy 2025-2030
      date: 2025-03
      status: Issued by the Ministry of Information, Communications and the Digital Economy
      text: >-
        Built on three pillars (digital infrastructure, data, and research and innovation) and four
        enablers, including governance and "Ethics, Equity, and Inclusion". It says that "existing
        regulatory and legal frameworks to address the unique challenges AI technologies pose are
        inadequate". According to CIPIT, it proposes local ethical and safety standards and possibly a
        national AI risk and safety institute.
      sources: [ke-strategy-2025, maiei-strategy-2025, cipit-strategy-2025]
    - kind: machinery
      title: Standing Cabinet Committee on Artificial Intelligence
      date: 2026-06-30
      status: Established by the Cabinet
      text: >-
        Set up to steer the national AI strategy, coordinate policy across government, and put in place
        "appropriate governance frameworks and safeguards".
      sources: [cipit-cabinet-2026]
    - kind: international
      title: International agreements
      date: 2026-11-09
      status: See filters
      text: >-
        Kenya signed the 2023 Bletchley Declaration and the Paris AI Action Summit statement in February
        2025, and is a founding member of the Public Interest AI Platform launched in Paris. It was not
        among the participants in the Seoul Declaration in May 2024. On 9 November 2026 it signed the
        Paris Call for AI safety and security.
      sources: [gov-bletchley-2023, elysee-paris-2025, gov-seoul-2024, elysee-paris-call-2026]

culture:
  meta:
    checked: 2026-11-19
    evidence_depth: moderate
    review: draft
    gaps: >-
      No local reviewer yet. All sources are in English; debate in Kiswahili and other languages is not
      covered. Two articles about an agreement between Kenya and an AI developer were left out because of
      a conflict of interest; see the note for reviewers in the pull request.
  summary:
    - text: >-
        Government voices present AI as an opportunity that brings risks for jobs. Kenya's Special Envoy
        on Technology has said jobs will be lost, and named loss of human agency, child safety and
        exclusion as major risks.
      sources: [capitalfm-thigo-2026]
    - text: >-
        Lawyers, researchers and senators have debated how to regulate AI. Lawyers questioned whether the
        Senate bill was proportionate, a Senate committee advised against proceeding with it, and a
        Strathmore University study
        found gaps in it that it called bridgeable.
      sources: [bowmans-bill-2026, techweez-bill-2026, strathmore-bill-2026]
    - text: >-
        Computing power and energy are part of the debate. Plans for a large data centre have raised
        questions about whether the national grid can supply it, and Kenyan companies describe their
        cloud and AI services in terms of sovereignty.
      sources: [citizen-datacentre-2026, standard-sovereign-cloud-2026, citizen-gpu-2025]
    - text: >-
        Concern about who can be held to account features in the debate on public sector AI. The head of
        the ICT Authority has said that government accountability "cannot be delegated to a vendor or an
        algorithm".
      sources: [capitalfm-kiarie]
    - text: >-
        Kenya takes part in international AI initiatives, including the Public Interest AI Platform and
        the Paris Call for AI safety and security.
      sources: [elysee-paris-2025, elysee-paris-call-2026]
  own_words:
    - quote: "The reality is jobs will be lost. And that's a hard fact, and I have to tell people this."
      speaker: Philip Thigo
      role: Special Envoy on Technology, on Capital FM
      date: 2026-08-17
      source: capitalfm-thigo-2026
      voice: government
    - quote: "AI is growing at a faster pace and the threats are also growing at an equal pace."
      speaker: Emmanuel Kata
      role: ICT Security Directorate, at the launch of the International AI Safety Report in Kenya
      source: standard-safety-report-2026
      voice: government
    - quote: "When I returned to the country, we were told one data centre requires 1,000 MW and yet we have 2,300 MW."
      speaker: William Ruto
      role: Speaking to Kenyans in Doha, as reported by Citizen Digital
      date: 2025-11
      source: citizen-datacentre-2026
      voice: government
    - quote: "Parliament must carefully examine how AI is being developed, procured and deployed,"
      speaker: John Kiarie
      role: Chair, National Assembly Committee on Communications, Information and Innovation
      source: capitalfm-kiarie
      voice: parliament
    - quote: "The gaps identified are real but bridgeable,"
      speaker: Joseph O. Onyango
      role: Strathmore University Business School, on the Artificial Intelligence Bill, 2026
      source: strathmore-bill-2026
      voice: safety_research
    - quote: "raise concerns around regulatory scope, certainty and proportionality"
      speaker: Bowmans
      role: Law firm, on the Artificial Intelligence Bill, 2026
      date: 2026-04-23
      source: bowmans-bill-2026
      voice: industry
    - quote: "For Africa, sovereignty should not mean isolation. It should mean managed interdependence."
      speaker: Michael Michie
      role: Co-founder and chief executive, EverseTech
      date: 2026-06-16
      source: standard-sovereign-cloud-2026
      voice: industry
  outside_analysis:
    - text: >-
        Researchers at Research ICT Africa, assessing the national AI strategy in 2025, argued that it
        should go further in "strengthening democratic oversight and ecological accountability".
      sources: [ria-strategy-2025]

news:
  meta:
    checked: 2026-11-21
    evidence_depth: moderate
    review: draft
  items:
    - id: paris-call
      headline: Kenya signs the Paris Call for AI safety and security
      date: 2026-11-09
      kind: development
      summary: >-
        Kenya was among 18 governments that signed the call, alongside AI companies. Under it, developers
        commit among other things to "implement fail-safe mechanisms to shut down model operations within
        their control".
      why_it_matters: >-
        It is Kenya's most recent international commitment on AI safety, and includes commitments by AI
        developers as well as governments.
      sources: [elysee-paris-call-2026]
      topics: [international, frontier AI]
    - id: new-commissioner
      headline: New Data Protection Commissioner nominated
      date: 2026-11-09
      kind: development
      summary: >-
        William Ruto nominated Lydia Sitienei Chelagat to succeed Immaculate Kassait, whose term is ending;
        the nomination was pending in the National Assembly when checked.
      why_it_matters: >-
        The Office of the Data Protection Commissioner is the main regulator for AI that uses personal
        data, and is finalising guidance on AI.
      sources: [techtrends-odpc-2026, odpc-guidance-2026]
      topics: [data protection, regulator]
    - id: bill-stalled
      headline: Artificial Intelligence Bill stalls in Senate committee
      date: 2026-10-16
      kind: development
      summary: >-
        Techweez reported that the Senate's Standing Committee on Information, Communication and
        Technology advised against proceeding with the bill, finding its penalties too harsh and its rules
        too heavy for a young sector, and that the bill has stalled. The report gives no date for the
        committee's decision.
      why_it_matters: >-
        Kenya remains without an AI-specific law; Techweez writes that the decision "was a decision on its
        approach, not on whether AI regulation is needed."
      sources: [techweez-bill-2026]
      topics: [regulation, AI bill]
    - id: pew-survey
      headline: Survey finds more Kenyans concerned than excited about AI
      date: 2026-09-17
      kind: development
      summary: >-
        In the Pew Research Center's 2026 survey, more Kenyans said the growing use of AI made them more
        concerned than excited, and most were unsure how AI would affect jobs.
      why_it_matters: >-
        It is one of few surveys of attitudes to AI in Kenya with comparable figures for other countries.
      sources: [pew-topline-2026]
      topics: [public attitudes, jobs]
    - id: anthropic-declaration
      headline: Kenya and Anthropic sign a joint declaration on AI cooperation
      date: 2026-09-22
      kind: development
      summary: >-
        Foreign Affairs Principal Secretary Korir Sing'Oei and Anthropic signed a joint declaration in New
        York, on the margins of the UN General Assembly. Kenyan media report that it sets a framework for
        cooperation on AI skills, research, public-sector uses, and AI safety and evaluation, with
        education and health as priorities. Capital FM reports that it does not set out specific projects,
        and that any use of data in future programmes will be governed by Kenyan law.
      why_it_matters: >-
        It is an agreement between the government and an AI developer that includes AI safety and
        evaluation. Citizen Digital calls it "historic"; Capital FM describes it as an umbrella framework
        under which ministries can develop their own programmes.
      sources: [citizen-anthropic-2026, capitalfm-anthropic-2026, standard-anthropic-2026]
      topics: [international, partnerships]
    - id: claude-misuse-report
      headline: AI developer reports a Kenyan operation using its chatbot for political posts
      date: 2026-09-11
      kind: development
      summary: >-
        Kenyan media reported that Anthropic's September 2026 threat report described a Kenya-based
        operator using its Claude chatbot to write social media posts praising Energy Cabinet Secretary
        Opiyo Wandayi and criticising the opposition. Anthropic said it found "no evidence of government
        involvement". Mr Wandayi called the report unverified and said it did not establish that he or
        his ministry authorised the activity.
      why_it_matters: >-
        It is a reported case of a general-purpose AI tool used in domestic political messaging in Kenya.
        The OECD's AI Incidents Monitor records it as an incident affecting the general public.
      sources: [kenyans-wandayi-2026, standard-claude-2026, oecd-incident-2026]
      topics: [misuse, information integrity]
    - id: thigo-talks
      headline: Special Envoy on Technology holds talks with AI developers in Silicon Valley
      date: 2026-07-24
      kind: foundational
      summary: >-
        Citizen Digital reported that Philip Thigo, Kenya's Special Envoy on Technology, discussed with
        Anthropic executives, including its chief executive, how frontier AI could be deployed responsibly
        in Kenya. Health, education and public-sector skills were among the priority areas named.
      why_it_matters: >-
        Thigo said Kenya had "an opportunity to help shape a different model for working with frontier AI
        companies"; the talks preceded the September joint declaration.
      sources: [citizen-thigo-2026]
      topics: [international, frontier AI]
    - id: odpc-guidance
      headline: Data protection regulator publishes draft guidance on AI
      date: 2026-07
      kind: foundational
      summary: >-
        The draft sets out how data protection law applies to AI, including impact assessments for
        higher-risk uses and disclosure of AI use in privacy notices.
      why_it_matters: >-
        It is the most detailed guidance on AI from a Kenyan regulator.
      sources: [odpc-guidance-2026, ppc-odpc-2026]
      topics: [data protection, guidance]
    - id: draft-policy
      headline: Government publishes a draft national policy on AI and emerging technologies
      date: 2026-07
      kind: foundational
      summary: >-
        The draft proposes a risk-based approach, incident reporting and a roadmap for legislation, and
        was open for public comment until 4 August 2026.
      why_it_matters: >-
        It sets out how the government intends to regulate AI after the Senate bill.
      sources: [itedge-policy-2026]
      topics: [policy, regulation]
    - id: cabinet-committee
      headline: Cabinet sets up a standing committee on AI
      date: 2026-06-30
      kind: foundational
      summary: >-
        The committee is to steer the national AI strategy and coordinate policy across government.
      why_it_matters: >-
        It gives AI policy a coordinating body at Cabinet level.
      sources: [cipit-cabinet-2026]
      topics: [governance]
    - id: ai-bill
      headline: Senate bill proposes an AI Commissioner and penalties
      date: 2026-02-19
      kind: foundational
      summary: >-
        The Artificial Intelligence Bill, 2026, sponsored by Senator Karen Nyamu, was published on 19
        February 2026 and read a first time in the Senate on 2 April. It proposed a regulator, risk classes
        and penalties for non-compliance.
      why_it_matters: >-
        It was Kenya's first attempt at an AI-specific law.
      sources: [ke-bill-digest-2026, dpa-bill-2026, citizen-bill-2026, bowmans-bill-2026]
      topics: [regulation, AI bill]
    - id: strategy
      headline: Kenya publishes its AI strategy for 2025 to 2030
      date: 2025-03
      kind: foundational
      summary: >-
        The strategy sets out pillars on infrastructure, data and research, and enablers including
        governance and ethics.
      why_it_matters: >-
        It is the government's main statement on AI.
      sources: [ke-strategy-2025, maiei-strategy-2025]
      topics: [strategy]
    - id: sovereign-model
      headline: Model for indigenous languages due in November, says former ICT official
      date: 2026-10-29
      kind: development
      stream: ai
      summary: >-
        Bitange Ndemo, a former Permanent Secretary for ICT, said at Pwani Innovation Week that Kenya's
        sovereign AI model, which aims to digitise indigenous languages, was due to be completed in
        November 2026.
      why_it_matters: >-
        Models trained on local languages are one way to reduce reliance on systems built elsewhere.
      sources: [af-sovereign-2026]
      topics: [models, languages]
    - id: bcg-survey
      headline: Survey finds Kenyans among the heaviest users of AI
      date: 2026-09-10
      kind: development
      stream: ai
      summary: >-
        In BCG's international survey of citizens, Kenyans reported using AI far more often than the
        global average, and 74% described themselves as proficient with AI.
      why_it_matters: >-
        High use means more people are exposed to both the benefits and the risks of AI tools.
      sources: [techtrends-bcg-2026]
      topics: [adoption, public attitudes]
    - id: sovereign-cloud
      headline: Kenyan firms launch a locally hosted cloud and AI platform
      date: 2026-06-16
      kind: foundational
      stream: ai
      summary: >-
        Atlancis Technologies, EverseTech and iXAfrica launched Servernah Cloud, hosted in Nairobi, for
        regulated and critical workloads.
      why_it_matters: >-
        It lets organisations keep sensitive data in Kenya, which the draft AI policy also emphasises.
      sources: [standard-sovereign-cloud-2026, itedge-policy-2026]
      topics: [compute, data]
    - id: olkaria
      headline: Questions over power supply for a $1 billion data centre
      date: 2026-05-23
      kind: foundational
      stream: ai
      summary: >-
        Plans for a Microsoft and G42 data centre campus at Olkaria face doubts about whether the grid can
        supply it. Philip Thigo said the project had not been suspended.
      why_it_matters: >-
        Energy supply limits how much computing power for AI Kenya can host.
      sources: [citizen-datacentre-2026]
      topics: [data centres, energy]
    - id: gpu-factory
      headline: GPU computing for AI launched in Nairobi
      date: 2025-11-13
      kind: foundational
      stream: ai
      summary: >-
        Atlancis Technologies launched an AI computing service using NVIDIA GPUs at iXAfrica's data centre
        campus in Nairobi.
      why_it_matters: >-
        Local computing power lets Kenyan developers train and run AI models in the country.
      sources: [citizen-gpu-2025]
      topics: [compute]

principles:
  meta:
    checked: 2026-11-21
    evidence_depth: limited
    review: draft
    gaps: >-
      The ODPC's guidance note is reported as a draft; its last sections were read in summary only. The draft
      Statement of Principles was read from the copy KICTANet posted in January 2025, marked "Draft". How consumer and
      employment law apply to AI is not covered.
  framework:
    name: the guiding principles of the National AI Strategy 2025-2030
    nav: Eight guiding principles
    basis: own
    about:
      text: >-
        Kenya's National AI Strategy 2025-2030, published by the Ministry of Information, Communications
        and the Digital Economy in March 2025, sets out eight principles that "will guide the
        implementation of the national AI strategy". A separate draft AI Statement of Principles, with
        eight core principles of its own, was reviewed at a workshop hosted by the ICT ministry and
        KICTANet in January 2025; we found no report that it has been adopted.
      sources: [ke-strategy-2025, kictanet-sop-doc-2025, kictanet-sop-2025]
  intro:
    - text: >-
        Kenya has no AI-specific law. Data protection law backs some principles where AI uses personal
        data; the others rest on the national strategy, draft policy and draft guidance.
      sources: [odpc-guidance-2026, itedge-policy-2026]
    - text: >-
        Below, each principle is shown with what it asks, how far Kenyan law backs it, the bodies and tools
        that carry it today, and evidence on how it works in practice.
      sources: [ke-strategy-2025]
  items:
    - key: inclusion
      name: Inclusivity and non-discrimination
      short: Inclusion
      asks:
        text: >-
          AI should be developed and used with inclusivity, equity and non-discrimination, "ensuring fair
          and equal access to AI benefits for all Kenyans, regardless of their background or
          circumstances."
        sources: [ke-strategy-2025]
      footing: guidance_only
      footing_note:
        text: >-
          Set out in the national strategy, which is not law. We found no AI-specific duty on fairness or
          non-discrimination.
        sources: [ke-strategy-2025, techweez-bill-2026]
      how_it_works:
        - text: >-
            "Ethics, Equity, and Inclusion" is one of the four enablers of the national AI strategy.
          sources: [maiei-strategy-2025]
        - text: >-
            The government's Special Envoy on Technology has called for investment in skills and shared
            computing infrastructure so that people can adapt to AI.
          sources: [capitalfm-thigo-2026]
      regulators: [Ministry of Information, Communications and the Digital Economy]

    - key: participation
      name: Participation and co-creation
      short: Co-creation
      asks:
        text: >-
          Those carrying out the strategy should "encourage multi-stakeholder engagement and involve diverse
          perspectives from government, industry, academia, and citizens."
        sources: [ke-strategy-2025]
      footing: guidance_only
      footing_note:
        text: >-
          A commitment in the strategy, not a legal duty specific to AI.
        sources: [ke-strategy-2025]
      how_it_works:
        - text: >-
            The draft AI and emerging technologies policy was published for public comment in 2026.
          sources: [itedge-policy-2026]
        - text: >-
            The draft AI Statement of Principles was reviewed with stakeholders at a two-day workshop in
            Nairobi in January 2025.
          sources: [kictanet-sop-2025, kictanet-sop-doc-2025]
      regulators: [Ministry of Information, Communications and the Digital Economy]

    - key: accountability
      name: Transparency and accountability
      short: Accountability
      asks:
        text: >-
          The strategy is to be carried out with "transparency, equity, explainability, and accountability
          in AI systems, promoting public trust and enabling oversight, auditing, and redress mechanisms."
        sources: [ke-strategy-2025]
      footing: partly_binding
      footing_note:
        text: >-
          Under the Data Protection Act, people have a right to meaningful human review of decisions made
          solely by automated processing, and the ODPC's draft guidance says organisations deploying AI
          "shall ensure" their privacy notices disclose its use. Outside data protection we found no duty.
        sources: [odpc-guidance-2026]
      how_it_works:
        - text: >-
            Privacy notices are to say that AI is used, what data goes in, and what the outputs are and
            mean for the person.
          sources: [odpc-guidance-2026]
        - text: >-
            The draft AI policy proposes shared liability, insurance and redress across developers,
            deployers, operators, vendors and users.
          sources: [itedge-policy-2026]
        - text: >-
            The ODPC's draft guidance asks organisations running AI to monitor it in operation, audit it
            periodically, keep an AI incident register and have an AI governance committee or equivalent.
          sources: [odpc-guidance-2026]
      regulators: [Office of the Data Protection Commissioner (ODPC)]
      evidence:
        - text: >-
            In the Media Council of Kenya survey, most respondents could not identify AI-generated content.
          sources: [mck-2026]

    - key: ethics
      name: Ethical and responsible AI
      short: Responsible AI
      asks:
        text: >-
          "Privacy protection, fairness, safety, security, and respect for human autonomy and
          decision-making will be important values in the implementation of the strategy."
        sources: [ke-strategy-2025]
      footing: partly_binding
      footing_note:
        text: >-
          The Data Protection Act applies to AI that processes personal data. We found no binding duty on
          the safety of AI systems; the strategy and the draft AI policy propose safety measures.
        sources: [odpc-guidance-2026, techweez-bill-2026, itedge-policy-2026]
      how_it_works:
        - text: >-
            The ODPC's draft guidance asks for data protection impact assessments before high-risk AI is
            deployed, for example in credit scoring and recruitment screening.
          sources: [odpc-guidance-2026, ppc-odpc-2026]
        - text: >-
            By signing the Paris Call for AI safety and security, Kenya joined commitments that include
            fail-safe mechanisms to shut down AI models.
          sources: [elysee-paris-call-2026]
        - text: >-
            The draft AI policy proposes incident reporting, human oversight and protections for children.
          sources: [itedge-policy-2026]
      regulators: [Office of the Data Protection Commissioner (ODPC), Ministry of Information, Communications and the Digital Economy]
      evidence:
        - text: >-
            In its first six years the ODPC received more than 13,000 complaints, issued 459 determinations
            and 206 enforcement and penalty notices, according to TechTrendsKE.
          sources: [techtrends-odpc-2026]

    - key: culture
      name: Cultural preservation and contextualization
      short: Cultural context
      asks:
        text: >-
          AI systems should be "enriched with Kenyan cultural values", preserve and promote the nation's
          cultural heritage, and be relevant to local needs.
        sources: [ke-strategy-2025]
      footing: guidance_only
      footing_note:
        text: >-
          A policy aim of the strategy; we found no law that gives it effect.
        sources: [ke-strategy-2025]
      how_it_works:
        - text: >-
            A former ICT Permanent Secretary said a national AI model that aims to digitise indigenous
            languages was due to be completed in November 2026.
          sources: [af-sovereign-2026]
      regulators: [Ministry of Information, Communications and the Digital Economy]

    - key: environment
      name: Environmental sustainability
      short: Environment
      asks:
        text: >-
          "The development and deployment of AI systems will promote environmental sustainability and
          energy efficiency."
        sources: [ke-strategy-2025]
      footing: guidance_only
      footing_note:
        text: >-
          Set out in the strategy, which is not law.
        sources: [ke-strategy-2025]
      how_it_works:
        - text: >-
            The strategy plans for green energy to power AI infrastructure. A planned large data centre has
            raised questions about whether the national grid can supply it.
          sources: [ke-strategy-2025, citizen-datacentre-2026]
      regulators: [Ministry of Information, Communications and the Digital Economy]

    - key: economy
      name: Economic benefit and self-sufficiency
      short: Economic benefit
      asks:
        text: >-
          AI should drive economic growth and new opportunities and foster self-sufficiency, "positioning
          Kenya as a net exporter of AI technologies and services."
        sources: [ke-strategy-2025]
      footing: guidance_only
      footing_note:
        text: >-
          A policy aim of the strategy, not a legal duty.
        sources: [ke-strategy-2025]
      how_it_works:
        - text: >-
            Kenyan companies have opened a GPU-powered AI computing facility in Nairobi for local
            developers.
          sources: [citizen-gpu-2025]
      regulators: [Ministry of Information, Communications and the Digital Economy]

    - key: local
      name: Local first approach
      short: Local first
      asks:
        text: >-
          AI development and deployment "will prioritise local talent, resources, and solutions while
          fostering local, regional, and international collaborations and partnerships."
        sources: [ke-strategy-2025]
      footing: guidance_only
      footing_note:
        text: >-
          Set out in the strategy. The draft AI policy would go further, with a pillar on sovereignty and
          data localisation, but it does not itself create legal obligations.
        sources: [ke-strategy-2025, itedge-policy-2026]
      how_it_works:
        - text: >-
            Kenyan companies have launched a sovereign cloud service so that organisations can keep
            sensitive data in Kenya.
          sources: [standard-sovereign-cloud-2026]
      regulators: [Ministry of Information, Communications and the Digital Economy]

areas_for_improvement:
  meta:
    checked: 2026-11-21
    evidence_depth: moderate
    review: draft
    gaps: >-
      Each area is one that a named source has identified. The committee's October decision on the AI
      bill is reported by one source.
  intro:
    - text: >-
        Kenya has data protection law, draft guidance on AI, a national strategy and a draft AI policy. The
        government's own strategy, lawyers and researchers point to areas where these could be
        strengthened.
      sources: [ke-strategy-2025, bowmans-bill-2026, strathmore-bill-2026, techtrends-odpc-2026]
  items:
    - id: legal-basis
      title: A legal framework for AI
      kind: legal_power
      principles: [ethics, accountability]
      in_place:
        text: >-
          Data protection law applies to AI that uses personal data. A draft AI policy includes a roadmap
          for legislation; a Senate AI bill has stalled in committee.
        sources: [odpc-guidance-2026, itedge-policy-2026, techweez-bill-2026]
      identified:
        text: >-
          The national AI strategy says existing legal frameworks are inadequate for the challenges AI
          poses. Techweez writes that the data protection law does not cover AI safety or algorithmic
          accountability.
        sources: [ke-strategy-2025, techweez-bill-2026]
      elsewhere:
        - text: >-
            A general AI law that sorts AI systems by risk, with duties for high-risk systems and for
            general-purpose AI models.
          used_in: [EU]
          sources: [ec-ai-act-page]

    - id: proportionate-oversight
      title: Proportionate rules and independent oversight
      kind: capacity
      principles: [accountability, ethics]
      in_place:
        text: >-
          The draft AI policy proposes a risk-based approach, and a Cabinet committee coordinates AI policy.
        sources: [itedge-policy-2026, cipit-cabinet-2026]
      identified:
        text: >-
          A Strathmore University study of the AI bill proposes improvements in risk classification,
          independent oversight, transparency and public participation. Bowmans questioned the
          proportionality of some of the bill's duties.
        sources: [strathmore-bill-2026, bowmans-bill-2026]
      elsewhere: []

    - id: cross-border
      title: Enforcement against AI providers abroad
      kind: coverage
      principles: [ethics, accountability]
      in_place:
        text: >-
          The ODPC's draft guidance says personal data may not be sent to AI processors abroad without a
          lawful transfer basis, and the draft AI policy would apply to foreign providers whose systems
          affect Kenya.
        sources: [odpc-guidance-2026, bd-offshore-2026, itedge-policy-2026]
      identified:
        text: >-
          TechTrendsKE reports that enforcement against organisations abroad depends on foreign cooperation,
          and describes calls for mutual legal assistance powers, ratification of the African Union's
          Malabo Convention and higher penalties.
        sources: [techtrends-odpc-2026]
      elsewhere: []

    - id: safety-capacity
      title: Capacity to test AI for safety
      kind: capacity
      principles: [ethics]
      in_place:
        text: >-
          Kenya has no AI safety institute. CIPIT's summary of the national strategy says it would develop
          local ethical and safety standards and possibly a national AI risk and safety institute.
        sources: [cipit-strategy-2025]
      identified:
        text: >-
          The OECD's AI policy observatory notes that the strategy calls for "AI risk and safety
          mechanisms".
        sources: [oecd-kenya-strategy]
      elsewhere:
        - text: >-
            An AI safety and standards centre of excellence with a proposed AI research and testing lab,
            launched in October 2026.
          used_in: [Eswatini]
          sources: [standard-eswatini-2026]

    - id: incident-reporting
      title: Reporting of AI incidents
      kind: legal_power
      principles: [ethics, accountability]
      in_place:
        text: >-
          We found no duty to report AI incidents in our sources. The draft AI policy proposes incident
          reporting.
        sources: [itedge-policy-2026]
      identified:
        text: >-
          Incident reporting is one of the lifecycle measures the government proposes in its draft AI
          policy.
        sources: [itedge-policy-2026]
      elsewhere:
        - text: >-
            A state law requiring large frontier developers to publish safety frameworks and report
            critical safety incidents.
          used_in: [US]
          sources: [fpf-sb53-2025]

contacts:
  meta:
    checked: 2026-11-19
    evidence_depth: limited
    review: draft
    gaps: >-
      A starting list. University groups outside Nairobi and civil society organisations working on AI
      safety are under-represented.
  items:
    - name: Office of the Data Protection Commissioner (ODPC)
      type: regulator
      url: https://www.odpc.go.ke/
      based: Nairobi
      about:
        text: >-
          The data protection regulator. It has published draft guidance on AI.
        sources: [odpc-guidance-2026]
    - name: Ministry of Information, Communications and the Digital Economy
      type: government
      url: https://ict.go.ke/
      based: Nairobi
      about:
        text: >-
          Issued the national AI strategy and the draft AI and emerging technologies policy.
        sources: [ke-strategy-2025, itedge-policy-2026]
    - name: Centre for Intellectual Property and Information Technology Law (CIPIT), Strathmore University
      type: university
      url: https://cipit.strathmore.edu/
      based: Nairobi
      about:
        text: >-
          A research centre at Strathmore University that publishes analysis of Kenya's AI strategy and
          governance.
        sources: [cipit-strategy-2025, cipit-cabinet-2026]
    - name: Kenya ICT Action Network (KICTANet)
      type: network
      url: https://www.kictanet.or.ke/
      based: Nairobi
      about:
        text: >-
          A multi-stakeholder network on ICT policy. Its chief executive has taken part in debate on how
          Parliament oversees AI.
        sources: [capitalfm-kiarie]

