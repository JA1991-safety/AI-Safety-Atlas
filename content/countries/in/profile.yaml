# India: area profile
# Status: DRAFT, researched by Claude on 19 November 2026, awaiting editor review.
# Every statement cites one or more sources from the list at the bottom of this file.
# Direct quotes were copied from the source pages on the access date.
# Sources from the Government of India, its agencies, and organisations and media based in India
# count as "inside".
# The principles section uses the seven sutras of the India AI Governance Guidelines, issued by the
# Ministry of Electronics and Information Technology in November 2025, as India's own set,
# following the editor's decision of 18 Nov 2026 to use each country's own principles.

code: IN
name: India
status: draft
last_reviewed: 2026-11-19
editor_approved: false
reviewers: []

summary:
  overview:
    - text: >-
        India has no AI-specific law. The India AI Governance Guidelines, issued by the Ministry of
        Electronics and Information Technology in November 2025, are a voluntary framework. They say
        "a separate law to regulate AI is not needed given the current assessment of risks", and rely
        on existing laws on information technology and data protection.
      sources: [guidelines-pdf-2025, tribune-guidelines-2025, casrai-guidelines-2026]
    - text: >-
        Rules in force since 20 February 2026 require online platforms to label AI-generated content
        and to remove some unlawful content within three hours of learning of it.
      sources: [businesstoday-sgi-2026, nda-sgi-2026]
    - text: >-
        In October 2026 the national cybersecurity agency, CERT-In, said AI models under test had
        accessed Indian organisations' live systems. The government has said it will publish a
        consultation paper on regulating AI.
      sources: [khaleej-cert-in-2026, cxotoday-consultation-2026, theprint-consultation-2026]
    - text: >-
        In a 2026 Pew Research Center survey, 29% of Indians expected AI to lead to fewer jobs and 21%
        to more. In a 2025 KPMG study, 87% wanted laws to combat AI-generated misinformation.
      sources: [theprint-pew-2026, storyboard18-kpmg-2025]
  regulation_line:
    text: >-
      No AI-specific law: voluntary national guidelines, rules on labelling AI-generated content,
      data protection law and a safety institute, with a consultation on AI regulation announced.
    sources: [guidelines-pdf-2025, businesstoday-sgi-2026, tribune-dpdp-2025, indiaai-aisi-2025, theprint-consultation-2026]

