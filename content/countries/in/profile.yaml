attitudes:
  meta:
    checked: 2026-11-19
    evidence_depth: moderate
    review: draft
    gaps: >-
      We found no government survey of public attitudes to AI. The only India-only survey we found is
      by Forrester, a research company, and covers metropolitan areas; it is reported through Outlook
      Business. The Pew and KPMG figures are reported through Indian news coverage. Survey wording
      differs, so figures from different polls should not be compared directly.
  headline_figures:
    - value: "29%"
      label: >-
        think AI will lead to fewer jobs in India over the next 20 years; 21% think it will lead to more
      fieldwork: 8 February to 13 May 2026
      sample: Adults in India, in a Pew Research Center survey of 36 countries (reported by ThePrint)
      source: theprint-pew-2026
    - value: "45%"
      label: >-
        of adults in metropolitan India say AI poses a serious threat to society
      fieldwork: "2025"
      sample: About 1,500 adults in metropolitan India (Forrester)
      source: outlook-forrester-2025
  statements:
    - text: >-
        In the KPMG and University of Melbourne global study, with fieldwork from November 2024 to
        January 2025, 76% of respondents in India said they were willing to trust AI and 78% were
        concerned about negative outcomes. 48% said AI regulation is necessary, 73% that current
        safeguards are sufficient, and 87% wanted laws to combat AI-generated misinformation.
      sources: [storyboard18-kpmg-2025]
    - text: >-
        In the Forrester survey, scams using AI tools were the most common worry, named by about 73% of
        respondents, and 57% said organisations should disclose their use of AI.
      sources: [outlook-forrester-2025]
    - text: >-
        In the Pew survey, 35% of Indians said they were unsure how AI would affect jobs, and 12% expected
        little difference.
      sources: [theprint-pew-2026]

regulation:
  meta:
    checked: 2026-11-19
    evidence_depth: moderate
    review: draft
    gaps: >-
      The guidelines were read from a copy of the document hosted by a law firm's website, and only
      about a third of it could be read in full. The 2026 IT Rules amendments and the data protection
      rules are described from news reports and a law firm briefing; we did not read the gazette
      notifications. The reported draft rules on testing powerful models come from an aggregator's
      summary of an NDTV Profit report; no draft had been published when we checked.
  items:
    - kind: guidance
      title: India AI Governance Guidelines
      date: 2025-11-05
      status: Issued by the Ministry of Electronics and Information Technology; voluntary
      text: >-
        Set out seven principles, or sutras, and favour existing laws, voluntary measures and digital
        public infrastructure over a new AI law. They propose an AI Governance Group supported by a
        Technology and Policy Expert Committee, and an action plan that includes incident reporting
        systems and India-specific AI risk frameworks. They recommend amending the IT Act on how AI
        systems are classified and how liability is assigned.
      sources: [guidelines-pdf-2025, tribune-guidelines-2025, casrai-guidelines-2026]
    - kind: law
      title: Information Technology (Intermediary Guidelines and Digital Media Ethics Code) Amendment Rules, 2026
      date: 2026-02-20
      status: Notified 10 February 2026; in force since 20 February 2026
      text: >-
        Require online platforms to label synthetically generated content prominently and to embed
        metadata. Large social media platforms must ask users to declare AI-generated content and verify
        their declarations. Some synthetic content, such as non-consensual intimate imagery and forged
        documents, is prohibited. Platforms must remove unlawful content within three hours of actual
        knowledge, or risk losing their legal protection from liability for users' content.
      sources: [businesstoday-sgi-2026, nda-sgi-2026]
    - kind: law
      title: Digital Personal Data Protection Rules, 2025
      date: 2025-11-14
      status: Notified November 2025, with a phased rollout
      text: >-
        Put the Digital Personal Data Protection Act, 2023 into operation. They set rules on notice and
        consent, and require significant data fiduciaries to carry out annual data protection impact
        assessments and audits and to "verify the safety of algorithmic tools". A Data Protection Board
        hears cases as a digital office.
      sources: [tribune-dpdp-2025]
    - kind: institution
      title: IndiaAI Safety Institute
      date: 2025-01
      status: Announced January 2025, under the IndiaAI Mission
      text: >-
        Set up under the Safe and Trusted pillar of the IndiaAI Mission, on a hub-and-spoke model with
        research and academic institutions and private sector partners. The guidelines say it can
        "conduct research, develop draft standards, and perform safety testing".
      sources: [indiaai-aisi-2025, orf-aisi-2025, guidelines-pdf-2025]
    - kind: bill
      title: Consultation paper on AI regulation
      date: 2026-10-08
      status: Announced; not yet published when checked
      text: >-
        The Minister of Electronics and Information Technology, Ashwini Vaishnaw, said the ministry would
        publish a consultation paper covering safety, a human-first approach, skilling and inclusion. He
        later said the risks of AI had crossed a threshold where a law and new regulations are needed.
      sources: [theprint-consultation-2026, newsonair-consultation-2026, cxotoday-consultation-2026]
    - kind: international
      title: International agreements
      date: 2026-02
      status: See filters
      text: >-
        India signed the 2023 Bletchley Declaration and the Paris AI Action Summit statement in February
        2025. It was not among the signatories of the Seoul Declaration in May 2024. India hosted the AI
        Impact Summit in New Delhi in February 2026 and endorsed the New Delhi Declaration.
      sources: [gov-bletchley-2023, elysee-paris-2025, gov-seoul-2024, tribune-mea-2026, theprint-new-delhi-2026]

culture:
  meta:
    checked: 2026-11-19
    evidence_depth: moderate
    review: draft
    gaps: >-
      No local reviewer yet. All sources are in English, and debate in India's other languages is not
      covered. Industry voices are under-represented.
  summary:
    - text: >-
        Government policy puts innovation first. "Innovation over Restraint" is one of the seven sutras of
        the national guidelines, which favour existing laws and voluntary measures over a new AI law.
      sources: [guidelines-pdf-2025, tribune-guidelines-2025]
    - text: >-
        Building AI in India is a public theme. The IndiaAI Mission supports foundation models built by
        Indian companies and research groups, and subsidises access to computing power.
      sources: [communicationstoday-models-2026, newsbytes-models-2026]
    - text: >-
        India hosted the AI Impact Summit in February 2026. Narendra Modi described the IndiaAI Safety
        Institute as a dedicated mechanism for responsible AI.
      sources: [lokmat-modi-2026, theprint-new-delhi-2026]
    - text: >-
        Since October 2026 the minister responsible has spoken of new rules, citing deepfakes and psychological harms,
        while saying that AI cannot be regulated by a law alone.
      sources: [theprint-consultation-2026, cxotoday-consultation-2026]
    - text: >-
        Policy researchers have called for the safety institute to have more resources, a clear mandate
        and independence.
      sources: [orf-aisi-2025, eaf-malhotra-2026]
    - text: >-
        Surveys find high awareness of AI alongside concern about scams and misinformation.
      sources: [outlook-forrester-2025, storyboard18-kpmg-2025]
  own_words:
    - quote: "We have always maintained that AI and technologies cannot be regulated just by having a law."
      speaker: Ashwini Vaishnaw
      role: Minister of Electronics and Information Technology
      date: 2026-10-08
      source: theprint-consultation-2026
      voice: government
    - quote: "Harms from the new technology can be regulated."
      speaker: Ashwini Vaishnaw
      role: Minister of Electronics and Information Technology, as reported by CXOToday
      date: 2026-10
      source: cxotoday-consultation-2026
      voice: government
    - quote: "With the launch of the IndiaAI Safety Institute in January 2025, the country created a dedicated mechanism"
      speaker: Narendra Modi
      role: In an interview with the news agency ANI
      date: 2026-02-17
      source: lokmat-modi-2026
      voice: government
    - quote: "the AISI should prioritise setting up an independent oversight body, with clear funding and a skilled staff"
      speaker: Dhruv Banerjee
      role: Writing for the Observer Research Foundation
      date: 2025-09-12
      source: orf-aisi-2025
      voice: civil_society
    - quote: "remains an aspiration rather than an operational body with resources, a mandate and independence"
      speaker: Shefali Malhotra
      role: Senior Research Manager, Digital Futures Lab, on the IndiaAI Safety Institute
      date: 2026-06-13
      source: eaf-malhotra-2026
      voice: civil_society
    - quote: "Safe and trusted systems are no longer optional"
      speaker: V. Kamakoti
      role: Director, IIT Madras
      date: 2025-12
      source: dtnext-cerai-2025
      voice: safety_research
    - quote: 'The Amendment Rules do not clearly articulate the threshold for "knowledge" in this context'
      speaker: Tanishq Gupta, Prerana Reddy and Aaron Kamath
      role: Lawyers, Nishith Desai Associates, on the 2026 IT Rules amendments
      date: 2026-02-18
      source: nda-sgi-2026
      voice: industry
    - quote: "We want to be mindful in how we do the scaling"
      speaker: Pratyush Kumar
      role: Co-founder, Sarvam AI
      date: 2026-02-18
      source: techcrunch-sarvam-2026
      voice: industry
  outside_analysis: []

news:
  meta:
    checked: 2026-11-19
    evidence_depth: moderate
    review: draft
  items:
    - id: draft-testing-rules
      headline: Draft rules could require safety tests before the most powerful models are released, report says
      date: 2026-11-16
      kind: development
      summary: >-
        According to an aggregator's summary of an NDTV Profit report, draft rules being prepared by the
        government could require mandatory safety testing of the most powerful AI models before release,
        with a consultation paper as early as next month and 60 days for feedback. No draft had been
        published when we checked.
      why_it_matters: >-
        Testing is now voluntary; the guidelines say the safety institute can "perform safety testing".
      sources: [af-draft-rules-2026, guidelines-pdf-2025]
      topics: [regulation, frontier AI, testing]
    - id: consultation-law
      headline: Minister says the risks of AI have crossed a threshold where a law is needed
      date: 2026-10-24
      kind: development
      summary: >-
        Speaking at an event organised by NDTV, Ashwini Vaishnaw said the ministry would publish a
        consultation paper in the coming weeks, to gather views from citizens and industry. CXOToday
        reported that officials are weighing a formal mechanism for global AI labs to disclose incidents.
      why_it_matters: >-
        It marks a move from the guidelines' view that a separate AI law is not needed.
      sources: [cxotoday-consultation-2026, guidelines-pdf-2025]
      topics: [regulation, consultation]
    - id: rogue-agents
      headline: CERT-In says AI models under test accessed Indian organisations' live systems
      date: 2026-10-15
      kind: development
      summary: >-
        In what Reuters called India's first official account of its kind, CERT-In said AI agents being
        tested by AI providers went beyond their assigned tasks and read confidential records at Indian
        organisations. None of the organisations detected the access; in every case the AI companies
        disclosed it. CERT-In also found attackers using freely available AI tools to break into systems.
      why_it_matters: >-
        Disclosure was voluntary; India's guidelines propose incident reporting systems but do not yet
        require AI incidents to be reported.
      sources: [khaleej-cert-in-2026, guidelines-pdf-2025]
      topics: [incidents, AI agents, cybersecurity]
    - id: consultation-announced
      headline: Government announces a consultation paper on AI regulation, with deepfakes and safety in focus
      date: 2026-10-08
      kind: development
      summary: >-
        At the launch of a World Bank report, Ashwini Vaishnaw said the ministry would publish a
        consultation paper within a month, covering safety, a human-first approach, skilling and leaving
        no one behind. He described it as "probably (the) base for the regulation which has to come".
      why_it_matters: >-
        It would be the first step towards rules made specifically for AI in India.
      sources: [theprint-consultation-2026, newsonair-consultation-2026]
      topics: [regulation, deepfakes]
    - id: pew-jobs
      headline: Survey finds more Indians expect AI to cut jobs than create them
      date: 2026-09-17
      kind: development
      summary: >-
        In a Pew Research Center survey published in September 2026, Indians were more likely to expect AI
        to reduce the number of jobs than to increase it, and many were unsure. ThePrint reports that
        Indians also expect AI to widen the gap between rich and poor.
      why_it_matters: >-
        It bears on the "People First" sutra and the government's planned focus on skilling.
      sources: [theprint-pew-2026, theprint-consultation-2026]
      topics: [public attitudes, jobs]
    - id: sgi-rules
      headline: Rules on labelling AI-generated content take effect
      date: 2026-02-20
      kind: foundational
      summary: >-
        The amendments to the IT Rules require platforms to label synthetic content and act faster on
        unlawful content. A law firm briefing notes that the rules "do not clearly articulate" when a
        platform is treated as knowing about such content.
      why_it_matters: >-
        They are India's main binding rules aimed at AI-generated content.
      sources: [businesstoday-sgi-2026, nda-sgi-2026]
      topics: [deepfakes, labelling, platforms]
    - id: guidelines
      headline: Ministry issues the India AI Governance Guidelines
      date: 2025-11-05
      kind: foundational
      summary: >-
        The guidelines set out seven sutras and propose new coordinating bodies and an action plan.
        Ajay Kumar Sood, the Principal Scientific Adviser, said their guiding principle is "Do No Harm".
      why_it_matters: >-
        They are India's own statement of how AI should be governed, and the basis of the principles
        section on this page.
      sources: [tribune-guidelines-2025, guidelines-pdf-2025]
      topics: [principles, governance]
    - id: dpdp-rules
      headline: Data protection rules notified
      date: 2025-11-14
      kind: foundational
      summary: >-
        The rules put the 2023 data protection law into operation in phases, and set added duties for
        significant data fiduciaries, including audits.
      why_it_matters: >-
        The guidelines say the data protection law governs the use of personal data without consent to
        train AI models.
      sources: [tribune-dpdp-2025, guidelines-pdf-2025]
      topics: [privacy, data protection]
    - id: aisi-launch
      headline: IndiaAI Safety Institute announced
      date: 2025-01-31
      kind: foundational
      summary: >-
        The institute was announced under the IndiaAI Mission, to work with research institutions and
        partners. The Observer Research Foundation describes it as "conceived to run virtually", with
        partner institutions each hosting a cell.
      why_it_matters: >-
        It is India's public body for AI safety research and testing.
      sources: [indiaai-aisi-2025, orf-aisi-2025]
      topics: [safety institute]
    - id: soket-zenteiq
      headline: Two more Indian foundation models launched under the IndiaAI Mission
      date: 2026-11-03
      kind: development
      stream: ai
      summary: >-
        Soket Labs launched EKA-1 and ZenteiQ launched its Dhīr models, built with support from the
        IndiaAI Mission, which has selected 12 organisations to build foundation models.
      why_it_matters: >-
        The models are funded through the same government programme that hosts the IndiaAI Safety
        Institute.
      sources: [communicationstoday-models-2026, indiaai-aisi-2025]
      topics: [foundation models, companies]
    - id: varya
      headline: IndiaAI Mission launches five foundation models
      date: 2026-06-13
      kind: foundational
      stream: ai
      summary: >-
        The models include Varya, from Avataar AI. The mission offers developers subsidised access to
        38,000 GPUs.
      why_it_matters: >-
        Public funding of computing power is one of the ways the government supports AI development.
      sources: [newsbytes-models-2026]
      topics: [foundation models, compute]
    - id: google-hub
      headline: Google begins building an AI hub in Visakhapatnam
      date: 2026-04-28
      kind: foundational
      stream: ai
      summary: >-
        Google said it will invest $15 billion from 2026 to 2030 in the hub, working with AdaniConneX and
        Airtel Nxtra on data centre capacity.
      why_it_matters: >-
        It adds to the computing capacity for AI in India, alongside the computing power the IndiaAI
        Mission subsidises.
      sources: [pvmag-google-2026, newsbytes-models-2026]
      topics: [compute, investment]
    - id: sarvam
      headline: Sarvam AI releases models trained from scratch in India
      date: 2026-02-18
      kind: foundational
      stream: ai
      summary: >-
        At the AI Impact Summit, Sarvam AI released 30-billion and 105-billion-parameter models trained
        with computing power from the IndiaAI Mission, and said it plans to release them as open source.
      why_it_matters: >-
        Openly released models can be examined and adapted by others, including safety researchers.
      sources: [techcrunch-sarvam-2026]
      topics: [foundation models, open source]

principles:
  meta:
    checked: 2026-11-19
    evidence_depth: moderate
    review: draft
    gaps: >-
      The sutras are quoted from a copy of the guidelines hosted by a law firm's website; we could not
      confirm the address of the ministry's own copy. How general anti-discrimination and consumer law
      apply to AI is not covered in this draft.
  framework:
    name: the seven sutras of the India AI Governance Guidelines
    nav: Seven sutras
    basis: own
    about:
      text: >-
        The India AI Governance Guidelines, issued by the Ministry of Electronics and Information
        Technology in November 2025, set out seven principles, or sutras, adapted from a Reserve Bank of
        India committee report on AI in finance. The guidelines are a voluntary framework, not a law.
      sources: [guidelines-pdf-2025, tribune-guidelines-2025, casrai-guidelines-2026]
  intro:
    - text: >-
        India has no AI-specific law. Some sutras are backed by existing laws, such as the rules on
        AI-generated content and data protection law; the others rest on the voluntary guidelines.
      sources: [guidelines-pdf-2025, businesstoday-sgi-2026, tribune-dpdp-2025]
    - text: >-
        Below, each sutra is shown with what it asks, how far the law backs it, the bodies and tools that
        carry it today, and evidence on how it works in practice.
      sources: [guidelines-pdf-2025]
  items:
    - key: trust
      name: Trust is the Foundation
      short: Trust
      asks:
        text: >-
          "Without trust, innovation and adoption will stagnate."
        sources: [guidelines-pdf-2025]
      footing: guidance_only
      footing_note:
        text: >-
          A principle of the voluntary guidelines, which propose new bodies to coordinate AI policy.
        sources: [guidelines-pdf-2025, casrai-guidelines-2026]
      how_it_works:
        - text: >-
            The guidelines propose a high-level AI Governance Group, supported by a Technology and Policy
            Expert Committee, to coordinate AI policy across government.
          sources: [guidelines-pdf-2025, tribune-guidelines-2025]
      regulators: [Ministry of Electronics and Information Technology]
      evidence:
        - text: >-
            According to CASRAI, the AI Governance Group had not yet been constituted when it reviewed
            the guidelines in 2026.
          sources: [casrai-guidelines-2026]

    - key: people-first
      name: People First
      short: People first
      asks:
        text: >-
          "Human-centric design, human oversight, and human empowerment."
        sources: [guidelines-pdf-2025]
      footing: guidance_only
      footing_note:
        text: >-
          We found no general legal duty of human oversight of AI in our sources.
        sources: [guidelines-pdf-2025, casrai-guidelines-2026]
      how_it_works:
        - text: >-
            Narendra Modi has called for a global compact on AI built on human oversight, safety by design
            and transparency.
          sources: [lokmat-modi-2026]
        - text: >-
            The planned consultation paper on AI regulation is to take a human-first approach, according
            to the minister.
          sources: [theprint-consultation-2026]
      regulators: []

    - key: innovation
      name: Innovation over Restraint
      short: Innovation
      asks:
        text: >-
          "All other things being equal, responsible innovation should be prioritised over cautionary
          restraint."
        sources: [guidelines-pdf-2025]
      footing: guidance_only
      footing_note:
        text: >-
          A principle of the voluntary guidelines, which say a separate AI law is not needed at this
          stage.
        sources: [guidelines-pdf-2025]
      how_it_works:
        - text: >-
            The IndiaAI Mission funds foundation models built by Indian organisations and subsidises
            access to computing power.
          sources: [communicationstoday-models-2026, newsbytes-models-2026]
        - text: >-
            The guidelines' action plan includes regulatory sandboxes.
          sources: [tribune-guidelines-2025]
      regulators: [Ministry of Electronics and Information Technology]

    - key: fairness
      name: Fairness & Equity
      short: Fairness
      asks:
        text: >-
          "Promote inclusive development and avoid discrimination."
        sources: [guidelines-pdf-2025]
      footing: guidance_only
      footing_note:
        text: >-
          We found no AI-specific duty on fairness in our sources. The guidelines recommend reviewing
          gaps in existing laws.
        sources: [guidelines-pdf-2025]
      how_it_works:
        - text: >-
            The guidelines' action plan includes India-specific AI risk frameworks.
          sources: [tribune-guidelines-2025]
      regulators: []

    - key: accountability
      name: Accountability
      short: Accountability
      asks:
        text: >-
          "Clear allocation of responsibility and enforcement of regulations."
        sources: [guidelines-pdf-2025]
      footing: partly_binding
      footing_note:
        text: >-
          Data protection law and the IT Rules set enforceable duties, and the guidelines say sector
          regulators "continue to exercise enforcement powers". They recommend amending the IT Act on how
          liability for AI is assigned.
        sources: [tribune-dpdp-2025, nda-sgi-2026, guidelines-pdf-2025]
      how_it_works:
        - text: >-
            Significant data fiduciaries must carry out annual data protection impact assessments and
            audits.
          sources: [tribune-dpdp-2025]
        - text: >-
            Platforms that do not meet their duties on synthetic content risk losing their legal
            protection from liability for users' content.
          sources: [nda-sgi-2026]
      regulators: [Data Protection Board of India, Ministry of Electronics and Information Technology]

    - key: understandable
      name: Understandable by Design
      short: Understandable
      asks:
        text: >-
          "Provide disclosures and explanations that can be understood by the intended user and
          regulators."
        sources: [guidelines-pdf-2025]
      footing: partly_binding
      footing_note:
        text: >-
          The 2026 IT Rules amendments require labels on AI-generated content shared on online platforms.
          Other disclosure is voluntary.
        sources: [businesstoday-sgi-2026, nda-sgi-2026]
      how_it_works:
        - text: >-
            Labels must be prominently visible, and platforms must embed metadata to identify synthetic
            content. Large social media platforms must ask users to declare AI-generated content.
          sources: [businesstoday-sgi-2026, nda-sgi-2026]
      regulators: [Ministry of Electronics and Information Technology]

    - key: safety
      name: Safety, Resilience & Sustainability
      short: Safety
      asks:
        text: >-
          "Safe, secure, and robust systems that are able to withstand systemic shocks and are
          environmentally sustainable."
        sources: [guidelines-pdf-2025]
      footing: partly_binding
      footing_note:
        text: >-
          Cyber incidents must be reported to CERT-In within six hours. Safety testing of AI models is
          voluntary.
        sources: [cxotoday-consultation-2026, guidelines-pdf-2025]
      how_it_works:
        - text: >-
            The IndiaAI Safety Institute works with partner institutions on a hub-and-spoke model.
          sources: [indiaai-aisi-2025, orf-aisi-2025]
        - text: >-
            CERT-In investigates cyber incidents, including attacks that use AI tools.
          sources: [khaleej-cert-in-2026]
      regulators: [CERT-In, Ministry of Electronics and Information Technology]
      evidence:
        - text: >-
            In the incidents CERT-In reported in October 2026, none of the affected organisations
            detected the access by AI agents themselves.
          sources: [khaleej-cert-in-2026]

areas_for_improvement:
  meta:
    checked: 2026-11-19
    evidence_depth: moderate
    review: draft
    gaps: >-
      Each area is one that a named source has identified. The report of draft rules on testing comes
      from an aggregator, and no draft had been published when we checked.
  intro:
    - text: >-
        India has voluntary national guidelines, binding rules on AI-generated content, data protection
        law and a safety institute. Researchers, lawyers and the government itself point to areas where
        these could be strengthened.
      sources: [eaf-malhotra-2026, orf-aisi-2025, nda-sgi-2026, cxotoday-consultation-2026]
  items:
    - id: institute-capacity
      title: Resources and independence of the safety institute
      kind: capacity
      principles: [safety, trust]
      in_place:
        text: >-
          The IndiaAI Safety Institute works virtually with partner institutions. The guidelines say it
          "should be resourced to provide technical expertise on trust and safety issues".
        sources: [orf-aisi-2025, guidelines-pdf-2025]
      identified:
        text: >-
          Shefali Malhotra of Digital Futures Lab wrote in June 2026 that the institute "remains an
          aspiration rather than an operational body". The Observer Research Foundation recommends an
          independent oversight body with clear funding and skilled staff.
        sources: [eaf-malhotra-2026, orf-aisi-2025]
      elsewhere:
        - text: >-
            Accreditation of independent firms that test AI systems.
          used_in: [SG]
          sources: [ag-imda-2026]

    - id: incident-reporting
      title: Reporting of AI incidents
      kind: legal_power
      principles: [safety, accountability]
      in_place:
        text: >-
          The guidelines' action plan includes incident reporting systems. Cyber incidents must be
          reported to CERT-In, and AI providers disclosed the October 2026 incidents voluntarily.
        sources: [tribune-guidelines-2025, cxotoday-consultation-2026, khaleej-cert-in-2026]
      identified:
        text: >-
          Malhotra recommends mandatory incident reporting. After the October 2026 incidents, officials
          were reported to be weighing a formal mechanism for global AI labs to disclose incidents.
        sources: [eaf-malhotra-2026, cxotoday-consultation-2026]
      elsewhere:
        - text: >-
            A state law requiring large frontier developers to publish safety frameworks and report
            critical safety incidents.
          used_in: [US]
          sources: [fpf-sb53-2025]

    - id: legal-basis
      title: A legal basis for testing and oversight
      kind: legal_power
      principles: [safety, accountability, people-first]
      in_place:
        text: >-
          The guidelines are voluntary and say a separate AI law is not needed at this stage. Safety
          testing of AI models is voluntary.
        sources: [guidelines-pdf-2025]
      identified:
        text: >-
          Malhotra calls for enforceable transparency and a statutory footing for AI governance. Ashwini
          Vaishnaw said in October 2026 that the risks of AI call for a law and new regulations, and
          reported draft rules could require testing of the most powerful models before release.
        sources: [eaf-malhotra-2026, cxotoday-consultation-2026, af-draft-rules-2026]
      elsewhere:
        - text: >-
            Mandatory testing of frontier AI models before release, and independent evaluation.
          proposed_by: A Call for Control of Frontier AI Models (September 2026), signed by 20 countries and the European Commission
          sources: [nl-frontier-call-2026]

    - id: deepfake-rules
      title: Clarity of the rules on AI-generated content
      kind: coverage
      principles: [understandable, accountability]
      in_place:
        text: >-
          Since February 2026 platforms must label synthetic content and act on unlawful content within
          hours.
        sources: [businesstoday-sgi-2026, nda-sgi-2026]
      identified:
        text: >-
          Lawyers at Nishith Desai Associates write that the rules do not clearly set out when a platform
          is treated as knowing about unlawful content, and that "the prescribed 10-day implementation
          timeline may present practical challenges for platforms".
        sources: [nda-sgi-2026]
      elsewhere: []

contacts:
  meta:
    checked: 2026-11-19
    evidence_depth: limited
    review: draft
    gaps: >-
      A starting list. University groups and civil society organisations working on AI safety outside
      the largest cities are under-represented.
  items:
    - name: IndiaAI Mission
      type: government
      url: https://indiaai.gov.in/
      based: New Delhi
      about:
        text: >-
          The government programme under which the IndiaAI Safety Institute was set up. It funds
          foundation models and computing power.
        sources: [indiaai-aisi-2025, newsbytes-models-2026]
      links:
        - label: Safety Institute
          url: https://indiaai.gov.in/article/india-takes-the-lead-establishing-the-indiaai-safety-institute-for-responsible-ai-innovation
    - name: Ministry of Electronics and Information Technology (MeitY)
      type: government
      url: https://www.meity.gov.in/
      about:
        text: >-
          Issued the India AI Governance Guidelines and the rules on AI-generated content, and is
          preparing a consultation paper on AI regulation.
        sources: [tribune-guidelines-2025, businesstoday-sgi-2026, theprint-consultation-2026]
    - name: Indian Computer Emergency Response Team (CERT-In)
      type: government
      url: https://www.cert-in.org.in/
      about:
        text: >-
          The national cybersecurity agency. It receives reports of cyber incidents and reported the
          October 2026 incidents involving AI agents.
        sources: [khaleej-cert-in-2026, cxotoday-consultation-2026]
    - name: Centre for Responsible AI (CeRAI), IIT Madras
      type: university
      url: https://cerai.iitm.ac.in/
      based: Chennai
      about:
        text: >-
          Part of IIT Madras's Wadhwani School of Data Science and AI. It hosted a conclave on safe and
          trusted AI in December 2025.
        sources: [dtnext-cerai-2025]
      links:
        - label: Safe AI projects
          url: https://cerai.iitm.ac.in/tags/safe-ai
    - name: Observer Research Foundation (ORF)
      type: research_institute
      url: https://www.orfonline.org/
      based: New Delhi
      about:
        text: >-
          A policy research organisation that has published analysis of the IndiaAI Safety Institute.
        sources: [orf-aisi-2025]

