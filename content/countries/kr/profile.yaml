# South Korea: area profile
# Status: DRAFT, researched by Claude on 19 November 2026, awaiting editor review.
# Every statement cites one or more sources from the list at the bottom of this file.
# Direct quotes were copied from the source pages on the access date.
# Sources from the Government of the Republic of Korea, its agencies, and organisations and media
# based in South Korea count as "inside".
# The principles section uses the seven national AI ethics principles announced by the Ministry of
# Science and ICT in August 2026 as South Korea's own set, following the editor's decision of
# 18 Nov 2026 to use each country's own principles.

code: KR
name: South Korea
status: draft
last_reviewed: 2026-11-19
editor_approved: false
reviewers: []

summary:
  overview:
    - text: >-
        South Korea's AI Basic Act took effect on 22 January 2026. It sets duties for operators of
        high-impact AI and requires AI-generated content to be labelled. Fines are capped at 30 million
        won, and the government has suspended them for at least a year while businesses adjust.
      sources: [cooley-korea-2026, asiae-labelling-2026]
    - text: >-
        A revision in force since 21 July 2026 details the labelling and high-impact AI rules. In August
        2026 the Ministry of Science and ICT announced seven national AI ethics principles, which it
        describes as nonbinding.
      sources: [asiae-revision-2026, koreatimes-ethics-2026]
    - text: >-
        The Korea AI Safety Institute, which opened in November 2024, assessed 34 AI models from January
        to August 2026. Its head has said it is short of both staff and computing resources.
      sources: [joongang-aisi-2024, digitaltoday-aisi-models-2026]
    - text: >-
        In a 2025 Pew Research Center survey reported by MIT Technology Review, 16% of South Koreans
        said they were more concerned than excited about AI. In a 2025 KPMG and University of Melbourne
        study, 64% said AI regulation is required.
      sources: [mittr-korea-2026, kpmg-korea-2025]
  regulation_line:
    text: >-
      A general AI law in force since January 2026, with fines suspended during a guidance period,
      nonbinding national ethics principles, and a safety institute that evaluates AI models.
    sources: [cooley-korea-2026, asiae-labelling-2026, koreatimes-ethics-2026, digitaltoday-aisi-models-2026]

facets:
  regulatory_approach: binding_horizontal
  safety_institute:
    status: "yes"
    name: Korea AI Safety Institute (AISI)
    sources: [aisi-assessment-page, joongang-aisi-2024]
  frontier_developers:
    status: "yes"
    note: >-
      LG AI Research, Naver Cloud, SK Telecom, Upstage and NC AI led the consortia in a government
      project to build national AI foundation models. LG AI Research says it aims to complete a
      "frontier-level" model by January 2027.
