# United Kingdom: country profile
# Status: DRAFT, researched by Claude on 18 November 2026, awaiting editor review.
# Every statement cites one or more sources from the list at the bottom of this file.
# Direct quotes were copied from the source pages on the access date.

code: GB
name: United Kingdom
status: draft
last_reviewed: 2026-11-18
editor_approved: false
reviewers: []

summary:
  overview:
    - text: >-
        The UK has no general AI law. Existing regulators apply five cross-sector principles on a
        non-statutory basis, and the government has said it will legislate when it is confident that
        doing so is right.
      sources: [gov-regulation-response-2024, lewis-silkin-2026-09]
    - text: >-
        Its state body for advanced AI risk, the AI Security Institute, focuses on serious risks with
        security implications, such as chemical and biological weapons, cyber-attacks and crime. It
        received a further £120m in October 2026.
      sources: [gov-aisi-rename-2025, gov-ai-package-2026]
    - text: >-
        A change of Prime Minister in July 2026 moved AI strategy and the AI Security Institute into
        the Cabinet Office and created the first AI minister to attend Cabinet.
      sources: [npr-burnham-2026, ggf-rewire-2026]
    - text: >-
        Surveys show broad public support for regulation. In a national survey published in 2025, 72% of UK
        adults said laws and regulation would make them more comfortable with AI.
      sources: [ada-turing-press-2025]
  regulation_line:
    text: >-
      No general AI law. Regulators apply non-statutory principles, with specific measures on data,
      copyright and police biometrics.
    sources: [gov-regulation-response-2024, leg-data-act-2025, ada-frt-2026]

