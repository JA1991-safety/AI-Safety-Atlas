attitudes:
  meta:
    checked: 2026-11-18
    evidence_depth: rich
    review: draft
    gaps: >-
      The government's own tracker survey (Wave 4, December 2024) reports findings in words rather
      than figures on its summary page. We have not yet checked for a later wave.
  headline_figures:
    - value: "72%"
      label: say laws and regulation would make them more comfortable with AI (up from 62% in 2022/23)
      question: Which of the following would make you more comfortable with AI being used?
      fieldwork: 25 Oct to 24 Nov 2024
      sample: 3,513 UK adults, random-probability panel
      source: ada-turing-press-2025
    - value: "59%"
      label: have an unfavourable opinion of AI companies; 16% are favourable
      fieldwork: 17 to 22 Sep 2026
      sample: 4,065 GB adults, online
      source: yougov-ai-companies-2026
  statements:
    - text: >-
        In the 2025 Ada Lovelace Institute and Alan Turing Institute survey, 88% said it is important
        that the government or regulators have the power to stop an AI product that poses serious
        harm, and 83% were concerned about public bodies sharing their data with private companies
        to train AI.
      sources: [ada-turing-press-2025]
    - text: >-
        The same survey found that half of respondents (50%) did not feel their views were
        represented in current decisions about AI.
      sources: [ada-turing-press-2025]
    - text: >-
        In a March 2026 YouGov survey for the Information Commissioner's Office (2,157 UK adults),
        76% said they were concerned about computers making decisions about people, and 93% said it
        is important that AI-generated content is clearly labelled.
      sources: [ico-omnibus-2026]
    - text: >-
        Views on AI companies vary with use. In September 2026, 41% of daily AI users were favourable
        towards AI companies (34% unfavourable), while 76% of people who had never used AI were
        unfavourable.
      sources: [yougov-ai-companies-2026]
    - text: >-
        In an August 2026 YouGov survey, 56% said the company that built and deployed an AI system
        bears most responsibility when it causes harm, and 64% supported making companies legally
        liable for damage caused by their AI systems. The article does not give the sample size.
      sources: [yougov-ai-blame-2026]
    - text: >-
        Political outlook shapes concerns. In British Social Attitudes analysis, 63% of people with
        left-wing views were concerned that facial recognition in policing could lead to false
        accusations, compared with 45% of people with right-wing views.
      sources: [natcen-bsa-2025]
    - text: >-
        The government's tracker survey found that public associations with AI "remain dominated by
        negative concepts", while use of AI chatbots for personal and work matters is growing.
      sources: [dsit-tracker-wave4]
    - text: >-
        People are turning to AI for personal support. In an AI Security Institute survey of 2,028 UK
        participants, 33% had used AI for emotional purposes in the previous year, 8% weekly and 4%
        daily.
      sources: [aisi-trends-2025]

regulation:
  meta:
    checked: 2026-11-18
    evidence_depth: rich
    review: draft
    gaps: >-
      The outcome of the Artificial Superintelligence Bill's second reading, scheduled for 13
      November 2026, is not yet confirmed from a parliamentary source. How individual regulators
      apply the principles is summarised in the five principles section, but we have not yet read
      each regulator's own strategy in full.
  items:
    - kind: strategy
      title: Principles-based approach through existing regulators
      date: 2024-02-06
      status: In place
      text: >-
        The government asked existing regulators to apply five principles within their own areas:
        safety, security and robustness; transparency and explainability; fairness; accountability
        and governance; and contestability and redress. The principles are non-statutory. The
        government also set out a case for "further targeted binding requirements" on the small
        number of developers of highly capable general-purpose AI, and said it would legislate when
        confident it was right to do so.
      sources: [gov-regulation-response-2024]
    - kind: institution
      title: AI Security Institute
      date: 2025-02-14
      status: Operating
      text: >-
        Originally the AI Safety Institute, renamed the AI Security Institute in February 2025. It focuses on the most serious risks, such as chemical
        and biological weapons, cyber-attacks, fraud and child sexual abuse, and said it would not
        focus on bias or freedom of speech. A criminal misuse team works jointly with the Home
        Office. Its stated mission is to give governments a scientific understanding of the risks
        posed by advanced AI.
      sources: [gov-aisi-rename-2025, aisi-home]
    - kind: strategy
      title: AI Opportunities Action Plan
      date: 2025-01-13
      status: Published
      text: >-
        An independent plan led by Matt Clifford, adopted by the government, with 50
        recommendations to grow the UK AI sector and increase AI adoption across the economy.
      sources: [gov-ai-opportunities-2025, gov-starmer-speech-2025]
    - kind: law
      title: Data (Use and Access) Act 2025
      date: 2025-06-19
      status: In force
      text: >-
        Contains provisions on copyright works and AI systems, under which the government reported to
        Parliament on copyright and AI. It also changed the rules on solely automated decisions with
        significant effects: organisations must give people information about them and let them
        contest them.
      sources: [leg-data-act-2025, gov-copyright-report-2026, ico-adm-safeguards-2026]
    - kind: guidance
      title: Copyright and AI report
      date: 2026-03-18
      status: Published
      text: >-
        The government said a broad copyright exception for AI training with an opt-out for rights
        holders "is no longer the government's preferred way forward", and that it would gather
        further evidence before changing copyright law.
      sources: [gov-copyright-report-2026]
    - kind: bill
      title: King's Speech 2026
      date: 2026-05
      status: Legislative programme announced
      text: >-
        The government's programme contained no dedicated AI bill. AI appears in a proposed
        Regulating for Growth Bill, which would let businesses test products, including AI, in
        regulatory sandboxes.
      sources: [scl-kings-speech-2026]
    - kind: machinery
      title: AI moves to the centre of government
      date: 2026-07-20
      status: In place
      text: >-
        The new Prime Minister, Andy Burnham, closed the Department for Science, Innovation and
        Technology. AI strategy, public sector AI adoption and the AI Security Institute moved to the
        Cabinet Office, and an AI Taskforce was set up in a new Office for the Prime Minister and the
        Cabinet. Kanishka Narayan became AI minister, attending Cabinet.
      sources: [ggf-rewire-2026, akin-ai-minister-2026]
    - kind: bill
      title: Artificial Superintelligence Bill
      date: 2026-09-08
      status: "Private Member's Bill; second reading was scheduled for 13 November 2026, outcome not yet confirmed"
      text: >-
        Introduced by Labour MP Alex Sobel, the bill would prohibit developing artificial
        superintelligence in the UK. A government spokesperson said the government did not consider
        the measures proposed "to be the right approach".
      sources: [tnw-sobel-letter-2026, lewis-silkin-2026-09]
    - kind: strategy
      title: AI security and growth package
      date: 2026-10-24
      status: Announced with the Autumn Budget
      text: >-
        Measures include a £165m National AI Biosecurity Initiative with a £100m AI Biosecurity Lab
        (supported by up to £200m of model credits from OpenAI and Anthropic), an extra £120m for the
        AI Security Institute, a £60m National Cyber Shield, £60m for the Sovereign AI Fund and £10m a
        year to study how AI changes jobs.
      sources: [gov-ai-package-2026]
    - kind: bill
      title: Police use of facial recognition
      date: 2026-11-04
      status: Bill and codes of practice announced
      text: >-
        The Home Office announced a Bill and codes of practice governing police use of facial
        recognition. The Ada Lovelace Institute welcomed it and called for the code of practice on
        private use to be mandatory.
      sources: [ada-frt-2026]
    - kind: guidance
      title: Regulators publish their approaches to AI
      date: 2024-05-01
      status: Published
      text: >-
        At the government's request, regulators including the Bank of England, the Competition and
        Markets Authority, the Equality and Human Rights Commission, the FCA, the ICO, the MHRA and
        Ofcom set out how they apply the five principles in their areas.
      sources: [gov-regulators-approaches-2024]
    - kind: guidance
      title: AI Cyber Security Code of Practice
      date: 2025-01-31
      status: Published
      text: >-
        Sets baseline security principles for organisations that develop and deploy AI. The UK
        submitted it to the European standards body ETSI as the basis for a global standard.
      sources: [gov-ai-cyber-code-2025]
    - kind: strategy
      title: ICO AI and biometrics strategy
      date: 2025-06-05
      status: In place
      text: >-
        The data protection regulator set out its focus on transparency, bias and discrimination, and
        rights and redress, with plans for a statutory code of practice on AI and automated
        decision-making.
      sources: [insideprivacy-ico-2025]
    - kind: international
      title: UK becomes coordinator of the international AI measurement network
      date: 2025-12-09
      status: In place
      text: >-
        The International Network of AI Safety Institutes was renamed the International Network for
        Advanced AI Measurement, Evaluation and Science, with the UK as its coordinator.
      sources: [gov-network-2025]
    - kind: enforcement
      title: Ofcom investigates X over its Grok chatbot
      date: 2026-01-12
      status: Investigation open
      text: >-
        Ofcom opened an Online Safety Act investigation into X over sexualised images made with the
        Grok chatbot, and set out which AI chatbots the Act covers.
      sources: [ofcom-x-2026]
    - kind: international
      title: International agreements
      date: 2026-02-21
      status: See filters
      text: >-
        The UK hosted the 2023 AI Safety Summit and its Bletchley Declaration, signed the Council of
        Europe AI convention in September 2024, did not sign the Paris AI Action Summit statement in
        February 2025, and endorsed the New Delhi Declaration on AI Impact in February 2026.
      sources: [gov-bletchley-2023, gov-coe-convention-2024, lbc-paris-2025, pti-new-delhi-2026]

culture:
  meta:
    checked: 2026-11-18
    evidence_depth: moderate
    review: draft
    gaps: >-
      No local reviewer yet. Voices from devolved nations (Scotland, Wales, Northern Ireland) and
      from AI researchers outside government are not yet represented. Industry figures come from
      two government surveys with different methods, so they are not directly comparable.
  summary:
    - text: >-
        Government pairs growth with safety and security. In 2025 the Prime Minister said the
        government would be "pro-growth and pro-innovation" on regulation while making sure the
        technology is safe. In 2026 the Chancellor described the AI package as a "distinctively
        British approach", combining security spending with support for UK firms.
      sources: [gov-starmer-speech-2025, silicon-biosecurity-2026, gov-ai-package-2026]
    - text: >-
        The state's safety work is framed around national security. The AI Security Institute was
        renamed to centre on security risks, and since July 2026 it sits in the Cabinet Office.
      sources: [gov-aisi-rename-2025, aisi-about, ggf-rewire-2026]
    - text: >-
        Whether to legislate is an open debate. MPs and peers from several parties have called for a
        ban on superintelligence and an international agreement. The government has said that bill
        is not the right approach, and the Ada Lovelace Institute has welcomed targeted law in a
        specific area, police facial recognition.
      sources: [politicshome-sobel-2026, tnw-sobel-letter-2026, ada-frt-2026]
    - text: >-
        Copyright is a live dispute between AI developers and creative industries. Publishers
        campaign for payment for content used to train AI, and the government has stepped back from
        its earlier preferred opt-out model.
      sources: [nma-make-it-fair, gov-copyright-report-2026]
    - text: >-
        Work and sovereignty recur. Trade unions call for legal protections for workers affected by AI
        decisions, the government funds research on AI and jobs, and both government and the tech
        trade body talk about sovereign capability.
      sources: [tuc-ai-bill, gov-ai-package-2026, techuk-home]
    - text: >-
        The industry trade body techUK and the Startup Coalition criticised the closure of the
        science and technology department as "the wrong change at the wrong time".
      sources: [techmag-dsit-2026]
    - text: >-
        The AI industry is growing fast. The government's latest AI sector study, whose estimates it
        describes as experimental, counted 10,488 AI companies, up 79%, with £33.6bn in AI revenue
        and AI-related employment of 130,400, up 51%.
      sources: [dbist-sector-2026]
    - text: >-
        Use is spreading unevenly. Official statistics show around 35% of businesses with 10 or more
        employees using AI by June 2026, up from around 12% in 2023, ranging from 58% in information
        and communication to 13% in construction, and from 28% of the smallest firms to 49% of the
        largest.
      sources: [ons-ai-business-2026]
    - text: >-
        Skills are the most common barrier. In the government's 2026 adoption survey, 67% of
        businesses using AI and 78% of those planning to said a lack of skills held them back.
      sources: [dbist-adoption-2026]
  own_words:
    - quote: "When it comes to regulation – we will be pro-growth and pro-innovation."
      speaker: Keir Starmer
      role: Prime Minister (2024 to 2026)
      date: 2025-01-13
      source: gov-starmer-speech-2025
      voice: government
    - quote: "I am setting out a distinctively British approach to AI."
      speaker: John Healey
      role: Chancellor of the Exchequer
      date: 2026-10
      source: silicon-biosecurity-2026
      voice: government
    - quote: "AI is likely the most significant technology in human history,"
      speaker: Kanishka Narayan
      role: AI Minister
      source: techmag-dsit-2026
      voice: government
    - quote: "To keep the public safe, governments need to understand advanced AI."
      speaker: AI Security Institute
      role: Research organisation within government
      source: aisi-about
      voice: public_body
    - quote: "Mitigating the threat from superintelligence must be treated as a national security priority"
      speaker: Alex Sobel
      role: Labour and Co-operative MP for Leeds Central and Headingley
      date: 2026-07-28
      source: politicshome-sobel-2026
      voice: parliament
    - quote: "The government has committed to the kind of governance regime that we and many others have called for"
      speaker: Michael Birtwistle
      role: Associate Director, Ada Lovelace Institute
      date: 2026-11-04
      source: ada-frt-2026
      voice: civil_society
    - quote: "Urgent action is needed to ensure that people are protected from the risks and harms of AI-powered decision making"
      speaker: Trades Union Congress (TUC)
      role: Federation of trade unions
      source: tuc-ai-bill
      voice: labour
    - quote: "Tech giants should not profit from stolen content, or use it for free"
      speaker: News Media Association, Make It Fair campaign
      role: Trade body for UK news publishers
      source: nma-make-it-fair
      voice: creative_sector
  outside_analysis:
    - text: >-
        A New York Times report described the AI Security Institute as having "no regulatory power",
        and reported that it had found major safety gaps in every leading AI model it tested.
      sources: [nyt-aisi-2026]
    - text: >-
        A US law firm's tracker described the creation of a Cabinet-level AI minister as "a sign of
        the UK government's increased focus on AI".
      sources: [akin-ai-minister-2026]

news:
  meta:
    checked: 2026-11-18
    evidence_depth: rich
    review: draft
  items:
    - id: facial-recognition-bill
      headline: Government announces law on police use of facial recognition
      date: 2026-11-04
      kind: development
      summary: >-
        The Home Office announced a Bill and codes of practice on police use of facial recognition.
        The Ada Lovelace Institute welcomed the plan and asked for the code on private-sector use to
        be mandatory.
      why_it_matters: >-
        It would set statutory rules for one specific use of AI while the UK has no general AI law.
        Public concern about this use differs across political groups.
      sources: [ada-frt-2026, natcen-bsa-2025]
      topics: [biometrics, policing, legislation]
    - id: sector-study-2026
      headline: Government publishes AI sector study and business adoption survey
      date: 2026-10-29
      kind: development
      stream: ai
      summary: >-
        The sector study estimates that AI companies added £18.6bn in gross value added and raised
        £6.3bn in investment. On the adoption survey's own measure, 32% of businesses were using AI,
        up from 16% in 2025. Other figures from both are in Culture and industry and in the five
        principles section.
      why_it_matters: >-
        The more widely AI is used across the economy, the more work falls to sector regulators under
        the UK's approach.
      sources: [dbist-sector-2026, dbist-adoption-2026]
      topics: [industry, adoption, statistics]
    - id: ai-security-package
      headline: Chancellor announces AI Biosecurity Lab and more money for the AI Security Institute
      date: 2026-10-24
      kind: development
      summary: >-
        Ahead of the Autumn Budget, the Chancellor set out an AI package including a National AI
        Biosecurity Initiative, an AI Biosecurity Lab backed by model credits from OpenAI and
        Anthropic, more funding for the AI Security Institute, a National Cyber Shield using agentic
        AI, and annual funding to study AI's effect on jobs. The amounts are in the regulation
        section.
      why_it_matters: >-
        It directs new public money at specific AI risks, biological and cyber, and involves
        frontier developers directly in biosecurity work.
      sources: [gov-ai-package-2026, itv-biosecurity-2026, lbc-let-rip-2026]
      topics: [biosecurity, cybersecurity, funding, public-private partnership]
    - id: aisi-model-access
      headline: Minister says UK has access to safety-test the latest AI models
      date: 2026-10-12
      kind: development
      summary: >-
        A minister said the UK had been given access to safety-test the latest AI models, under
        voluntary agreements with developers. Reuters reported that the White House had earlier asked
        OpenAI and Anthropic to hold back new models from British testers pending a US review.
      why_it_matters: >-
        Testing of the most capable models depends on developers' cooperation, which parliamentarians
        have raised as a concern (see Areas for Improvement in AI Safety).
      sources: [reuters-aisi-access-2026, commons-sitc-2024]
      topics: [testing, frontier AI, United States]
    - id: yougov-ai-companies
      headline: Poll finds most Britons view AI companies unfavourably
      date: 2026-10-01
      kind: development
      summary: >-
        A YouGov survey found a majority with an unfavourable opinion of AI companies, a similar
        level to fast fashion firms, though below tobacco and gambling companies. The figures are in
        Public attitudes.
      why_it_matters: >-
        Low trust in developers shapes the political space for regulation and for public-private
        partnerships on AI safety.
      sources: [yougov-ai-companies-2026]
      topics: [public attitudes, trust]
    - id: superintelligence-ban-letter
      headline: Over 70 MPs and peers ask the Prime Minister to back a superintelligence ban
      date: 2026-09-11
      kind: development
      summary: >-
        A cross-party group of parliamentarians wrote to the Prime Minister supporting Alex Sobel's
        Artificial Superintelligence Bill and asking the UK to seek an international agreement
        during its G20 presidency. The government said it did not consider the bill's measures the
        right approach.
      why_it_matters: >-
        It puts a proposed prohibition on superintelligent AI, and loss-of-control risk, on the
        parliamentary agenda.
      sources: [tnw-sobel-letter-2026, politicshome-sobel-2026]
      topics: [superintelligence, legislation, parliament]
    - id: yougov-ai-liability
      headline: Most Britons say AI developers should be legally liable for harm
      date: 2026-08-20
      kind: development
      summary: >-
        In a YouGov survey, 61% supported stricter government regulation of AI testing, and most
        supported making companies legally liable for damage caused by their AI systems.
      why_it_matters: >-
        Public views on liability and testing bear directly on how pre-deployment evaluation might be
        governed.
      sources: [yougov-ai-blame-2026]
      topics: [public attitudes, liability, testing]
    - id: new-prime-minister
      headline: Andy Burnham becomes Prime Minister and brings AI into the Cabinet Office
      date: 2026-07-20
      kind: foundational
      summary: >-
        Keir Starmer resigned and Andy Burnham became Labour Prime Minister. On his first day he
        closed the Department for Science, Innovation and Technology, moved AI strategy and the AI
        Security Institute into the Cabinet Office and appointed Kanishka Narayan as AI minister
        attending Cabinet.
      why_it_matters: >-
        Who leads AI policy, and from which department, shapes the UK's priorities and its role in
        international AI safety cooperation.
      sources: [npr-burnham-2026, ggf-rewire-2026, akin-ai-minister-2026, techmag-dsit-2026]
      topics: [political change, machinery of government]
    - id: kings-speech-2026
      headline: King's Speech includes no dedicated AI bill
      date: 2026-05
      kind: foundational
      summary: >-
        The 2026 legislative programme did not include a dedicated AI bill. AI features in a
        Regulating for Growth Bill focused on regulatory sandboxes.
      why_it_matters: >-
        Binding rules for developers of the most capable models, discussed since 2024, are not
        currently scheduled.
      sources: [scl-kings-speech-2026, gov-regulation-response-2024]
      topics: [legislation]
    - id: copyright-report
      headline: Government steps back from AI training opt-out
      date: 2026-03-18
      kind: foundational
      summary: >-
        A report under the Data (Use and Access) Act 2025 said a broad copyright exception with an
        opt-out is no longer the government's preferred way forward.
      why_it_matters: >-
        Rules on training data affect where models are trained, what data they learn from, and
        relations between AI developers and the creative sector.
      sources: [gov-copyright-report-2026]
      topics: [copyright, training data]
    - id: new-delhi-declaration
      headline: UK endorses the New Delhi Declaration on AI Impact
      date: 2026-02-21
      kind: foundational
      summary: >-
        The UK was among 88 countries and international organisations, including the US, China and
        France, to endorse the declaration at India's AI Impact Summit.
      why_it_matters: >-
        It shows the UK's participation in the summit series it started at Bletchley Park in 2023.
      sources: [pti-new-delhi-2026]
      topics: [international cooperation, summits]
    - id: tech-prosperity-deal
      headline: UK and US sign Technology Prosperity Deal
      date: 2025-09-18
      kind: foundational
      stream: ai
      summary: >-
        The two governments signed a technology partnership during the US President's state visit,
        with a linked agreement on communications supply chain security and joint research on
        technologies including AI-enabled 6G.
      why_it_matters: >-
        A technology partnership with the US bears on the UK's choices on AI governance, compute and
        international positions.
      sources: [ntia-tpd-2025]
      topics: [international cooperation, United States]
    - id: aisi-renamed
      headline: AI Safety Institute renamed AI Security Institute
      date: 2025-02-14
      kind: foundational
      summary: >-
        The institute narrowed its focus to serious risks with security implications and said it
        would not focus on bias or freedom of speech.
      why_it_matters: >-
        It defined the scope of the UK's main public AI safety body around security risks rather than
        bias or speech.
      sources: [gov-aisi-rename-2025]
      topics: [institutions, national security]
    - id: paris-statement
      headline: UK does not sign the Paris AI Action Summit statement
      date: 2025-02-11
      kind: foundational
      summary: >-
        Downing Street said the declaration did not reflect the UK's policy positions on opportunity
        and security, and lacked practical clarity on global governance.
      why_it_matters: >-
        It showed the UK declining to join a multilateral AI statement, citing its positions on
        opportunity, security and global governance.
      sources: [lbc-paris-2025]
      topics: [international cooperation, summits]
    - id: opportunities-plan
      headline: Government adopts the AI Opportunities Action Plan
      date: 2025-01-13
      kind: foundational
      summary: >-
        The Prime Minister launched a plan to grow the AI sector and AI use, saying
        the government would be pro-growth on regulation and would make sure the technology is safe.
      why_it_matters: >-
        It set out the government's AI priorities, with adoption and economic growth first,
        alongside its approach to regulation.
      sources: [gov-ai-opportunities-2025, gov-starmer-speech-2025]
      topics: [strategy, growth]
    - id: bletchley-summit
      headline: UK hosts the first AI Safety Summit at Bletchley Park
      date: 2023-11-01
      kind: foundational
      summary: >-
        Countries attending signed the Bletchley Declaration, which warned of risks from "intentional
        misuse or unintended issues of control" of frontier AI.
      why_it_matters: >-
        It began the international AI summit series, which continued in Paris in 2025 and New Delhi
        in 2026.
      sources: [gov-bletchley-2023]
      topics: [international cooperation, summits, frontier AI]
    - id: deepmind-partnership
      headline: Google DeepMind and the government sign a research partnership
      date: 2025-12-11
      kind: foundational
      stream: ai
      summary: >-
        Under a voluntary memorandum with no financial commitments, Google DeepMind said it would open
        its first automated research lab in the UK, give UK scientists priority access to some of its
        models, expand its work with the AI Security Institute, and seek to develop a version of
        Gemini for teachers. The Prime Minister said it would help "harness developments in AI for
        public good".
      why_it_matters: >-
        It links a leading UK-based AI lab more closely to government science, education and safety
        research, on a voluntary basis.
      sources: [gov-deepmind-2025]
      topics: [companies, research, public-private partnership]
    - id: action-plan-one-year
      headline: Government reports on the first year of the AI Opportunities Action Plan
      date: 2026-01-29
      kind: foundational
      stream: ai
      summary: >-
        The government said it had met 38 of the plan's 50 actions, and that five AI Growth Zones
        across Great Britain were generating £28.2 billion in investment and more than 15,000 jobs.
        The Technology Secretary said success depends on people having "the confidence this
        technology is safe".
      why_it_matters: >-
        It shows the scale of public backing for AI infrastructure and adoption that the UK's
        approach to AI safety sits alongside.
      sources: [gov-one-year-on-2026]
      topics: [strategy, compute, investment]

principles:
  meta:
    checked: 2026-11-18
    evidence_depth: moderate
    review: draft
    gaps: >-
      We have not yet read each regulator's own strategic approach in full. Figures on enforcement
      under each principle are not published in one place, so the "In practice" figures come from
      sector surveys and individual cases.
  framework:
    name: the five principles
    nav: Five principles
    basis: own
    about:
      text: >-
        The UK government set out five cross-sector principles for regulators to apply within their
        own remits, and confirmed them in its February 2024 response to consultation.
      sources: [gov-regulation-response-2024]
  intro:
    - text: >-
        The UK does not regulate AI as a technology. In 2024 ministers asked existing regulators to
        set out how they would apply five cross-sector principles in their own areas, and 13
        regulators published strategic approaches, from the Bank of England and the Competition and
        Markets Authority to Ofsted and Ofqual.
      sources: [gov-regulators-approaches-2024, gov-regulation-response-2024]
    - text: >-
        Below, each principle is shown with what it asks, how far the law backs it, the laws,
        regulators and tools that carry it today, and figures on how it works in practice.
      sources: [gov-regulation-response-2024]
  items:
    - key: safety
      name: Safety, security and robustness
      short: Safety
      asks:
        text: >-
          AI systems should work in a robust, secure and safe way throughout their life, with risks
          identified, assessed and managed.
        sources: [gov-regulation-response-2024]
      footing: partly_binding
      footing_note:
        text: >-
          Product safety, medical device and online safety law apply in their own sectors. No law sets
          safety requirements for the most capable general-purpose models, and the AI Security
          Institute, which tests them, is not a regulator and relies on voluntary agreements.
        sources: [commons-sitc-2024, reuters-aisi-access-2026]
      how_it_works:
        - text: >-
            The AI Security Institute tests advanced models before and after release, with access
            granted by developers under voluntary agreements.
          sources: [reuters-aisi-access-2026, aisi-trends-2025]
        - text: >-
            Ofcom applies the Online Safety Act to AI chatbots that let users share content, search
            the web, or can generate pornographic content. Chatbots that do none of these fall outside
            the Act, and the Secretary of State has said the government will look at how chatbots
            should be regulated.
          sources: [ofcom-x-2026]
        - text: >-
            The MHRA regulates AI medical devices and runs the AI Airlock, a regulatory sandbox for
            testing how its rules apply to AI in healthcare. Its findings include a need for guidance
            on synthetic data and stronger monitoring after products reach the market.
          sources: [mhra-airlock-2025]
        - text: >-
            The AI Cyber Security Code of Practice, published in January 2025, sets baseline security
            principles for organisations that develop and deploy AI. The UK submitted it to the
            European standards body ETSI as the basis for a global standard.
          sources: [gov-ai-cyber-code-2025]
      regulators: [Ofcom, MHRA, Health and Safety Executive, Office for Nuclear Regulation]
      evidence:
        - text: >-
            By December 2025 the AI Security Institute had evaluated more than 30 frontier models. In
            its tests, models completed apprentice-level cyber tasks 9% of the time in late 2023 and
            50% of the time by late 2025.
          sources: [aisi-trends-2025]
        - text: >-
            Ofcom opened an investigation into X in January 2026 over sexualised images made with its
            Grok chatbot, examining whether X assessed the risk and removed illegal content quickly. It
            was still open when this page was checked.
          sources: [ofcom-x-2026]

    - key: transparency
      name: Transparency and explainability
      short: Transparency
      asks:
        text: >-
          People should be told when and how AI is used, and organisations should be able to explain
          how a system reaches its outputs, in a way that suits the context and the risk.
        sources: [gov-regulation-response-2024]
      footing: partly_binding
      footing_note:
        text: >-
          Data protection law requires information about solely automated decisions with significant
          effects, and central government must record its algorithmic tools. We found no UK law that
          requires AI-generated content to be labelled. China, South Korea and the EU have such rules.
        sources: [ico-adm-safeguards-2026, gds-atrs-2025, loeb-china-labelling-2025, cooley-korea-2026, sidley-omnibus-2026]
      how_it_works:
        - text: >-
            Central government departments must publish a record under the Algorithmic Transparency
            Recording Standard for tools that significantly influence decisions with public effect or
            that interact directly with the public. This became mandatory in 2024 and is being
            extended to arm's-length bodies.
          sources: [gds-atrs-2025]
        - text: >-
            Since the Data (Use and Access) Act 2025, organisations that make solely automated
            decisions with significant effects must give people information about those decisions.
          sources: [ico-adm-safeguards-2026]
      regulators: [ICO, FCA, CMA]
      evidence:
        - text: >-
            By May 2025 the government had published 59 algorithmic transparency records, 53 of them in
            the previous 12 months.
          sources: [gds-atrs-2025]
        - text: >-
            In a 2024 Bank of England and FCA survey of 118 financial firms, 46% said they had only a
            partial understanding of the AI they use, against 34% reporting complete understanding. A
            third of AI uses were third-party implementations.
          sources: [boe-fca-2024]

    - key: fairness
      name: Fairness
      short: Fairness
      asks:
        text: >-
          AI should not undermine people's legal rights, discriminate unfairly or create unfair market
          outcomes.
        sources: [gov-regulation-response-2024]
      footing: binding
      footing_note:
        text: >-
          Equality, data protection and consumer law apply to decisions made with AI as to any other
          decision. Whether a regulator can enforce them depends on the sector, and many regulators
          cannot require compliance with every principle.
        sources: [ada-regulating-2023, gov-regulators-approaches-2024]
      how_it_works:
        - text: >-
            The Equality and Human Rights Commission, the ICO, the Competition and Markets Authority
            and the FCA each published in 2024 how they apply the principles in their areas.
          sources: [gov-regulators-approaches-2024]
        - text: >-
            The ICO's AI and biometrics strategy, launched in June 2025, focuses on transparency and
            explainability, bias and discrimination, and rights and redress. Its priorities include
            recruitment by major employers, automated decisions in central government, police facial
            recognition and a statutory code of practice on AI and automated decision-making.
          sources: [insideprivacy-ico-2025]
      regulators: [Equality and Human Rights Commission, ICO, CMA, FCA, Ofsted, Ofqual]
      evidence:
        - text: >-
            In the government's 2026 AI adoption survey of 3,503 businesses, 56% of those using AI and
            60% of those planning to were concerned about bias and lack of accuracy.
          sources: [dbist-adoption-2026]

    - key: accountability
      name: Accountability and governance
      short: Accountability
      asks:
        text: >-
          There should be clear lines of responsibility for AI across its life cycle, with governance
          that ensures effective oversight of how it is supplied and used.
        sources: [gov-regulation-response-2024]
      footing: partly_binding
      footing_note:
        text: >-
          Data protection and sector rules, such as those for financial firms, assign responsibility
          to the organisations that use AI. No law assigns responsibility to developers of the most
          capable general-purpose models, for which the government said in 2024 that "further
          targeted binding requirements" may be needed.
        sources: [gov-regulation-response-2024, boe-fca-2024]
      how_it_works:
        - text: >-
            In financial services, firms apply existing rules to AI. Firms surveyed by the Bank of
            England and the FCA named data protection, operational resilience, third-party rules and
            the FCA's Consumer Duty as the main regulatory constraints on their use of AI.
          sources: [boe-fca-2024]
        - text: >-
            For government's own use of AI, the National Audit Office found that spending controls
            "do not provide assurance that AI risks have been mitigated".
          sources: [nao-ai-gov-2024]
      regulators: [ICO, FCA, Bank of England, Legal Services Board]
      evidence:
        - text: >-
            75% of financial firms were using AI in 2024 and a further 10% planned to within three
            years. 55% of their AI uses involved some automated decision-making, and 2% were fully
            autonomous.
          sources: [boe-fca-2024]
        - text: >-
            Across all sectors, 81% of businesses using AI reported some human oversight of it in 2026,
            slightly fewer than in 2025.
          sources: [dbist-adoption-2026]
        - text: >-
            In a 2024 National Audit Office survey of 89 government bodies, 37% of those responding had
            deployed AI and 70% were piloting or planning it.
          sources: [nao-ai-gov-2024]

    - key: contestability
      name: Contestability and redress
      short: Redress
      asks:
        text: >-
          People affected by an AI decision should be able to contest a harmful decision or outcome
          and get redress where appropriate.
        sources: [gov-regulation-response-2024]
      footing: partly_binding
      footing_note:
        text: >-
          Data protection law gives rights to challenge solely automated decisions with significant
          effects. There is no AI-specific route to redress, such as an ombudsman, for other
          decisions or for areas without a regulator.
        sources: [ico-adm-safeguards-2026, ada-regulating-2023]
      how_it_works:
        - text: >-
            For solely automated decisions with significant effects, organisations must let people
            make representations, obtain human intervention, meaning a review that could change the
            decision, and contest it. They must respond within one month, extendable by two months
            for complex cases.
          sources: [ico-adm-safeguards-2026]
        - text: >-
            Solely automated decisions using special category data, such as health or ethnicity,
            remain prohibited unless the person gives explicit consent, the decision is needed for a
            contract, or it is required or authorised by law.
          sources: [ico-adm-special-2026]
      regulators: [ICO]

areas_for_improvement:
  meta:
    checked: 2026-11-18
    evidence_depth: moderate
    review: draft
    gaps: >-
      Each area is one that a named source has identified, or, for labelling, where surveys show
      public support for a change. Several findings date from 2023 and
      2024 and some may since have been addressed. The government's own review of whether regulators
      need new powers, which the Commons committee asked for, has not been found in published form.
      Evidence on how well the approaches used elsewhere work is still early.
  intro:
    - text: >-
        The UK applies its five principles through existing regulators and the powers they already
        have. Parliamentarians, researchers and the AI Security Institute have identified areas where
        this could be strengthened, in legal powers, coverage, capacity and technical safeguards.
      sources: [commons-sitc-2024, ada-regulating-2023, aisi-trends-2025]
  items:
    - id: statutory-footing
      title: Statutory footing for the principles
      kind: legal_power
      principles: [safety, transparency, fairness, accountability, contestability]
      in_place:
        text: >-
          Each regulator applies the five principles within its own remit and powers, and regulators
          across sectors have published how they do so.
        sources: [gov-regulation-response-2024, gov-regulators-approaches-2024]
      identified:
        text: >-
          The principles are non-statutory. The Ada Lovelace Institute noted that many regulators
          "will be unable to force AI users and developers to comply with all the principles". The
          Commons Science, Innovation and Technology Committee recommended that the next government
          "should be ready to introduce new AI-specific legislation".
        sources: [ada-regulating-2023, commons-sitc-2024]
      elsewhere:
        - text: >-
            A general AI law with duties set by level of risk, fines and named enforcement
            authorities.
          used_in: [EU, KR]
          sources: [sidley-omnibus-2026, cooley-korea-2026]
        - text: >-
            A framework law without penalties that creates a central AI strategy body chaired by the
            head of government, alongside existing law and guidelines.
          used_in: [JP]
          sources: [fpf-japan-2025]
        - text: >-
            A statutory duty to have regard to the principles, and a common set of powers for
            regulators.
          proposed_by: Ada Lovelace Institute
          sources: [ada-regulating-2023]
        - text: >-
            An independent AI commissioner under a risk-based AI law.
          proposed_by: "Kenya's Artificial Intelligence Bill 2026 (not yet law)"
          sources: [ey-kenya-2026]

    - id: model-testing
      title: Access to the most capable models for testing
      kind: legal_power
      principles: [safety, accountability]
      in_place:
        text: >-
          The AI Security Institute tests advanced models under voluntary agreements with developers.
          In October 2026 a minister said the UK had access to test the latest models.
        sources: [reuters-aisi-access-2026]
      identified:
        text: >-
          The institute is not a regulator and cannot require access. In 2024 the Commons committee
          described reported difficulties in securing pre-deployment access, if accurate, as "a major
          concern". Reuters reported that the White House had asked OpenAI and Anthropic to hold back
          new models from British testers pending a US review, before access was confirmed. In July
          2026, according to eWeek, the minister did not rule out legislation on testing.
        sources: [commons-sitc-2024, reuters-aisi-access-2026, eweek-testing-2026]
      elsewhere:
        - text: >-
            Binding duties for developers of the largest models to publish a safety framework and
            transparency reports, with whistleblower protection and fines of up to $1 million per
            violation.
          used_in: [California]
          sources: [fpf-sb53-2025]
        - text: >-
            Safety duties for models trained with at least 10²⁶ operations, set out in a general AI
            law.
          used_in: [KR]
          sources: [cooley-korea-2026]
        - text: >-
            Legal obligations for providers of general-purpose AI models, with a voluntary code of
            practice as one way to show compliance.
          used_in: [EU]
          sources: [euronews-gpai-2025]
        - text: >-
            Voluntary testing agreements, as in the UK. The US agreements have "no statutory basis".
          used_in: [US]
          sources: [tnw-caisi-2026]

    - id: incident-reporting
      title: Reporting of AI incidents
      kind: capacity
      principles: [safety, accountability]
      in_place:
        text: >-
          Central government publishes records of the algorithmic tools it uses under the Algorithmic
          Transparency Recording Standard, which an incident reporting system could build on.
        sources: [gds-atrs-2025, cltr-incidents-2024]
      identified:
        text: >-
          The Centre for Long-Term Resilience found that UK regulation "lacks an effective incident
          reporting framework", so government has no central picture of AI incidents. It cited over
          10,000 safety incidents in deployed AI systems recorded by news outlets since 2014.
        sources: [cltr-incidents-2024]
      elsewhere:
        - text: >-
            Reporting of critical safety incidents by frontier developers to a state agency within 15
            days, or 24 hours where there is imminent danger of death or serious injury.
          used_in: [California]
          sources: [fpf-sb53-2025]
        - text: >-
            A system for government to report incidents in its own use of AI, building on the
            Algorithmic Transparency Recording Standard, plus a pilot incident database.
          proposed_by: Centre for Long-Term Resilience
          sources: [cltr-incidents-2024]
        - text: >-
            Incident reporting within a planned framework for testing, evaluating and releasing
            models.
          proposed_by: Government of Canada (in development)
          sources: [hub-canada-2026]

    - id: coverage
      title: Coverage of AI uses across regulators
      kind: coverage
      principles: [fairness, accountability, contestability]
      in_place:
        text: >-
          Regulators cover AI within their own sectors. Ofcom has set out which AI chatbots the Online
          Safety Act covers, and in November 2026 the government announced a bill on police use of
          facial recognition.
        sources: [gov-regulators-approaches-2024, ofcom-x-2026, ada-frt-2026]
      identified:
        text: >-
          The Ada Lovelace Institute identified "significant gaps" in which uses of AI regulators
          cover, and said that how the principles apply had not been set out for many sectors.
          Chatbots that do not share user content, search the web or generate pornography are outside
          the Online Safety Act, and the government has said it will look at how they should be
          regulated. The Commons committee asked for a review of whether regulators need new powers.
        sources: [ada-regulating-2023, ofcom-x-2026, commons-sitc-2024]
      elsewhere:
        - text: >-
            Guidance on how the principles apply where there is no specific regulator, and an AI
            ombudsman.
          proposed_by: Ada Lovelace Institute
          sources: [ada-regulating-2023]
        - text: >-
            Binding rules for particular services, such as filing generative AI services with a
            central regulator before launch.
          used_in: [CN]
          sources: [dpa-china-filings-2026]

    - id: regulator-capacity
      title: Regulators' funding and skills
      kind: capacity
      principles: [safety, transparency, fairness, accountability, contestability]
      in_place:
        text: >-
          Regulators received £10 million to build their AI capability, and some test new approaches
          in sandboxes, such as the MHRA's AI Airlock for AI in healthcare.
        sources: [gov-regulators-approaches-2024, mhra-airlock-2025]
      identified:
        text: >-
          The Commons committee considered the funding insufficient for the task. The National Audit
          Office reported that government bodies found it difficult to attract and keep staff with AI
          skills.
        sources: [commons-sitc-2024, nao-ai-gov-2024]
      elsewhere:
        - text: >-
            Shared testing and assurance tools that regulators and firms can all use, such as
            Singapore's AI Verify toolkit and its assurance sandbox.
          used_in: [SG]
          sources: [tfgi-singapore-2026]
        - text: >-
            One authority to coordinate sector regulators on AI, proposed for Brazil's data protection
            authority, which already runs an AI sandbox.
          proposed_by: "Brazilian bill (December 2025)"
          sources: [tozzini-brazil-2026]
        - text: >-
            A significant increase in regulators' funding for AI-related harms.
          proposed_by: Ada Lovelace Institute
          sources: [ada-regulating-2023]

    - id: safeguards
      title: Robustness of safeguards on advanced models
      kind: technical
      principles: [safety]
      in_place:
        text: >-
          Safeguards are improving. In the AI Security Institute's tests, the expert effort needed to
          find biological misuse jailbreaks rose about 40x between two models released six months
          apart.
        sources: [aisi-trends-2025]
      identified:
        text: >-
          The institute still found universal jailbreaks, ways around a model's safeguards, in every
          system it tested. It notes that a model's compliance in tests may not show whether its
          answers are accurate or usable by a novice.
        sources: [aisi-trends-2025]
      elsewhere:
        - text: >-
            Shared evaluation methods through the International Network for Advanced AI Measurement,
            Evaluation and Science, which the UK coordinates.
          used_in: [Australia, CA, EU, France, JP, KE, KR, SG, US]
          sources: [gov-network-2025]
        - text: >-
            A state AI safety research institute established in law, with a role in evaluating risk
            and setting standards.
          used_in: [KR]
          sources: [cooley-korea-2026]

    - id: content-labelling
      title: Labelling of AI-generated content
      kind: legal_power
      principles: [transparency]
      in_place:
        text: >-
          Ofcom applies the Online Safety Act to some AI chatbots, and is investigating X over
          sexualised images made with its Grok chatbot.
        sources: [ofcom-x-2026]
      identified:
        text: >-
          We found no UK law requiring AI-generated content to be labelled. In a survey for the ICO,
          most people said clear labelling is important (see Public attitudes).
        sources: [ico-omnibus-2026]
      elsewhere:
        - text: >-
            Visible labels on AI-generated text, images, audio, video and virtual scenes, and hidden
            labels in file metadata, required since September 2025.
          used_in: [CN]
          sources: [loeb-china-labelling-2025]
        - text: >-
            A duty to label content produced by generative AI, in force since January 2026.
          used_in: [KR]
          sources: [cooley-korea-2026]
        - text: >-
            Transparency duties for AI systems, applying from December 2026 for systems already on
            the market, with a new ban on AI that generates child sexual abuse material or
            non-consensual intimate images.
          used_in: [EU]
          sources: [sidley-omnibus-2026]

contacts:
  meta:
    checked: 2026-11-18
    evidence_depth: moderate
    review: draft
    gaps: >-
      A starting list, described from each organisation's own pages. Organisations in Scotland, Wales
      and Northern Ireland are not yet included. Regulators are listed through their joint forum.
  items:
    - name: Ada Lovelace Institute
      type: research_institute
      url: https://www.adalovelaceinstitute.org/
      based: London
      about:
        text: >-
          An independent research institute, set up by the Nuffield Foundation in 2018, with a mission
          "to ensure data and AI work for people and society".
        sources: [ada-about]
      links:
        - label: Contact
          url: https://www.adalovelaceinstitute.org/about/contact/
        - label: Newsletter
          url: https://adalovelaceinstitute.org/newsletter-subscribe
    - name: AI Security Institute
      type: government
      url: https://www.aisi.gov.uk/
      about:
        text: >-
          A research organisation within the UK government, working to equip governments with "a
          scientific understanding of the risks posed by advanced AI".
        sources: [aisi-about]
      links:
        - label: Careers
          url: https://www.aisi.gov.uk/careers
    - name: The Alan Turing Institute
      type: research_institute
      url: https://www.turing.ac.uk/
      about:
        text: >-
          The UK's national institute for data science and artificial intelligence, working with the
          Engineering and Physical Sciences Research Council.
        sources: [ukri-turing]
    - name: Centre for Long-Term Resilience
      type: civil_society
      url: https://www.longtermresilience.org/
      based: London
      about:
        text: >-
          An independent, non-profit think tank with a mission "to transform global resilience to
          extreme risks". Its work includes AI policy, such as a 2024 proposal for AI incident
          reporting.
        sources: [cltr-about, cltr-incidents-2024]
      links:
        - label: Work with us
          url: https://www.longtermresilience.org/work-with-us/
    - name: Centre for the Governance of AI (GovAI)
      type: research_institute
      url: https://www.governance.ai/
      based: London and Washington, DC
      about:
        text: >-
          A think tank that aims to help decision-makers in government and industry with the
          governance of AI. Its UK arm is a company limited by guarantee.
        sources: [govai-about]
      links:
        - label: Opportunities
          url: https://www.governance.ai/opportunities
    - name: Centre for the Study of Existential Risk
      type: university
      url: https://cser.ac.uk/
      based: Cambridge
      about:
        text: >-
          An interdisciplinary research centre within the University of Cambridge "dedicated to the
          study of existential risks".
        sources: [cser-about]
    - name: Digital Regulation Cooperation Forum
      type: network
      url: https://www.drcf.org.uk/
      about:
        text: >-
          A voluntary forum that brings together four UK regulators with responsibilities across the
          digital landscape: the Competition and Markets Authority, the Financial Conduct Authority,
          the Information Commissioner's Office and Ofcom.
        sources: [drcf-genai-2026]
    - name: Leverhulme Centre for the Future of Intelligence
      type: university
      url: https://lcfi.ac.uk/
      based: Cambridge
      about:
        text: >-
          An interdisciplinary research centre funded by the Leverhulme Trust, based at the University
          of Cambridge, with spokes at Imperial College London and the University of California,
          Berkeley.
        sources: [lcfi-about]
    - name: Oxford Martin AI Governance Initiative
      type: university
      url: https://aigi.ox.ac.uk/
      based: Oxford
      about:
        text: >-
          A research initiative at the University of Oxford's Oxford Martin School, with a mission "to
