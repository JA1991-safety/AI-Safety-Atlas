# The areas Common Ground covers or plans to cover.
# map_ids are ISO 3166-1 numeric codes used by the Natural Earth map shapes.
# The EU is treated as one area during the pilot, so all 27 member states map to it.

- code: GB
  name: United Kingdom
  region: Europe
  pilot: true
  map_ids: ["826"]
  languages: [en]

- code: US
  name: United States
  region: North America
  pilot: true
  map_ids: ["840"]
  languages: [en, es]

- code: CA
  name: Canada
  region: North America
  pilot: true
  map_ids: ["124"]
  languages: [en, fr]

- code: BR
  name: Brazil
  region: Latin America
  pilot: true
  map_ids: ["076"]
  languages: [pt]

- code: EU
  name: European Union
  region: Europe
  pilot: true
  map_ids: ["040", "056", "100", "191", "196", "203", "208", "233", "246", "250", "276", "300", "348", "372", "380", "428", "440", "442", "470", "528", "616", "620", "642", "703", "705", "724", "752"]
  marker: [14.5, 35.9] # Malta is too small to click at world scale
  languages: [en, fr, de, es, it]

